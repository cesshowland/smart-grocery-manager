const CategoriesPageState = { selectMode: false, selectedIds: new Set() };
const ShopPageState = { selectMode: false, selectedIds: new Set() };

PAGE_RENDERERS['categories'] = async (el) => {
  const categories = AppState.data.categories;
  const products = AppState.data.products;

  const countsByCategory = {};
  products.forEach(p => { countsByCategory[p.category] = (countsByCategory[p.category] || 0) + 1; });

  el.innerHTML = `
    <div class="page-header">
      <div class="page-header-row">
        <div>
          <div class="page-title">Categorías</div>
          <div class="page-sub">${categories.length} categoría${categories.length===1?'':'s'}</div>
        </div>
        <div class="flex items-center gap-2">
          <button class="btn btn-secondary btn-sm" id="catToggleSelect">${CategoriesPageState.selectMode ? 'Listo' : 'Editar'}</button>
          ${CategoriesPageState.selectMode ? '' : '<button class="btn btn-primary btn-sm" id="catAddCategory">＋ Nueva</button>'}
        </div>
      </div>
    </div>

    ${CategoriesPageState.selectMode ? `<div class="field-hint" style="margin-top:14px;">Toca para seleccionar. Mantén presionado y arrastra para reordenar.</div>` : ''}

    <div id="categoriesList"></div>
    <div id="catBulkBarSlot"></div>
  `;

  el.querySelector('#catToggleSelect').addEventListener('click', () => {
    CategoriesPageState.selectMode = !CategoriesPageState.selectMode;
    CategoriesPageState.selectedIds.clear();
    navigate('categories');
  });
  const addBtn = el.querySelector('#catAddCategory');
  if (addBtn) addBtn.addEventListener('click', () => openCategoryEditor(null, null, () => navigate('categories')));

  const listEl = el.querySelector('#categoriesList');
  if (categories.length === 0) {
    listEl.innerHTML = `
      <div class="gcard" style="margin-top:16px;"><div class="empty-state">
        <div class="empty-icon">🗂️</div>
        <div class="empty-title">Aún no tienes categorías</div>
        <div class="empty-sub">Toca ＋ Nueva para crear tu primera categoría.</div>
      </div></div>`;
    return;
  }

  function renderList() {
    listEl.innerHTML = categories.map(c => {
      const count = countsByCategory[c.name] || 0;
      const imgContent = c.imageUrl ? `<img src="${c.imageUrl}" alt="">` : c.icon;
      const isSelected = CategoriesPageState.selectedIds.has(c.id);
      return `
        <div class="cat-list-item ${CategoriesPageState.selectMode ? 'selectable' : ''} ${isSelected ? 'selected' : ''}" data-cat-id="${c.id}" data-cat-name="${escapeHTML(c.name)}" ${CategoriesPageState.selectMode ? 'draggable="true"' : ''}>
          ${CategoriesPageState.selectMode ? `
            <div class="cat-drag-handle">⠿</div>
            <div class="cat-select-check ${isSelected ? 'checked' : ''}" data-select-toggle="${c.id}">${isSelected ? '✓' : ''}</div>
          ` : ''}
          <div class="cat-list-img-ph" data-img="category-${escapeHTML(c.name)}">${imgContent}</div>
          <div class="cat-list-body">
            <div class="cat-list-text">
              <div class="cat-list-name">${escapeHTML(c.name)}</div>
              <div class="cat-list-desc">${escapeHTML(c.description || 'Productos frescos y variados')}</div>
              <div class="cat-list-count">${count}+ items</div>
            </div>
            ${CategoriesPageState.selectMode ? '' : '<svg class="cat-list-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
          </div>
        </div>`;
    }).join('');

    if (CategoriesPageState.selectMode) {
      listEl.querySelectorAll('[data-cat-id]').forEach(row => {
        row.addEventListener('click', () => {
          const id = row.dataset.catId;
          if (CategoriesPageState.selectedIds.has(id)) CategoriesPageState.selectedIds.delete(id);
          else CategoriesPageState.selectedIds.add(id);
          renderList();
          renderBulkBar();
        });
      });
      setupDragReorder(listEl, categories, null, {
        idAttr: 'catId',
        onReorder: async (orderedIds) => {
          await Promise.all(orderedIds.map((id, idx) => {
            const cat = categories.find(c => c.id === id);
            return Repo.saveCategory({ ...cat, order: idx });
          }));
          await refreshCoreData();
          showToast('Orden guardado', 'success');
        },
      });
    } else {
      let pressTimer = null;
      let longPressFired = false;
      listEl.querySelectorAll('[data-cat-name]').forEach(btn => {
        const catName = btn.dataset.catName;
        const cat = categories.find(c => c.name === catName);
        const start = () => {
          longPressFired = false;
          pressTimer = setTimeout(() => {
            longPressFired = true;
            if (navigator.vibrate) navigator.vibrate(12);
            openCategoryContextMenu(btn, cat, () => navigate('categories'));
          }, 480);
        };
        const cancel = () => { clearTimeout(pressTimer); };
        btn.addEventListener('touchstart', start, { passive: true });
        btn.addEventListener('touchend', cancel);
        btn.addEventListener('touchmove', cancel);
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', cancel);
        btn.addEventListener('mouseleave', cancel);
        btn.addEventListener('click', (e) => {
          if (longPressFired) { e.preventDefault(); e.stopPropagation(); return; }
          CatalogState.filterCategory = catName;
          CatalogState.filterSubcategory = null;
          CatalogState.fromCategories = true;
          CatalogState.view = 'grid';
          navigate('catalog');
        });
      });
    }
  }

  function renderBulkBar() {
    const slot = el.querySelector('#catBulkBarSlot');
    const n = CategoriesPageState.selectedIds.size;
    if (!CategoriesPageState.selectMode || n === 0) { slot.innerHTML = ''; return; }
    slot.innerHTML = `
      <div class="cat-bulk-bar">
        <span class="cat-bulk-count">${n} seleccionada${n===1?'':'s'}</span>
        <button class="btn btn-primary btn-sm" id="catBulkDelete" style="background:var(--red); box-shadow:none;">🗑 Eliminar</button>
      </div>`;
    slot.querySelector('#catBulkDelete').addEventListener('click', async () => {
      const ids = [...CategoriesPageState.selectedIds];
      const selectedCats = categories.filter(c => ids.includes(c.id));
      const blocked = selectedCats.filter(c => products.some(p => p.category === c.name));
      if (blocked.length > 0) {
        showToast(`No se puede eliminar: "${blocked[0].name}" tiene productos asignados`, 'error');
        return;
      }
      openModal({
        title: 'Eliminar categorías',
        bodyHTML: `<div style="font-size:13px; color:var(--text-dim); line-height:1.5;">¿Eliminar ${ids.length} categoría${ids.length===1?'':'s'} seleccionada${ids.length===1?'':'s'}? Esta acción no se puede deshacer.</div>`,
        footerHTML: `<button class="btn btn-secondary" data-close-modal style="flex:1;">Cancelar</button><button class="btn btn-primary" id="bulkDelConfirm" style="flex:1; background:var(--red); box-shadow:none;">Eliminar</button>`,
        onMount: (overlay) => {
          overlay.querySelector('[data-close-modal]').addEventListener('click', closeModal);
          overlay.querySelector('#bulkDelConfirm').addEventListener('click', async () => {
            try {
              await Promise.all(ids.map(id => Repo.deleteCategory(id)));
              await refreshCoreData();
              closeModal();
              showToast('Categorías eliminadas', 'info');
              CategoriesPageState.selectedIds.clear();
              navigate('categories');
            } catch (err) {
              console.error('Error eliminando categorías:', err);
              showToast('No se pudo eliminar: ' + (err && err.message ? err.message : 'error desconocido'), 'error');
            }
          });
        },
      });
    });
  }

  renderList();
  renderBulkBar();
};

  let selectedImage = (existing && existing.imageUrl) || null;

  openModal({
    title: existing ? 'Editar supermercado' : 'Nuevo supermercado',
    bodyHTML: `
      <div class="flex" style="align-items:flex-start; gap:12px; margin-bottom:14px;">
        <div id="storeImagePreview" class="product-image-preview">
          ${selectedImage ? `<img src="${selectedImage}" alt="">` : `<span id="storeIconPickerBtn" class="product-image-fallback">${selectedLogo}</span>`}

          <div class="field" style="margin-bottom:10px;">

          </div>

      </div>
      <div class="field">
        <div class="field-label">Moneda habitual</div>

      }
      bindIconBtn();

      iconGrid.querySelectorAll('[data-logo]').forEach(cell => {
        cell.addEventListener('click', () => {
          selectedLogo = cell.dataset.logo;
          iconGrid.querySelectorAll('.emoji-cell').forEach(c => c.classList.remove('selected'));
          cell.classList.add('selected');
          iconGrid.classList.add('hidden');
          if (!selectedImage) renderPreview();
        });
      });

      overlay.querySelector('#store_imageFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) { showToast('La imagen es muy grande (máx. 8MB)', 'error'); return; }
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 640;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            selectedImage = canvas.toDataURL('image/jpeg', 0.85);
            renderPreview();
          };
          img.onerror = () => { showToast('No se pudo procesar la imagen', 'error'); };
          img.src = reader.result;
        };
        reader.onerror = () => { showToast('No se pudo leer el archivo', 'error'); };
        reader.readAsDataURL(file);
      });

      overlay.querySelector('#store_imageUrlBtn').addEventListener('click', () => {
        urlField.classList.toggle('hidden');
        if (!urlField.classList.contains('hidden')) urlInput.focus();
      });
      urlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const url = urlInput.value.trim();
          if (url) { selectedImage = url; renderPreview(); urlField.classList.add('hidden'); }
        }
      });
      urlInput.addEventListener('blur', () => {
        const url = urlInput.value.trim();
        if (url) { selectedImage = url; renderPreview(); }
      });
      clearBtn.addEventListener('click', () => { selectedImage = null; renderPreview(); });

      overlay.querySelector('#sf_save').addEventListener('click', async () => {
        const name = overlay.querySelector('#sf_name').value.trim();
        if (!name) { showToast('El nombre es obligatorio', 'error'); return; }
        try {
          await Repo.saveStore({
            id: existing ? existing.id : undefined,
            name,
            logo: selectedLogo,
            imageUrl: selectedImage || null,
            location: overlay.querySelector('#sf_location').value.trim() || null,
            defaultCurrency: overlay.querySelector('#sf_currency').value,
            notes: overlay.querySelector('#sf_notes').value.trim() || null,
            favorite: overlay.querySelector('#sf_favorite').checked,
          });
          await refreshCoreData();
          closeModal();
          showToast(existing ? 'Supermercado actualizado' : 'Supermercado agregado', 'success');
          navigate('stores');
        } catch (err) {
          console.error('Error guardando supermercado:', err);
          showToast('No se pudo guardar: ' + (err && err.message ? err.message : 'error desconocido'), 'error');
        }
      });
      if (existing) {
        overlay.querySelector('#sf_delete').addEventListener('click', async () => {
          await Repo.deleteStore(existing.id);
          await refreshCoreData();
          closeModal();
          showToast('Supermercado eliminado', 'info');
          navigate('stores');
        });
      }
    },
  });
}

async function generateTestData() {
  let stores = await Repo.listStores();
  if (stores.length === 0) {
    const seedStores = [
      { name: 'Supermercado Nacional', logo: '🏪', defaultCurrency: 'DOP', favorite: true },
      { name: 'La Sirena', logo: '🏬', defaultCurrency: 'DOP', favorite: false },
    ];
    stores = await Promise.all(seedStores.map(s => Repo.saveStore(s)));
  }

  let products = await Repo.listProducts();
  const categories = await Repo.listCategories();
  const findCat = (name) => (categories.find(c => c.name === name) || {}).name || 'Otros';
  const seedProducts = [
    { name: 'Leche', icon: '🥛', category: findCat('Lácteos'), unit: 'litro', referencePrice: 185 },
    { name: 'Huevos', icon: '🥚', category: findCat('Huevos'), unit: 'docena', referencePrice: 220 },
    { name: 'Bananas', icon: '🍌', category: findCat('Frutas'), unit: 'unidad', referencePrice: 85 },
    { name: 'Pan integral', icon: '🍞', category: findCat('Panadería'), unit: 'unidad', referencePrice: 120 },
    { name: 'Arroz', icon: '🍚', category: findCat('Granos y cereales'), unit: 'kg', referencePrice: 65 },
    { name: 'Pollo', icon: '🍗', category: findCat('Carnes'), unit: 'lb', referencePrice: 95 },
    { name: 'Detergente', icon: '🧼', category: findCat('Limpieza'), unit: 'unidad', referencePrice: 280 },
    { name: 'Café', icon: '☕', category: findCat('Café y té'), unit: 'unidad', referencePrice: 310 },
  ];
  const productsByName = {};
  products.forEach(p => { productsByName[p.name] = p; });
  for (const sp of seedProducts) {
    if (!productsByName[sp.name]) {
      productsByName[sp.name] = await Repo.saveProduct(sp);
    }
  }
  const testProducts = Object.values(productsByName).filter(p => seedProducts.some(sp => sp.name === p.name));

  const now = new Date();

  // Distribución garantizada: varias compras en la semana actual, más en el mes, y algunas más viejas para el año.
  const daysAgoPool = [
    0, 1, 2,              // esta semana, seguro sin importar el día de hoy (3 compras)
    9, 14, 18, 22, 26,    // resto del mes (5 compras)
    45, 60, 80,           // meses anteriores, mismo año (3 compras)
    150, 220,             // más atrás en el año (2 compras)
  ];

  for (let i = 0; i < daysAgoPool.length; i++) {
    const daysAgo = daysAgoPool[i];
    const date = new Date(now.getTime() - daysAgo * 86400000);
    const store = stores[Math.floor(Math.random() * stores.length)];
    const itemCount = 3 + Math.floor(Math.random() * 5);
    const pickableProducts = testProducts.filter(p => p.name !== 'Leche');
    const shuffled = [...pickableProducts].sort(() => Math.random() - 0.5).slice(0, itemCount);

    let estimatedTotal = 0, realTotal = 0;
    const purchase = await Repo.savePurchase({
      listId: null, storeId: store.id, date: date.toISOString(), currency: 'DOP',
      estimatedTotal: 0, realTotal: 0, savings: 0, status: 'completed',
      boughtCount: itemCount, unavailableCount: 0, skippedCount: 0, totalCount: itemCount,
    });

    for (const p of shuffled) {
      const qty = 1 + Math.floor(Math.random() * 3);
      const priceVariance = 0.9 + Math.random() * 0.25;
      const realPrice = Math.round(p.referencePrice * priceVariance);
      estimatedTotal += p.referencePrice * qty;
      realTotal += realPrice * qty;
      await Repo.savePurchaseItem({
        purchaseId: purchase.id, productId: p.id, productName: p.name, productIcon: p.icon,
        category: p.category, quantity: qty, unit: p.unit,
        estimatedPrice: p.referencePrice, realPrice, date: date.toISOString(),
      });
      await Repo.addPrice({ productId: p.id, storeId: store.id, currency: 'DOP', amount: realPrice, date: date.toISOString() });
    }

    await Repo.savePurchase({ ...purchase, estimatedTotal, realTotal, savings: estimatedTotal - realTotal });
  }

  // Patrón garantizado para "Sugerido para ti": un producto con intervalo corto histórico,
  // pero cuya última compra fue hace más tiempo del habitual — dispara la sugerencia con certeza.
  const suggestibleProduct = productsByName['Leche'];
  if (suggestibleProduct) {
    const suggestibleDaysAgo = [26, 21, 16]; // compras cada ~5 días, la última hace 16 días
    for (const daysAgo of suggestibleDaysAgo) {
      const date = new Date(now.getTime() - daysAgo * 86400000);
      const store = stores[0];
      const purchase = await Repo.savePurchase({
        listId: null, storeId: store.id, date: date.toISOString(), currency: 'DOP',
        estimatedTotal: suggestibleProduct.referencePrice, realTotal: suggestibleProduct.referencePrice,
        savings: 0, status: 'completed', boughtCount: 1, unavailableCount: 0, skippedCount: 0, totalCount: 1,
      });
      await Repo.savePurchaseItem({
        purchaseId: purchase.id, productId: suggestibleProduct.id, productName: suggestibleProduct.name, productIcon: suggestibleProduct.icon,
        category: suggestibleProduct.category, quantity: 1, unit: suggestibleProduct.unit,
        estimatedPrice: suggestibleProduct.referencePrice, realPrice: suggestibleProduct.referencePrice, date: date.toISOString(),
      });
      await Repo.addPrice({ productId: suggestibleProduct.id, storeId: store.id, currency: 'DOP', amount: suggestibleProduct.referencePrice, date: date.toISOString() });
    }
  }
}

async function renderCategoriesList(pageEl) {
  const listEl = pageEl.querySelector('#categoriesList');
  const categories = await Repo.listCategories();
  if (categories.length === 0) {
    listEl.innerHTML = `<div class="gcard"><div class="empty-state" style="padding:20px;"><div class="empty-sub">Aún no tienes categorías.</div></div></div>`;
    return;
  }
  listEl.innerHTML = categories.map(c => `
    <div class="list-item-row settings-row" data-cat-id="${c.id}" draggable="true">
      <span style="cursor:grab; color:var(--text-faint); font-size:14px; flex-shrink:0;">⠿</span>
      <div class="item-icon-tile" style="width:34px; height:34px; font-size:16px;">${c.icon}</div>
      <div class="item-name" style="flex:1;">${escapeHTML(c.name)}</div>
      <button class="mini-btn" data-edit-cat="${c.id}" aria-label="Editar categoría" style="font-size:14px; color:var(--text-faint);">✎</button>
      <button class="mini-btn" data-delete-cat="${c.id}" aria-label="Eliminar categoría" style="font-size:14px; color:var(--text-faint);">🗑</button>
    </div>
  `).join('');

  listEl.querySelectorAll('[data-edit-cat]').forEach(b => b.addEventListener('click', () => {
    const cat = categories.find(c => c.id === b.dataset.editCat);
    openCategoryEditor(cat, pageEl);
  }));
  listEl.querySelectorAll('[data-delete-cat]').forEach(b => b.addEventListener('click', async () => {
    const cat = categories.find(c => c.id === b.dataset.deleteCat);
    const inUse = AppState.data.products.some(p => p.category === cat.name);
    if (inUse) { showToast('No se puede eliminar: hay productos usando esta categoría', 'error'); return; }
    openModal({
      title: 'Eliminar categoría',
      bodyHTML: `<div style="font-size:13px; color:var(--text-dim); line-height:1.5;">¿Eliminar "${escapeHTML(cat.name)}"? Esta acción no se puede deshacer.</div>`,
      footerHTML: `<button class="btn btn-secondary" data-close-modal style="flex:1;">Cancelar</button><button class="btn btn-primary" id="catDelConfirm" style="flex:1; background:var(--red); box-shadow:none;">Eliminar</button>`,
      onMount: (overlay) => {
        overlay.querySelector('[data-close-modal]').addEventListener('click', closeModal);
        overlay.querySelector('#catDelConfirm').addEventListener('click', async () => {
          await Repo.deleteCategory(cat.id);
          await refreshCoreData();
          closeModal();
          showToast('Categoría eliminada', 'info');
          renderCategoriesList(pageEl);
        });
      },
    });
  }));

  let draggedEl = null;
  listEl.querySelectorAll('[draggable="true"]').forEach(row => {
    row.addEventListener('dragstart', () => { draggedEl = row; row.style.opacity = '0.4'; });
    row.addEventListener('dragend', () => { row.style.opacity = ''; });
    row.addEventListener('dragover', (e) => {
      e.preventDefault();
      const after = getDragAfterElement(listEl, e.clientY);
      if (!draggedEl) return;
      if (after == null) listEl.appendChild(draggedEl); else listEl.insertBefore(draggedEl, after);
    });
  });
  listEl.addEventListener('drop', async (e) => {
    e.preventDefault();
    const orderedIds = [...listEl.querySelectorAll('[data-cat-id]')].map(x => x.dataset.catId);
    await Promise.all(orderedIds.map((id, idx) => {
      const cat = categories.find(c => c.id === id);
      return Repo.saveCategory({ ...cat, order: idx });
    }));
    await refreshCoreData();
    showToast('Orden de categorías guardado', 'success');
  });
}

      </div>
      <div class="field" style="margin-bottom:0;">
        <div class="field-label">Descripción (opcional)</div>
        <input type="text" class="input" id="cat_desc" placeholder="Ej. Fresh and Organic" value="${escapeHTML((existing&&existing.description)||'')}">
      </div>
    `,
    footerHTML: `
      <button class="btn btn-secondary" data-close-modal style="flex:1;">Cancelar</button>
      <button class="btn btn-primary" id="cat_save" style="flex:1;">${existing ? 'Guardar cambios' : 'Crear categoría'}</button>
    `,
    onMount: (overlay) => {
      overlay.querySelector('[data-close-modal]').addEventListener('click', closeModal);
      const iconGrid = overlay.querySelector('#catIconGrid');
      const previewEl = overlay.querySelector('#catImagePreview');
      const clearBtn = overlay.querySelector('#cat_imageClear');
      const urlField = overlay.querySelector('#cat_imageUrlField');
      const urlInput = overlay.querySelector('#cat_imageUrlInput');

      const subcatChipsEl = overlay.querySelector('#cat_subcatChips');
      function renderSubcatChips() {
        if (subcategories.length === 0) {
          subcatChipsEl.innerHTML = `<div class="field-hint">Aún no hay subcategorías.</div>`;
          return;
        }
        subcatChipsEl.innerHTML = subcategories.map((s, i) => `
          <div class="chip" style="padding-right:8px;">
            ${escapeHTML(s)}
            <button type="button" data-remove-subcat="${i}" style="margin-left:4px; color:var(--text-faint); font-weight:800;">✕</button>
          </div>
        `).join('');
        subcatChipsEl.querySelectorAll('[data-remove-subcat]').forEach(b => b.addEventListener('click', () => {
          subcategories.splice(Number(b.dataset.removeSubcat), 1);
          renderSubcatChips();
        }));
      }
      renderSubcatChips();

      const addSubcatBtn = overlay.querySelector('#cat_addSubcat');
      const newSubcatInput = overlay.querySelector('#cat_newSubcat');
      function addSubcat() {
        const val = newSubcatInput.value.trim();
        if (!val) return;
        if (subcategories.some(s => s.toLowerCase() === val.toLowerCase())) { showToast('Esa subcategoría ya existe', 'error'); return; }
        subcategories.push(val);
        newSubcatInput.value = '';
        renderSubcatChips();
      }
      addSubcatBtn.addEventListener('click', addSubcat);
      newSubcatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addSubcat(); } });

      function renderPreview() {
        if (selectedImage) {
          previewEl.innerHTML = `<img src="${selectedImage}" alt="">`;
          clearBtn.style.display = '';
        } else {
          previewEl.innerHTML = `<span id="catIconPickerBtn" class="product-image-fallback">${selectedIcon}</span>`;
          clearBtn.style.display = 'none';
          bindIconBtn();
        }
      }
      function bindIconBtn() {
        const btn = overlay.querySelector('#catIconPickerBtn');
        if (btn) btn.addEventListener('click', () => iconGrid.classList.toggle('hidden'));
      }
      bindIconBtn();

      iconGrid.querySelectorAll('[data-emoji]').forEach(cell => {
        cell.addEventListener('click', () => {
          selectedIcon = cell.dataset.emoji;
          iconGrid.querySelectorAll('.emoji-cell').forEach(c => c.classList.remove('selected'));
          cell.classList.add('selected');
          iconGrid.classList.add('hidden');
          if (!selectedImage) renderPreview();
        });
      });

      overlay.querySelector('#cat_imageFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) { showToast('La imagen es muy grande (máx. 8MB)', 'error'); return; }
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 640;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            selectedImage = canvas.toDataURL('image/jpeg', 0.85);
            renderPreview();
          };
          img.onerror = () => { showToast('No se pudo procesar la imagen', 'error'); };
          img.src = reader.result;
        };
        reader.onerror = () => { showToast('No se pudo leer el archivo', 'error'); };
        reader.readAsDataURL(file);
      });

      overlay.querySelector('#cat_imageUrlBtn').addEventListener('click', () => {
        urlField.classList.toggle('hidden');
        if (!urlField.classList.contains('hidden')) urlInput.focus();
      });
      urlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const url = urlInput.value.trim();
          if (url) { selectedImage = url; renderPreview(); urlField.classList.add('hidden'); }
        }
      });
      urlInput.addEventListener('blur', () => {
        const url = urlInput.value.trim();
        if (url) { selectedImage = url; renderPreview(); }
      });
      clearBtn.addEventListener('click', () => { selectedImage = null; renderPreview(); });

      overlay.querySelector('#cat_save').addEventListener('click', async () => {
        const name = overlay.querySelector('#cat_name').value.trim();
        if (!name) { showToast('El nombre es obligatorio', 'error'); return; }
        try {
          const oldName = existing && existing.name;
          await Repo.saveCategory({
            id: existing ? existing.id : undefined,
            name, icon: selectedIcon,
            imageUrl: selectedImage || null,
            subcategories,
            description: overlay.querySelector('#cat_desc').value.trim() || null,
            order: (existing && existing.order != null) ? existing.order : AppState.data.categories.length,
          });
          if (existing && oldName && oldName !== name) {
            const affected = AppState.data.products.filter(p => p.category === oldName);
            await Promise.all(affected.map(p => Repo.saveProduct({ ...p, category: name })));
          }
          await refreshCoreData();
          closeModal();
          showToast(existing ? 'Categoría actualizada' : 'Categoría creada', 'success');
          if (onDone) onDone();
          else if (pageEl) renderCategoriesList(pageEl);
        } catch (err) {
          console.error('Error guardando categoría:', err);
          showToast('No se pudo guardar: ' + (err && err.message ? err.message : 'error desconocido'), 'error');
        }
      });
    },
  });
}

function openCategoryContextMenu(anchorBtn, cat, onDone) {
  document.querySelectorAll('.ctx-menu').forEach(m => m.remove());
  const rect = anchorBtn.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.style.top = `${Math.min(rect.top + window.scrollY + 30, window.scrollY + window.innerHeight - 140)}px`;
  menu.style.left = `${Math.min(rect.left + window.scrollX + 20, window.innerWidth - 210)}px`;
  menu.innerHTML = `
    <button class="ctx-menu-item" data-cm="edit">✎ Editar categoría</button>
    <div class="ctx-menu-divider"></div>
    <button class="ctx-menu-item danger" data-cm="delete">🗑 Eliminar categoría</button>
  `;
  document.body.appendChild(menu);
  const closeMenu = (e) => { if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', closeMenu); } };
  setTimeout(() => document.addEventListener('click', closeMenu), 0);

  menu.querySelector('[data-cm="edit"]').addEventListener('click', () => {
    menu.remove();
    openCategoryEditor(cat, null, onDone);
  });
  menu.querySelector('[data-cm="delete"]').addEventListener('click', async () => {
    menu.remove();
    const inUse = AppState.data.products.some(p => p.category === cat.name);
    if (inUse) { showToast('No se puede eliminar: hay productos usando esta categoría', 'error'); return; }
    openModal({
      title: 'Eliminar categoría',
      bodyHTML: `<div style="font-size:13px; color:var(--text-dim); line-height:1.5;">¿Eliminar "${escapeHTML(cat.name)}"? Esta acción no se puede deshacer.</div>`,
      footerHTML: `<button class="btn btn-secondary" data-close-modal style="flex:1;">Cancelar</button><button class="btn btn-primary" id="catDelConfirm" style="flex:1; background:var(--red); box-shadow:none;">Eliminar</button>`,
      onMount: (overlay) => {
        overlay.querySelector('[data-close-modal]').addEventListener('click', closeModal);
        overlay.querySelector('#catDelConfirm').addEventListener('click', async () => {
          try {
            await Repo.deleteCategory(cat.id);
            await refreshCoreData();
            closeModal();
            showToast('Categoría eliminada', 'info');
            if (onDone) onDone();
          } catch (err) {
            console.error('Error eliminando categoría:', err);
            showToast('No se pudo eliminar: ' + (err && err.message ? err.message : 'error desconocido'), 'error');
          }
        });
      },
    });
  });
}

const StatsState = { period: 'month' };

function getPeriodRange(period, offset) {
  const now = new Date();
  if (period === 'week') {
    const day = now.getDay();
    const start = new Date(now); start.setDate(now.getDate() - day - offset * 7); start.setHours(0,0,0,0);
    const end = new Date(start); end.setDate(start.getDate() + 7);
    return { start, end };
  }
  if (period === 'year') {
    const start = new Date(now.getFullYear() - offset, 0, 1);
    const end = new Date(now.getFullYear() - offset + 1, 0, 1);
    return { start, end };
  }
  const start = new Date(now.getFullYear(), now.getMonth() - offset, 1);
  const end = new Date(now.getFullYear(), now.getMonth() - offset + 1, 1);
  return { start, end };
}

function bucketPurchases(purchases, period, range) {
  const buckets = [];
  const monthShort = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  if (period === 'week') {
    const labels = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    for (let i = 0; i < 7; i++) {
      const dayStart = new Date(range.start); dayStart.setDate(range.start.getDate() + i);
      const dayEnd = new Date(dayStart); dayEnd.setDate(dayStart.getDate() + 1);
      const total = purchases.filter(p => new Date(p.date) >= dayStart && new Date(p.date) < dayEnd).reduce((s,p)=>s+p.realTotal,0);
      buckets.push({ label: labels[dayStart.getDay()], sublabel: `${dayStart.getDate()} ${monthShort[dayStart.getMonth()]}`, total });
    }
  } else if (period === 'year') {
    const labels = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    for (let i = 0; i < 12; i++) {
      const mStart = new Date(range.start.getFullYear(), i, 1);
      const mEnd = new Date(range.start.getFullYear(), i + 1, 1);
      const total = purchases.filter(p => new Date(p.date) >= mStart && new Date(p.date) < mEnd).reduce((s,p)=>s+p.realTotal,0);
      buckets.push({ label: labels[i], sublabel: String(range.start.getFullYear()), total });
    }
  } else {
    const weeksInMonth = Math.ceil((range.end - range.start) / (7*86400000));
    for (let i = 0; i < weeksInMonth; i++) {
      const wStart = new Date(range.start); wStart.setDate(range.start.getDate() + i*7);
      const wEndRaw = new Date(wStart); wEndRaw.setDate(wStart.getDate() + 7);
      const wEnd = wEndRaw < range.end ? wEndRaw : range.end;
      const wEndInclusive = new Date(wEnd); wEndInclusive.setDate(wEnd.getDate() - 1);
      const total = purchases.filter(p => new Date(p.date) >= wStart && new Date(p.date) < wEnd).reduce((s,p)=>s+p.realTotal,0);
      const sameMonth = wStart.getMonth() === wEndInclusive.getMonth();
      const label = sameMonth
        ? `${wStart.getDate()}-${wEndInclusive.getDate()} ${monthShort[wStart.getMonth()]}`
        : `${wStart.getDate()} ${monthShort[wStart.getMonth()]}-${wEndInclusive.getDate()} ${monthShort[wEndInclusive.getMonth()]}`;
      buckets.push({ label, sublabel: `Sem. ${i+1}`, total });
    }
  }
  return buckets;
}

PAGE_RENDERERS['stats'] = async (el) => {
  const allPurchases = await Repo.listPurchases();
  if (allPurchases.length === 0) {
    el.innerHTML = `
      <div class="page-header"><div class="page-title">📊 Estadísticas</div><div class="page-sub">Basadas en tu historial real de compras</div></div>
      <div class="gcard" style="margin-top:20px;"><div class="empty-state">
        <div class="empty-icon">📊</div>
        <div class="empty-title">Aún no hay datos suficientes</div>
        <div class="empty-sub">Las estadísticas se calculan a partir de compras completadas. Se activan en cuanto exista historial.</div>
      </div></div>`;
    return;
  }

  const period = StatsState.period;
  const range = getPeriodRange(period, 0);
  const prevRange = getPeriodRange(period, 1);
  const currency = getPrimaryCurrency().code;

  const purchases = allPurchases.filter(p => { const d = new Date(p.date); return d >= range.start && d < range.end; });
  const prevPurchases = allPurchases.filter(p => { const d = new Date(p.date); return d >= prevRange.start && d < prevRange.end; });

  const totalNow = purchases.reduce((s,p)=>s+p.realTotal,0);
  const totalPrev = prevPurchases.reduce((s,p)=>s+p.realTotal,0);
  const delta = totalPrev > 0 ? Math.round(((totalNow - totalPrev) / totalPrev) * 100) : null;
  const avgPerPurchase = purchases.length ? totalNow / purchases.length : 0;

  const buckets = bucketPurchases(purchases, period, range);
  const maxBucket = Math.max(...buckets.map(b => b.total), 1);
  const peakIdx = buckets.reduce((best, b, i) => b.total > buckets[best].total ? i : best, 0);

  const byStoreCount = {};
  purchases.forEach(p => { byStoreCount[p.storeId] = (byStoreCount[p.storeId]||0) + 1; });
  const favStoreId = Object.entries(byStoreCount).sort((a,b)=>b[1]-a[1])[0];
  const favStoreName = favStoreId ? (AppState.data.stores.find(s => s.id === favStoreId[0]) || {}).name : null;

  const totalEstimated = allPurchases.reduce((s,p)=>s+(p.estimatedTotal||0),0);
  const totalReal = allPurchases.reduce((s,p)=>s+p.realTotal,0);
  const totalSavings = totalEstimated - totalReal;

  const activeBudgetList = AppState.data.lists.find(l => l.status === 'active' && l.budget);
  const budgetPct = activeBudgetList ? Math.min(100, Math.round((totalNow / activeBudgetList.budget) * 100)) : null;

  const purchaseIds = purchases.map(p => p.id);
  const periodItems = (await Promise.all(purchaseIds.map(id => Repo.listPurchaseItemsFor(id)))).flat();

  const byCategory = {};
  periodItems.forEach(pi => { const t = Number(pi.realPrice||0)*Number(pi.quantity||1); byCategory[pi.category] = (byCategory[pi.category]||0)+t; });
  const catEntries = Object.entries(byCategory).sort((a,b)=>b[1]-a[1]);
  const catTotal = catEntries.reduce((s,[,v])=>s+v,0) || 1;
  const donutColors = ['#5fae8c','#f2b06b','#7fa8d9','#e28b7d','#b399d4','#e0c368'];

  const productCounts = {};
  periodItems.forEach(pi => { productCounts[pi.productId] = productCounts[pi.productId] || { name: pi.productName, icon: pi.productIcon, count: 0 }; productCounts[pi.productId].count++; });
  const topProducts = Object.values(productCounts).sort((a,b)=>b.count-a.count).slice(0,5);
  const maxTop = topProducts.length ? topProducts[0].count : 1;

  const byStore = {};
  purchases.forEach(p => { const s = AppState.data.stores.find(x => x.id === p.storeId); const name = (s && s.name) || 'Sin definir'; byStore[name] = (byStore[name]||0)+p.realTotal; });
  const storeEntries = Object.entries(byStore).sort((a,b)=>b[1]-a[1]);

  let dashOffset = 0;
  const donutSegments = catEntries.map(([cat, val], i) => {
    const pct = (val / catTotal) * 100;
    const seg = `<circle cx="21" cy="21" r="15.91" fill="transparent" stroke="${donutColors[i % donutColors.length]}" stroke-width="4.5" stroke-dasharray="${pct.toFixed(1)} ${(100-pct).toFixed(1)}" stroke-dashoffset="${(100 - dashOffset + 25).toFixed(1)}"/>`;
    dashOffset += pct;
    return seg;
  }).join('');

  const ringCirc = 2 * Math.PI * 64;
  const ringOffset = budgetPct != null ? ringCirc * (1 - budgetPct/100) : ringCirc;

  el.innerHTML = `
    <div class="page-header"><div class="page-title">📊 Estadísticas</div></div>

    <div class="period-pill-row" id="statsPeriodRow">
      <button class="period-pill ${period==='week'?'active':''}" data-period="week">Semana</button>
      <button class="period-pill ${period==='month'?'active':''}" data-period="month">Mes</button>
      <button class="period-pill ${period==='year'?'active':''}" data-period="year">Año</button>
    </div>

    <div class="metric-card">
      <div class="metric-top-row">
        <div class="metric-label">Gasto total</div>
        ${delta != null ? `<div class="metric-delta ${delta<=0?'down':'up'}">${delta<=0?'↓':'↑'} ${Math.abs(delta)}% vs. ${period==='week'?'sem.':period==='year'?'año':'mes'} ant.</div>` : ''}
      </div>
      <div class="metric-value">${formatMoney(totalNow, currency)}</div>
      <div class="mbar-chart" id="statsBarChart">
        ${buckets.map((b, i) => `
          <div class="mbar-col" data-bar-index="${i}">
            <div class="mbar-tooltip ${i===peakIdx && b.total>0 ? '' : 'hidden'}" id="mbarTip${i}">${formatMoney(b.total, currency)}<div class="mbar-tooltip-sub">${b.label}${b.sublabel ? ' · ' + b.sublabel : ''}</div></div>
            <div class="mbar-fill ${b.total===0 ? 'empty' : ''} ${i===peakIdx && b.total>0 ? 'peak':''}" style="height:${b.total>0 ? Math.max(4, Math.round((b.total/maxBucket)*100)) : 100}%;"></div>
            <div class="mbar-day">${b.label}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="st-summary-grid3">
      <div class="st-summary-card3">
        <div class="st-summary-icon3" style="background:var(--accent-glow); color:var(--accent);">🛒</div>
        <div class="st-summary-label3">Compras</div>
        <div class="st-summary-value3">${purchases.length}</div>
      </div>
      <div class="st-summary-card3">
        <div class="st-summary-icon3" style="background:var(--amber-glow); color:var(--amber);">📈</div>
        <div class="st-summary-label3">Promedio</div>
        <div class="st-summary-value3">${formatMoney(avgPerPurchase, currency)}</div>
      </div>
      <div class="st-summary-card3">
        <div class="st-summary-icon3" style="background:rgba(63,143,214,0.15); color:var(--blue);">🏪</div>
        <div class="st-summary-label3">Favorito</div>
        <div class="st-summary-value3">${favStoreName ? escapeHTML(favStoreName) : '—'}</div>
      </div>
    </div>

    ${totalSavings !== 0 ? `
    <div class="savings-hero">
      <div class="savings-icon">💰</div>
      <div>
        <div class="savings-label">${totalSavings >= 0 ? 'Ahorro acumulado' : 'Diferencia acumulada'} (real vs. estimado)</div>
        <div class="savings-value">${formatMoney(Math.abs(totalSavings), currency)} ${totalSavings >= 0 ? 'ahorrados' : 'de más'}</div>
      </div>
    </div>` : ''}

    ${activeBudgetList ? `
    <div class="ring-hero">
      <div class="donut-title" style="text-align:left;">Presupuesto — ${escapeHTML(activeBudgetList.name)}</div>
      <div class="donut-sub" style="text-align:left;">${formatMoney(totalNow, currency)} de ${formatMoney(activeBudgetList.budget, currency)}</div>
      <div class="ring-hero-wrap">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle cx="75" cy="75" r="64" fill="none" stroke="var(--surface-3)" stroke-width="15"/>
          <circle cx="75" cy="75" r="64" fill="none" stroke="url(#ringGrad)" stroke-width="15" stroke-linecap="round" stroke-dasharray="${ringCirc.toFixed(1)}" stroke-dashoffset="${ringOffset.toFixed(1)}" transform="rotate(-90 75 75)"/>
          <defs><linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2fae86"/><stop offset="100%" stop-color="#1a9e78"/></linearGradient></defs>
        </svg>
        <div class="ring-hero-center">
          <div class="ring-hero-val">${budgetPct}%</div>
          <div class="ring-hero-lbl">usado</div>
        </div>
      </div>
    </div>` : ''}

    ${catEntries.length > 0 ? `
    <div class="donut-card">
      <div class="donut-title">Gasto por categoría</div>
      <div class="donut-sub">${period==='week'?'Esta semana':period==='year'?'Este año':'Este mes'}</div>
      <div class="donut-body">
        <div class="donut-ring-wrap">
          <svg width="100" height="100" viewBox="0 0 42 42">${donutSegments}</svg>
        </div>
        <div class="donut-legend2">
          ${catEntries.slice(0,5).map(([cat,val],i) => `
            <div class="donut-legend2-item">
              <div class="donut-dot2" style="background:${donutColors[i % donutColors.length]};"></div>
              <div class="donut-legend2-name">${escapeHTML(cat)}</div>
              <div class="donut-legend2-pct">${Math.round((val/catTotal)*100)}%</div>
            </div>`).join('')}
        </div>
      </div>
    </div>` : ''}

    ${topProducts.length > 0 ? `
    <div class="section-head"><div class="section-title">Productos más comprados</div></div>
    <div class="gcard" style="padding:6px 14px;">
      ${topProducts.map((p,i) => `
        <div class="tprow">
          <div class="tp-rank">${i+1}</div>
          <div class="tp-icon">${p.icon}</div>
          <div class="tp-name">${escapeHTML(p.name)}</div>
          <div class="tp-bar-track"><div class="tp-bar-fill" style="width:${Math.round((p.count/maxTop)*100)}%;"></div></div>
          <div class="tp-count">${p.count}</div>
        </div>`).join('')}
    </div>` : ''}

    ${storeEntries.length > 0 ? `
    <div class="section-head"><div class="section-title">Gasto por supermercado</div></div>
    <div class="gcard" style="padding:6px 14px;">
      ${storeEntries.map(([name,total]) => `
        <div class="tprow">
          <div class="tp-icon">🏪</div>
          <div class="tp-name">${escapeHTML(name)}</div>
          <div class="tp-amount">${formatMoney(total, currency)}</div>
        </div>`).join('')}
    </div>` : ''}
  `;

  el.querySelectorAll('[data-period]').forEach(btn => btn.addEventListener('click', () => {
    StatsState.period = btn.dataset.period;
    navigate('stats');
  }));

  const barChart = el.querySelector('#statsBarChart');
  if (barChart) {
    barChart.querySelectorAll('[data-bar-index]').forEach(col => {
      col.addEventListener('click', () => {
        const idx = col.dataset.barIndex;
        const tip = el.querySelector(`#mbarTip${idx}`);
        const wasHidden = tip.classList.contains('hidden');
        barChart.querySelectorAll('.mbar-tooltip').forEach(t => t.classList.add('hidden'));
        if (wasHidden) tip.classList.remove('hidden');
      });
    });
  }
};

PAGE_RENDERERS['catalog'] = async (el) => {

function openCatalogPickerModal(list, items, onDone, initialCategory) {
  const categories = AppState.data.categories;
  const products = AppState.data.products;
  let filterCategory = initialCategory || '';
  let search = '';

  function closeAndRefresh() {
    closeModal();
    if (onDone) onDone();
  }

  openModal({
    title: 'Agregar producto',
    bodyHTML: `
      <div class="inline-search" style="width:100%; margin-bottom:12px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#9aa39c" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="#9aa39c" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="text" placeholder="Buscar en tu catálogo..." id="cp_search">
      </div>
      <div class="tab-row mb-3" id="cp_catChips">
        <button class="tab-btn ${!filterCategory?'active':''}" data-cp-cat="">Todas</button>
        ${categories.map(c => `<button class="tab-btn ${filterCategory===c.name?'active':''}" data-cp-cat="${escapeHTML(c.name)}">${c.icon} ${escapeHTML(c.name)}</button>`).join('')}
      </div>
      <div id="cp_grid"></div>
    `,
    footerHTML: `<button class="btn btn-primary" id="cp_done" style="flex:1;">Listo</button>`,
    onMount: (overlay) => {
      overlay.querySelector('#cp_done').addEventListener('click', closeAndRefresh);
      const gridEl = overlay.querySelector('#cp_grid');
      const searchInput = overlay.querySelector('#cp_search');

      function render() {
        let list_ = products.filter(p => {
          if (filterCategory && p.category !== filterCategory) return false;
          if (search && !p.name.toLowerCase().includes(search.toLowerCase())) return false;
          return true;
        });
        if (list_.length === 0) {
          gridEl.innerHTML = `<div class="empty-state" style="padding:24px;">
            <div class="empty-icon" style="font-size:26px;">🥦</div>
            <div class="empty-title" style="font-size:13px;">${products.length === 0 ? 'Tu catálogo está vacío' : 'Sin resultados'}</div>
            <div class="empty-sub">${products.length === 0 ? 'Agrega productos desde el Catálogo primero.' : 'Prueba con otro término o categoría.'}</div>
          </div>`;
          return;
        }
        gridEl.innerHTML = `<div class="catalog-grid">${list_.map(p => {
          const inList = items.find(i => i.productId === p.id);
          const imgContent = p.imageUrl ? `<img src="${p.imageUrl}" alt="">` : (p.icon || '🛒');
          return `
            <button class="catalog-photo-card" data-pick-product="${p.id}">
              ${inList ? `<div class="catalog-photo-fav active" style="background:var(--accent-glow); color:var(--accent);">✓</div>` : ''}
              <div class="catalog-photo-wrap">${imgContent}</div>
              <div class="catalog-photo-body">
                <div class="catalog-photo-name">${escapeHTML(p.name)}</div>
                <div class="catalog-photo-meta">${inList ? `En la lista (${inList.quantity})` : (p.referencePrice ? formatMoney(p.referencePrice, p.referenceCurrency) : 'Tocar para agregar')}</div>
              </div>
            </button>`;
        }).join('')}</div>`;
        gridEl.querySelectorAll('[data-pick-product]').forEach(b => b.addEventListener('click', async () => {
          await quickAddProductToList(list, items, b.dataset.pickProduct);
          const updatedItems = await Repo.listItemsForList(list.id);
          items.length = 0;
          items.push(...updatedItems);
          render();
        }));
      }

      searchInput.addEventListener('input', () => { search = searchInput.value; render(); });
      overlay.querySelectorAll('[data-cp-cat]').forEach(btn => btn.addEventListener('click', () => {
        filterCategory = btn.dataset.cpCat;
        overlay.querySelectorAll('[data-cp-cat]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      }));

      render();
    },
  });
}

async function getBestPriceForProduct(productId, storeId) {
  let product = null;
  try {
    product = await Repo.getProduct(productId);
  } catch (err) {
    console.error('[getBestPriceForProduct] Error obteniendo producto:', err);
  }
  const referencePrice = (product && product.referencePrice) ? Number(product.referencePrice) : 0;

  if (!storeId) return referencePrice;

  try {
    const allPrices = await Repo.listPricesForProduct(productId);
    const storePrices = allPrices.filter(p => p.storeId === storeId && p.amount != null && Number(p.amount) > 0);
    if (storePrices.length > 0) {
      const mostRecent = [...storePrices].sort((a, b) => new Date(b.date) - new Date(a.date))[0];
      return Number(mostRecent.amount);
    }
  } catch (err) {
    console.error('[getBestPriceForProduct] Error obteniendo historial de precios:', err);
  }
  return referencePrice;
}

async function quickAddProductToList(list, items, productId) {
  try {
    const existingItem = items.find(i => i.productId === productId);
    if (existingItem) {
      await Repo.saveListItem({ ...existingItem, quantity: Number(existingItem.quantity || 1) + 1 });
    } else {
      const p = await Repo.getProduct(productId);
      const bestPrice = await getBestPriceForProduct(productId, list.storeId);
      await Repo.saveListItem({
        listId: list.id, productId, quantity: 1,
        unit: (p && p.unit) || 'unidad',
        estimatedPrice: bestPrice,
        realPrice: null, status: 'pending', priority: 'normal', notes: null,
      });
    }
    showToast('Producto añadido', 'success');
  } catch (err) {
    console.error('Error agregando producto a la lista:', err);
    showToast('No se pudo agregar: ' + (err && err.message ? err.message : 'error desconocido'), 'error');
  }
}

async function refreshListEditorItems(el, list) {
  const items = await Repo.listItemsForList(list.id);
  const totalEstimated = items.reduce((sum, i) => sum + Number(i.estimatedPrice || 0) * Number(i.quantity || 1), 0);
  const productsCountEl = el.querySelector('.le-hero-stats');
  if (productsCountEl) {
    const store = AppState.data.stores.find(s => s.id === list.storeId);
    el.querySelector('.le-hero-store').textContent = store ? store.name : 'Sin supermercado';
    const statValues = productsCountEl.querySelectorAll('.le-hero-stat-value');
    if (statValues[0]) statValues[0].textContent = items.length;
    if (statValues[1]) statValues[1].textContent = formatMoney(totalEstimated, list.currency);
  }
  await renderListItems(el.querySelector('#leItemsWrap'), list, items, el);
}

function setupDragReorder(container, sortedItems, list, opts) {
  if (!container) return;
  const idAttr = (opts && opts.idAttr) || 'itemId';
  let draggedEl = null;
  container.querySelectorAll('[draggable="true"]').forEach(row => {
    row.addEventListener('dragstart', () => { draggedEl = row; row.style.opacity = '0.4'; });
    row.addEventListener('dragend', () => { row.style.opacity = ''; });
    row.addEventListener('dragover', (e) => {
      e.preventDefault();
      const after = getDragAfterElement(container, e.clientY);
      if (!draggedEl) return;
      if (after == null) container.appendChild(draggedEl); else container.insertBefore(draggedEl, after);
    });
  });
  container.addEventListener('drop', async (e) => {
    e.preventDefault();
    const attrSelector = `data-${idAttr.replace(/([A-Z])/g, '-$1').toLowerCase()}`;
    const orderedIds = [...container.querySelectorAll(`[${attrSelector}]`)].map(x => x.dataset[idAttr]);
    if (opts && opts.onReorder) {
      await opts.onReorder(orderedIds);
      return;
    }
    await Promise.all(orderedIds.map((id, idx) => {
      const item = sortedItems.find(i => i.id === id);
      return Repo.saveListItem({ ...item, sortOrder: idx });
    }));
    showToast('Orden guardado', 'success');
  });
}
function getDragAfterElement(container, y) {
  const rows = [...container.querySelectorAll('[draggable="true"]:not([style*="opacity: 0.4"])')];
  return rows.reduce((closest, row) => {
    const box = row.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) return { offset, element: row };
    return closest;
  }, { offset: -Infinity }).element;
}

async function renderListItems(wrap, list, items, screenEl) {
  if (items.length === 0) {
    wrap.innerHTML = `
      <div style="text-align:center; margin-bottom:14px;">
        <div style="font-size:13px; font-weight:700; color:var(--text-dim);">Esta lista está vacía</div>
        <div class="field-hint">Toca "Agregar" para elegir productos de tu catálogo.</div>
      </div>
      <div class="catalog-grid">
        <button class="catalog-photo-card catalog-add-card" data-le-add-product="1" style="grid-column: 1 / -1; flex-direction:row; align-items:center; gap:14px; padding:14px;">
          <div class="catalog-add-plus" style="aspect-ratio:unset; width:56px; height:56px; flex-shrink:0;">＋</div>
          <div class="catalog-photo-body" style="padding:0; text-align:left;">
            <div class="catalog-photo-name" style="color:var(--text-dim);">Agregar producto</div>
          </div>
        </button>
      </div>`;
    const addCardBtn = wrap.querySelector('[data-le-add-product]');
    if (addCardBtn) addCardBtn.addEventListener('click', () => {
      openCatalogPickerModal(list, items, () => refreshListEditorItems(screenEl, list));
    });
    return;
  }

  const productsById = {};
  await Promise.all([...new Set(items.map(i => i.productId))].map(async id => { productsById[id] = await Repo.getProduct(id); }));

  let sorted = [...items];
  if (ListEditorState.sortBy === 'name') {
    sorted.sort((a,b) => ((productsById[a.productId]||{}).name||'').localeCompare((productsById[b.productId]||{}).name||''));
  } else if (ListEditorState.sortBy === 'price') {
    sorted.sort((a,b) => Number(b.estimatedPrice||0) - Number(a.estimatedPrice||0));
  } else if (ListEditorState.sortBy === 'custom') {
    sorted.sort((a,b) => (a.sortOrder ?? 9999) - (b.sortOrder ?? 9999));
  } else {
    sorted.sort((a,b) => ((productsById[a.productId]||{}).category||'').localeCompare((productsById[b.productId]||{}).category||''));
  }

  const isCustomMode = ListEditorState.sortBy === 'custom';
  const isGrouped = ListEditorState.groupByCategory && !isCustomMode;

  function itemRowHTML(item) {
    const p = productsById[item.productId] || {};
    const lineTotal = Number(item.estimatedPrice || 0) * Number(item.quantity || 1);
    return `
      <div class="list-item-row" data-item-id="${item.id}" ${isCustomMode ? `draggable="true"` : ''}>
        ${isCustomMode ? `<span style="cursor:grab; color:var(--text-faint); font-size:14px; flex-shrink:0;">⠿</span>` : ''}
        ${productThumbHTML(p)}
        <div style="flex:1; min-width:0;">
          <div class="item-name">${escapeHTML(p.name || 'Producto')}</div>
          <div class="item-meta">${item.quantity} ${item.unit} · ${formatMoney(item.estimatedPrice||0, list.currency)} c/u</div>
        </div>
        <div class="qty-stepper">
          <button data-qty-minus="${item.id}">−</button>
          <span class="qty-val">${item.quantity}</span>
          <button data-qty-plus="${item.id}">＋</button>
        </div>
        <div class="item-total">${formatMoney(lineTotal, list.currency)}</div>
        <button class="item-menu-btn" data-item-menu="${item.id}">⋯</button>
      </div>`;
  }

  function itemCardHTML(item) {
    const p = productsById[item.productId] || {};
    const lineTotal = Number(item.estimatedPrice || 0) * Number(item.quantity || 1);
    const imgContent = p.imageUrl ? `<img src="${p.imageUrl}" alt="">` : (p.icon || '🛒');
    return `
      <div class="catalog-photo-card" data-item-id="${item.id}" style="text-align:left; position:relative;">
        <button class="item-menu-btn" data-item-menu="${item.id}" style="position:absolute; top:6px; right:6px; z-index:2; background:rgba(255,255,255,0.75); border-radius:50%; width:26px; height:26px; backdrop-filter:blur(8px);">⋯</button>
        <div class="catalog-photo-wrap">${imgContent}</div>
        <div class="catalog-photo-body">
          <div class="catalog-photo-name">${escapeHTML(p.name||'Producto')}</div>
          <div class="catalog-photo-meta">${item.quantity} ${item.unit} · ${formatMoney(lineTotal, list.currency)}</div>
          <div class="qty-stepper" style="margin-top:8px; width:100%; justify-content:space-between;">
            <button data-qty-minus="${item.id}">−</button>
            <span class="qty-val">${item.quantity}</span>
            <button data-qty-plus="${item.id}">＋</button>
          </div>
        </div>
      </div>`;
  }

  const addRowHTML = `
    <button class="list-item-row" data-le-add-product="1" style="text-align:left; border-style:dashed; background:var(--surface-3); box-shadow:none;">
      <div class="item-icon-tile" style="background:transparent; border:1.5px dashed var(--border-strong); color:var(--text-faint);">＋</div>
      <div style="flex:1;"><div class="item-name" style="color:var(--text-dim);">Agregar producto</div></div>
    </button>`;
  const addCardHTML = `
    <button class="catalog-photo-card catalog-add-card" data-le-add-product="1">
      <div class="catalog-add-plus">＋</div>
      <div class="catalog-photo-body">
        <div class="catalog-photo-name" style="color:var(--text-dim);">Agregar</div>
      </div>
    </button>`;

  if (isCustomMode) {
    wrap.innerHTML = `<div style="display:flex; flex-direction:column; gap:8px;" id="dragList">${sorted.map(itemRowHTML).join('')}</div>${addRowHTML}`;
    setupDragReorder(wrap.querySelector('#dragList'), sorted, list);
  } else if (isGrouped) {
    const byCategory = {};
    sorted.forEach(item => {
      const catName = (productsById[item.productId]||{}).category || 'Otros';
      (byCategory[catName] ||= []).push(item);
    });
    const groupsHTML = Object.entries(byCategory).map(([cat, catItems]) => {
      const catMeta = AppState.data.categories.find(c => c.name === cat);
      const groupAddCardHTML = `<button class="catalog-photo-card catalog-add-card" data-le-add-product-cat="${escapeHTML(cat)}"><div class="catalog-add-plus">＋</div><div class="catalog-photo-body"><div class="catalog-photo-name" style="color:var(--text-dim);">Agregar</div></div></button>`;
      const groupAddRowHTML = `<button class="list-item-row" data-le-add-product-cat="${escapeHTML(cat)}" style="text-align:left; border-style:dashed; background:var(--surface-3); box-shadow:none;"><div class="item-icon-tile" style="background:transparent; border:1.5px dashed var(--border-strong); color:var(--text-faint);">＋</div><div style="flex:1;"><div class="item-name" style="color:var(--text-dim);">Agregar a ${escapeHTML(cat)}</div></div></button>`;
      const body = ListEditorState.view === 'grid'
        ? `<div class="catalog-grid">${catItems.map(itemCardHTML).join('')}${groupAddCardHTML}</div>`
        : `<div style="display:flex; flex-direction:column; gap:8px;">${catItems.map(itemRowHTML).join('')}${groupAddRowHTML}</div>`;
      return `
        <div style="margin-bottom:26px;">
          <div class="section-head" style="margin:0 0 12px 0;"><div class="section-title" style="font-size:13px;">${(catMeta&&catMeta.icon)||'📦'} ${escapeHTML(cat)}</div></div>
          ${body}
        </div>`;
    }).join('');
    wrap.innerHTML = groupsHTML;
  } else if (ListEditorState.view === 'grid') {
    const cards = sorted.map(itemCardHTML).join('') + addCardHTML;
    wrap.innerHTML = `<div class="catalog-grid">${cards}</div>`;
  } else {
    wrap.innerHTML = `<div style="display:flex; flex-direction:column; gap:8px;">${sorted.map(itemRowHTML).join('')}</div>${addRowHTML}`;
  }

  const addProductTrigger = wrap.querySelector('[data-le-add-product]');
  if (addProductTrigger) addProductTrigger.addEventListener('click', () => {
    openCatalogPickerModal(list, items, () => refreshListEditorItems(screenEl, list));
  });
  wrap.querySelectorAll('[data-le-add-product-cat]').forEach(b => b.addEventListener('click', () => {
    openCatalogPickerModal(list, items, () => refreshListEditorItems(screenEl, list), b.dataset.leAddProductCat);
  }));

  wrap.querySelectorAll('[data-qty-plus]').forEach(b => b.addEventListener('click', async () => {
    const item = items.find(i => i.id === b.dataset.qtyPlus);
    await Repo.saveListItem({ ...item, quantity: Number(item.quantity||1) + 1 });
    await refreshListEditorItems(screenEl, list);
  }));
  wrap.querySelectorAll('[data-qty-minus]').forEach(b => b.addEventListener('click', async () => {
    const item = items.find(i => i.id === b.dataset.qtyMinus);
    const newQty = Number(item.quantity||1) - 1;
    if (newQty <= 0) { await Repo.deleteListItem(item.id); showToast('Producto quitado', 'info'); }
    else await Repo.saveListItem({ ...item, quantity: newQty });
    await refreshListEditorItems(screenEl, list);
  }));
  wrap.querySelectorAll('[data-item-menu]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const item = items.find(i => i.id === b.dataset.itemMenu);
    openListItemMenu(b, item, list, productsById[item.productId], screenEl);
  }));
}

const SORT_OPTIONS = [

function openSortMenu(anchorBtn, currentSort, onSelect) {
  document.querySelectorAll('.ctx-menu').forEach(m => m.remove());
  const rect = anchorBtn.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.style.top = `${rect.bottom + window.scrollY + 4}px`;
  menu.style.left = `${Math.min(rect.left + window.scrollX, window.innerWidth - 190)}px`;
  menu.innerHTML = SORT_OPTIONS.map(opt => `
    <button class="ctx-menu-item" data-sort="${opt.value}" style="display:flex; align-items:center; justify-content:space-between;">
      <span>${opt.icon} ${opt.label}</span>
      ${opt.value === currentSort ? '<span style="color:var(--accent); font-weight:800;">✓</span>' : ''}
    </button>
  `).join('');
  document.body.appendChild(menu);
  const closeMenu = (e) => { if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', closeMenu); } };
  setTimeout(() => document.addEventListener('click', closeMenu), 0);
  menu.querySelectorAll('[data-sort]').forEach(b => b.addEventListener('click', () => {
    menu.remove();
    onSelect(b.dataset.sort);
  }));
}

function openListItemMenu(anchorBtn, item, list, product, screenEl) {
  document.querySelectorAll('.ctx-menu').forEach(m => m.remove());
  const rect = anchorBtn.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.style.top = `${rect.bottom + window.scrollY + 4}px`;
  menu.style.left = `${Math.min(rect.left + window.scrollX - 140, window.innerWidth - 210)}px`;
  menu.innerHTML = `
    <button class="ctx-menu-item" data-mi="edit">✎ Editar cantidad/precio/nota</button>
    <div class="ctx-menu-divider"></div>
    <button class="ctx-menu-item danger" data-mi="delete">🗑 Eliminar de la lista</button>
  `;
  document.body.appendChild(menu);
  const closeMenu = (e) => { if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', closeMenu); } };
  setTimeout(() => document.addEventListener('click', closeMenu), 0);
  menu.querySelector('[data-mi="edit"]').addEventListener('click', () => { menu.remove(); openListItemEditor(item, list, product, screenEl); });

  const rawItems = await Repo.listItemsForList(list.id);
  const store = AppState.data.stores.find(s => s.id === list.storeId);
  const productsById = {};
  await Promise.all([...new Set(rawItems.map(i => i.productId))].map(async id => { productsById[id] = await Repo.getProduct(id); }));

  const items = [...rawItems];
  const sortBy = ListEditorState.sortBy;
  if (sortBy === 'name') {
    items.sort((a,b) => ((productsById[a.productId]||{}).name||'').localeCompare((productsById[b.productId]||{}).name||''));
  } else if (sortBy === 'price') {
    items.sort((a,b) => Number(b.estimatedPrice||0) - Number(a.estimatedPrice||0));
  } else if (sortBy === 'custom') {
    items.sort((a,b) => (a.sortOrder ?? 9999) - (b.sortOrder ?? 9999));
  } else {
    items.sort((a,b) => ((productsById[a.productId]||{}).category||'').localeCompare((productsById[b.productId]||{}).category||''));
  }

  const boughtItems = items.filter(i => i.status === 'bought');

    <div class="shopping-header">

        <svg class="pin" width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0119 9.5C19 14.8 12 21 12 21z" fill="var(--accent)"/><circle cx="12" cy="9.5" r="2.6" fill="#fff"/></svg>
        <div>

            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" style="display:inline; vertical-align:middle;"><path d="M6 9l6 6 6-6" stroke="var(--text)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>

      <div class="sh-topbar">
        <button class="le-back-btn" id="shBack">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div style="flex:1;"></div>
        <button class="btn btn-secondary btn-sm" id="shEditList">✎ Editar</button>
        <button class="btn btn-primary btn-sm" id="shFinish" ${boughtItems.length===0 ? 'style="opacity:0.5; pointer-events:none;"' : ''}>Finalizar</button>
      </div>

      <div class="shop-hero">
        ${pct === 100 ? `
        <div class="hero-complete">
          <div class="hero-complete-icon">🎉</div>
          <div class="hero-complete-title">¡Compra completa!</div>
          <div class="hero-complete-sub">Los ${items.length} productos de "${escapeHTML(list.name)}" están listos</div>
          <div class="hero-complete-stats">
            <div><div class="hero-complete-stat-label">Gastado</div><div class="hero-complete-stat-value">${formatMoney(spent, list.currency)}</div></div>
            <div><div class="hero-complete-stat-label">${list.budget ? 'Presupuesto' : 'Estimado'}</div><div class="hero-complete-stat-value">${formatMoney(list.budget || estimatedTotal, list.currency)}</div></div>
          </div>
          <button class="finish-cta" id="shFinishHero">Finalizar compra
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          ${overBudget ? `<div class="shop-hero-budget-warn" style="margin-top:10px;">🔴 Presupuesto superado</div>` : ''}
        </div>
        ` : `
        <div class="shop-hero-top">
          <div>
            <div class="shop-hero-name">${escapeHTML(list.name)}</div>
            <div class="shop-hero-count">${boughtItems.length} de ${items.length} productos</div>
          </div>
          <div class="shop-hero-ring-wrap">
            <svg width="68" height="68" viewBox="0 0 68 68">
              <circle cx="34" cy="34" r="${ringR}" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="7"/>
              <circle cx="34" cy="34" r="${ringR}" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="${ringCirc.toFixed(1)}" stroke-dashoffset="${ringOffset.toFixed(1)}" transform="rotate(-90 34 34)"/>

            <div class="shop-hero-ring-label">${pct}%</div>
          </div>
        </div>
        <div class="hero2-divider"></div>
        <div class="hero2-stats">
          <div class="hero2-stat">
            <div class="shop-hero-stat-label">Gastado</div>
            <div class="shop-hero-stat-value">${formatMoney(spent, list.currency)}</div>
          </div>
          <div class="hero2-stat">
            <div class="shop-hero-stat-label">${list.budget ? 'Presupuesto' : 'Estimado'}</div>
            <div class="shop-hero-stat-value">${formatMoney(list.budget || estimatedTotal, list.currency)}</div>
          </div>
        </div>
        ${list.budget
          ? `<div class="hero2-budget-bar"><div class="hero2-budget-fill ${overBudget?'over':''}" style="width:${Math.min(100, Math.round((spent/list.budget)*100))}%;"></div></div>`

        <button class="tab-btn ${ShoppingViewState.view==='list'?'active':''}" data-shview="list">☷ Lista</button>
        <button class="tab-btn ${ShoppingViewState.view==='grid'?'active':''}" data-shview="grid">▦ Grid</button>
        <button class="tab-btn ${ShoppingViewState.groupByCategory?'active':''}" id="shGroupToggle" style="margin-left:auto;">🗂️ Agrupar</button>
      </div>

        <span class="field-hint" style="margin:0;">Ordenar por</span>

          ${SORT_OPTIONS.find(o => o.value === ListEditorState.sortBy).icon} ${SORT_OPTIONS.find(o => o.value === ListEditorState.sortBy).label}

  el.querySelector('#shEditList').addEventListener('click', () => navigate('listEditor', { listId: list.id }));

      ListEditorState.sortBy = value;
      renderShoppingScreen(el, list);
    });
  });

  function itemCard(item) {
    const p = productsById[item.productId] || {};
    const priceUsed = item.status === 'bought' ? (item.realPrice ?? item.estimatedPrice ?? 0) : item.estimatedPrice ?? 0;
    let checkContent = '';
    let stateClass = '';
    if (item.status === 'bought') { checkContent = '✓'; stateClass = 'done'; }
    else if (item.status === 'unavailable') { checkContent = '✕'; stateClass = 'unavailable'; }
    else if (item.status === 'skipped') { checkContent = '–'; stateClass = 'unavailable'; }
    const imgContent = p.imageUrl ? `<img src="${p.imageUrl}" alt="">` : (p.icon || '🛒');
    const checkClass = item.status === 'bought' ? 'checked' : (item.status==='unavailable'||item.status==='skipped') ? 'unavailable-mark' : '';

    if (ShoppingViewState.view === 'grid') {
      return `
        <div class="gcard2 ${stateClass}" data-shop-item="${item.id}">
          <button class="gcard2-photo-btn" data-toggle-bought="${item.id}" aria-label="Marcar como comprado">
            <div class="gcard2-photo">${imgContent}</div>
            ${item.status ? `<div class="gcard2-badge ${checkClass}">${checkContent}</div>` : ''}
          </button>
          <div class="gcard2-body" data-open-price="${item.id}">
            <div class="gcard2-name">${escapeHTML(p.name||'Producto')}</div>
            <div class="gcard2-meta">${item.quantity} ${item.unit}${item.status==='unavailable' ? ' · No disp.' : ''}${item.status==='skipped' ? ' · Omitido' : ''}</div>
          </div>
          <div class="gcard2-footer">
            <div class="gcard2-price">${formatMoney(priceUsed * item.quantity, list.currency)}</div>
            <button class="item-menu-btn" data-item-status-menu="${item.id}">⋯</button>
          </div>
        </div>`;
    }

    return `
      <div class="pcard2 ${stateClass}" data-shop-item="${item.id}">
        <button class="check2 ${checkClass}" data-toggle-bought="${item.id}" aria-label="Marcar como comprado">${checkContent}</button>
        <div class="pcard2-thumb">${imgContent}</div>
        <div class="pcard2-info" data-open-price="${item.id}">
          <div class="pcard2-name">${escapeHTML(p.name||'Producto')}</div>
          <div class="pcard2-meta">${item.quantity} ${item.unit}${item.status==='unavailable' ? ' · No disponible' : ''}${item.status==='skipped' ? ' · Omitido' : ''}${item.notes ? ' · ' + escapeHTML(item.notes) : ''}</div>
          <div class="pcard2-price">${formatMoney(priceUsed * item.quantity, list.currency)}</div>
        </div>
        <button class="item-menu-btn" data-item-status-menu="${item.id}">⋯</button>
      </div>`;
  }

  const wrap = el.querySelector('#shItemsWrap');
  const gridWrapStyle = ShoppingViewState.view==='grid' ? 'display:grid; grid-template-columns:repeat(2,1fr); gap:10px;' : 'display:flex; flex-direction:column; gap:9px;';

  if (items.length === 0) {
    wrap.innerHTML = `<div class="gcard" style="margin-top:16px;"><div class="empty-state" style="padding:24px;"><div class="empty-icon" style="font-size:26px;">🛒</div><div class="empty-title" style="font-size:13px;">Esta lista está vacía</div></div></div>`;

    const byCategory = {};
    items.forEach(item => {
