<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC7BOX5DTw_CO7jF08xYqRt6emqpKWoBOw",
    authDomain: "smart-grocery-manager-3f385.firebaseapp.com",
    projectId: "smart-grocery-manager-3f385",
    storageBucket: "smart-grocery-manager-3f385.firebasestorage.app",
    messagingSenderId: "1072064021256",
    appId: "1:1072064021256:web:5566cf5de2b6bc231c22bd",
  };

  const fbApp = initializeApp(firebaseConfig);
  const fbAuth = getAuth(fbApp);
  const fbDb = getFirestore(fbApp);
  try { await enableIndexedDbPersistence(fbDb); } catch (e) { /* varias pestañas abiertas u navegador sin soporte: seguimos sin cache persistente extra */ }

  window.Firebase = {
    auth: fbAuth, db: fbDb,
    createUser: (email, pass) => createUserWithEmailAndPassword(fbAuth, email, pass),
    signIn: (email, pass) => signInWithEmailAndPassword(fbAuth, email, pass),
    signOutUser: () => signOut(fbAuth),
    resetPassword: (email) => sendPasswordResetEmail(fbAuth, email),
    onAuthChange: (cb) => onAuthStateChanged(fbAuth, cb),
    doc, setDoc, deleteDoc, collection, onSnapshot,
  };
  window.dispatchEvent(new Event('firebase-ready'));
</script>
<style>
:root {
  --bg-grad: linear-gradient(160deg, #eaf3ec 0%, #eef3e6 35%, #f6efe4 65%, #fbeee2 100%);
  --surface: rgba(255,255,255,0.45);
  --surface-2: rgba(255,255,255,0.65);
  --surface-3: rgba(255,255,255,0.35);
  --border: rgba(255,255,255,0.55);
  --border-strong: rgba(20,42,32,0.14);
  --glass-blur: blur(18px) saturate(160%);
  --glass-highlight: inset 0 1px 0 rgba(255,255,255,0.5);

  --text: #142a20;
  --text-dim: #5c6b62;
  --text-faint: #8a9691;

  --accent: #1a9e78;
  --accent-2: #2fae86;
  --accent-glow: rgba(26,158,120,0.16);
  --accent-ink: #ffffff;

  --amber: #f0973a;
  --amber-glow: rgba(240,151,58,0.15);
  --red: #e2503f;
  --red-glow: rgba(226,80,63,0.14);
  --blue: #3f8fd6;

  --radius-sm: 14px;
  --radius-md: 20px;
  --radius-lg: 26px;
  --radius-full: 999px;

  --shadow-sm: 0 2px 8px rgba(20,42,32,0.05);
  --shadow-md: 0 8px 24px rgba(20,42,32,0.08);
  --shadow-lg: 0 20px 52px rgba(20,42,32,0.14);

  --font-display: 'Poppins', -apple-system, sans-serif;
  --font-body: 'Nunito Sans', -apple-system, sans-serif;

  --bottomnav-h: 78px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg-grad);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

::-webkit-scrollbar { width: 0; height: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

#app {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
}
@media (min-width: 900px) {
  #app {
    max-width: 480px;
    box-shadow: var(--shadow-lg);
    border-radius: 32px;
    margin: 24px auto;
    height: calc(100vh - 48px);
  }
  body { display:flex; align-items:flex-start; justify-content:center; }
}

.app-header { padding: calc(18px + var(--safe-top)) 20px 0 20px; }
.top-row { display: flex; align-items: center; justify-content: space-between; }
.deliver-info { display: flex; align-items: flex-start; gap: 8px; }
.deliver-info .pin { margin-top: 3px; flex-shrink: 0; }
.deliver-label { font-size: 12px; color: var(--text-faint); }
.deliver-address { font-size: 14px; font-weight: 700; color: var(--text); }
.bell-btn {
  width: 42px; height: 42px; border-radius: 50%;

  border: 1px solid var(--border);

}

.search-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 0 20px; }

}
.search-bar input { border: none; background: transparent; outline: none; font-size: 13.5px; color: var(--text); width: 100%; }

}

.scroll-area { flex: 1; overflow-y: auto; padding-bottom: calc(var(--bottomnav-h) + 28px + var(--safe-bottom)); }

.greeting-block { margin-top: 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.greeting-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.greeting-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; color: var(--text); }

.home-savings-card { margin-top: 18px; background: var(--surface); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--border); box-shadow: var(--shadow-sm), var(--glass-highlight); border-radius: var(--radius-lg); padding: 16px 18px; display: flex; align-items: center; gap: 14px; }
.home-savings-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-glow); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.home-savings-label { font-size: 11px; color: var(--text-dim); }
.home-savings-value { font-size: 16px; font-weight: 800; color: var(--accent); margin-top: 2px; }
.home-savings-sub { font-size: 10.5px; color: var(--text-faint); margin-top: 3px; }

.home-active-hero { margin-top: 18px; background: linear-gradient(135deg, #2fae86, #1a9e78); border-radius: var(--radius-lg); padding: 18px; color: #fff; box-shadow: 0 10px 28px rgba(26,158,120,0.32); }
.home-active-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.home-active-name { font-family: var(--font-display); font-size: 15px; font-weight: 800; }
.home-active-sub { font-size: 11px; opacity: 0.85; margin-top: 2px; }
.home-active-ring-wrap { position: relative; width: 52px; height: 52px; flex-shrink: 0; }
.home-active-ring-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; }
.home-active-cta { margin-top: 14px; width: 100%; background: #fff; color: var(--accent); border-radius: 999px; padding: 11px; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; }

.home-section-sub { font-size: 10.5px; color: var(--text-faint); margin-top: -8px; margin-bottom: 10px; }

.home-sugg-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; }
.home-sugg-row + .home-sugg-row { border-top: 1px solid var(--border); }
.home-sugg-thumb { width: 44px; height: 44px; border-radius: 13px; background: var(--surface-3); display: flex; align-items: center; justify-content: center; font-size: 20px; overflow: hidden; flex-shrink: 0; }

.home-freq-photo { width: 100%; aspect-ratio: 1/1; background: var(--surface-3); display: flex; align-items: center; justify-content: center; font-size: 24px; overflow: hidden; }

.home-lastpurchase-card { margin-top: 22px; display: flex; align-items: center; gap: 12px; background: var(--surface); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--border); box-shadow: var(--shadow-sm); border-radius: var(--radius-md); padding: 13px 16px; }
.home-lastpurchase-icon { font-size: 18px; flex-shrink: 0; }

.home-lastpurchase-text b { color: var(--text); font-weight: 700; }

/* ---------- Shop page v2: hero + other-lists progress cards ---------- */
.shop-active-hero { margin-top: 18px; background: linear-gradient(135deg, #2fae86, #1a9e78); border-radius: var(--radius-lg); padding: 16px; color: #fff; box-shadow: 0 10px 28px rgba(26,158,120,0.32); position: relative; }
.shop-active-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.shop-active-ring-wrap { position: relative; width: 48px; height: 48px; flex-shrink: 0; }
.shop-active-ring-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; }

.shop-other-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--border); box-shadow: var(--shadow-sm), var(--glass-highlight); border-radius: var(--radius-md); width: 100%; text-align: left; }

.shop-other-pct { font-size: 11px; font-weight: 800; color: var(--accent); flex-shrink: 0; }

.quick-grid { margin-top: 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.quick-card {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm), var(--glass-highlight);
  border-radius: var(--radius-sm);
  padding: 14px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  transition: transform 0.15s ease;
}
.quick-card:active { transform: scale(0.96); }
.quick-icon {
  width: 38px; height: 38px; border-radius: 12px;
  background: var(--accent-glow); color: var(--accent);
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.quick-label { font-size: 11px; font-weight: 700; color: var(--text); line-height: 1.25; }

.section-head { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 12px 0; }
.section-title { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
.section-link { font-size: 12.5px; font-weight: 700; color: var(--accent); }

.gcard {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm), var(--glass-highlight);
  border-radius: var(--radius-md);
  padding: 18px;
}

.active-card {
  background: linear-gradient(120deg, rgba(185,226,204,0.55) 0%, rgba(205,234,219,0.45) 60%, rgba(228,244,234,0.35) 100%);

  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md), var(--glass-highlight);
  border-radius: var(--radius-md);
  padding: 18px;
}
.active-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.active-list-info { display: flex; align-items: center; gap: 10px; }
.active-list-icon {
  width: 40px; height: 40px; border-radius: 12px;
  background: rgba(255,255,255,0.5);
  display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0;
}
.active-list-name { font-size: 14px; font-weight: 700; color: var(--text); }
.active-list-store-btn {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(255,255,255,0.5);
  border-radius: var(--radius-full);
  padding: 3px 9px 3px 5px;
  margin-top: 3px;
  font-size: 11px; font-weight: 700; color: var(--text-dim);
}
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 800; padding: 4px 10px;
  border-radius: var(--radius-full);
  background: rgba(255,255,255,0.55); color: var(--accent);
  flex-shrink: 0;
}
.progress-track { width: 100%; height: 8px; background: rgba(255,255,255,0.4); border-radius: var(--radius-full); overflow: hidden; margin-bottom: 12px; }
.progress-fill { height: 100%; border-radius: var(--radius-full); background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }
.progress-fill.over { background: linear-gradient(90deg, var(--red), #f08a7d); }
.active-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.active-meta { font-size: 12px; color: var(--text-dim); font-weight: 600; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 13px; font-weight: 700; border-radius: var(--radius-full); padding: 10px 18px;
  transition: transform 0.12s ease; white-space: nowrap;
}
.btn:active { transform: scale(0.96); }
.btn-primary { background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: #fff; box-shadow: 0 6px 16px var(--accent-glow); }
.btn-secondary {
  background: var(--surface-2);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  color: var(--text); border: 1px solid var(--border);
}
.btn-sm { padding: 8px 14px; font-size: 12px; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 36px 20px; gap: 6px; }
.empty-icon { font-size: 34px; margin-bottom: 6px; opacity: 0.85; }
.empty-title { font-family: var(--font-display); font-size: 14.5px; font-weight: 700; color: var(--text); }
.empty-sub { font-size: 12.5px; color: var(--text-dim); max-width: 260px; margin-bottom: 12px; line-height: 1.5; }

.suggestion-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.suggestion-row + .suggestion-row { border-top: 1px solid var(--border); }
.suggestion-icon {
  width: 42px; height: 42px; border-radius: 12px; background: var(--surface-3);
  display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0;
}
.suggestion-name { font-size: 13px; font-weight: 700; color: var(--text); }
.suggestion-meta { font-size: 11px; color: var(--text-dim); margin-top: 1px; line-height: 1.4; }
.add-fab {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;
  flex-shrink: 0; box-shadow: 0 4px 10px var(--accent-glow);
}

.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 9px 14px; border-radius: var(--radius-full);
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);

.bottom-nav {
  position: absolute; bottom: 16px; left: 16px; right: 16px;
  height: 62px;
  margin-bottom: var(--safe-bottom);
  background: var(--surface-2);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg), var(--glass-highlight);
  border-radius: var(--radius-full);
  display: flex; align-items: center; justify-content: space-around;
  padding: 0 6px;
  z-index: 30;
}
@media (min-width: 900px) { .bottom-nav { position: absolute; } }
.nav-item {
  flex: 1; display: flex; align-items: center; justify-content: center;
  height: 46px; border-radius: var(--radius-full);
  transition: background 0.15s ease;
}
.nav-item.active { background: var(--accent-glow); }
.nav-item svg { color: var(--text-faint); }
.nav-item.active svg { color: var(--accent); }
.nav-item span { display: none; }
.nav-fab-wrap { display: flex; align-items: center; justify-content: center; padding: 0 2px; }
.nav-fab {
  width: 46px; height: 46px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  display: flex; align-items: center; justify-content: center;
  margin-top: 0; box-shadow: 0 4px 14px var(--accent-glow); position: relative;
}
.cart-badge {
  position: absolute; top: -2px; right: -2px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--red); color: #fff; font-size: 9px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; border: 2px solid #fff;
}

.skeleton { background: var(--surface-2); border-radius: var(--radius-md); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(10,20,15,0.45);
  backdrop-filter: blur(4px);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 100; animation: fadeIn 0.15s ease;
}
@media (min-width: 640px) { .modal-overlay { align-items: center; padding: 20px; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--surface-2);
  backdrop-filter: blur(30px) saturate(160%);
  -webkit-backdrop-filter: blur(30px) saturate(160%);
  border: 1px solid var(--border);
  border-radius: 26px 26px 0 0;
  box-shadow: var(--shadow-lg), var(--glass-highlight);
  width: 100%; max-width: 440px; max-height: 86vh;
  display: flex; flex-direction: column;
  animation: modalIn 0.2s cubic-bezier(0.2,0.8,0.2,1);
}
@media (min-width: 640px) { .modal { border-radius: var(--radius-lg); } }
@keyframes modalIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.modal-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; }
.modal-close {
  width: 32px; height: 32px; border-radius: 50%; background: var(--surface-3);
  display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--text-dim);
}
.modal-body { padding: 18px 20px; overflow-y: auto; }
.modal-footer { padding: 14px 20px 20px; display: flex; gap: 10px; flex-shrink: 0; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field-label { font-size: 12px; font-weight: 700; color: var(--text-dim); }
.input { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 13px; font-size: 14px; color: var(--text); width: 100%; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

/* ---------- Auth screen ---------- */
.auth-screen {
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; justify-content: center;
  padding: 28px 22px calc(28px + var(--safe-bottom));
  background: var(--bg);
}
.auth-logo {
  width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 18px;
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  box-shadow: 0 10px 24px var(--accent-glow);
  display: flex; align-items: center; justify-content: center; font-size: 28px;
}
.auth-title { font-family: var(--font-display); font-size: 22px; font-weight: 800; color: var(--text); text-align: center; }
.auth-sub { font-size: 13px; color: var(--text-dim); text-align: center; margin-top: 6px; margin-bottom: 28px; }
.auth-card {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md), var(--glass-highlight);
  border-radius: var(--radius-lg);
  padding: 22px 20px;
}
.auth-tabs { display: flex; gap: 6px; background: var(--surface-3); border-radius: 999px; padding: 4px; margin-bottom: 20px; }
.auth-tab { flex: 1; text-align: center; padding: 9px 0; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: var(--text-dim); }
.auth-tab.active { background: #fff; color: var(--accent); box-shadow: var(--shadow-sm); }
.auth-error { background: var(--red-glow); color: var(--red); font-size: 12px; font-weight: 600; padding: 10px 12px; border-radius: 12px; margin-bottom: 14px; display: none; }
.auth-error.show { display: block; }
.auth-switch { text-align: center; font-size: 12.5px; color: var(--text-dim); margin-top: 18px; }
.auth-switch button { color: var(--accent); font-weight: 700; }
.auth-forgot { text-align: right; font-size: 11.5px; color: var(--text-faint); margin-top: -8px; margin-bottom: 16px; }

/* ---------- Page header (secondary pages) ---------- */
.page-header { margin-top: 20px; margin-bottom: 16px; }
.page-header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-title { font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--text); }
.page-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }

/* ---------- Filter tabs (pill row) ---------- */
.tab-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.tab-btn {
  padding: 8px 14px;
  border-radius: var(--radius-full);
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  font-size: 12px; font-weight: 700; color: var(--text-dim);
  white-space: nowrap;
  flex-shrink: 0;
}
.tab-btn.active {
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  color: #fff; border-color: transparent;
  box-shadow: 0 4px 12px var(--accent-glow);
}

/* ---------- Search bar (secondary, inline) ---------- */
.inline-search {
  flex: 1; min-width: 160px; height: 44px;
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  border-radius: 14px;
  display: flex; align-items: center; gap: 8px; padding: 0 14px;
  box-shadow: var(--shadow-sm), var(--glass-highlight);
}
.inline-search input { border: none; background: transparent; outline: none; font-size: 13px; color: var(--text); width: 100%; }
.inline-search input::placeholder { color: var(--text-faint); }

/* ---------- Catalog filter row ---------- */
.cat-filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.cat-view-toggle {
  display: flex; align-items: center; flex-shrink: 0;
  height: 44px; padding: 3px;
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow-sm), var(--glass-highlight);
}
.cat-view-btn {
  width: 34px; height: 34px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-faint);
}
.cat-view-btn.active { background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: #fff; box-shadow: 0 3px 8px var(--accent-glow); }
.cat-fav-chip {
  display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
  padding: 8px 14px 8px 12px;
  border-radius: var(--radius-full);
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  font-size: 12px; font-weight: 700; color: var(--text-dim);
  white-space: nowrap;
}
.cat-fav-chip.active { background: var(--amber-glow); color: var(--amber); border-color: transparent; }

/* ---------- List cards grid ---------- */
.lists-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
.list-card {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm), var(--glass-highlight);
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex; flex-direction: column; gap: 8px;
  text-align: left;
  transition: transform 0.15s ease;
}
.list-card:active { transform: scale(0.97); }
.list-card-top { display: flex; align-items: center; justify-content: space-between; }
.list-card-icon { font-size: 22px; }
.list-card-badge {
  font-size: 9.5px; font-weight: 800;
  padding: 3px 8px; border-radius: var(--radius-full);
  background: var(--surface-3); color: var(--text-dim);
  border: 1px solid var(--border);
}
.list-card-name { font-size: 13.5px; font-weight: 700; color: var(--text); line-height: 1.3; }
.list-card-meta { font-size: 11px; color: var(--text-dim); line-height: 1.4; }

/* ---------- Toast ---------- */
.toast-stack {
  position: fixed; bottom: calc(var(--bottomnav-h) + 16px + var(--safe-bottom)); left: 0; right: 0;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  z-index: 200; pointer-events: none; padding: 0 20px;
}
.toast {
  background: var(--surface-2);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md), var(--glass-highlight);
  border-radius: var(--radius-full);
  padding: 11px 20px;
  font-size: 12.5px; font-weight: 700; color: var(--text);
  display: flex; align-items: center; gap: 8px;
  animation: toastIn 0.2s cubic-bezier(0.2,0.8,0.2,1);
  max-width: 400px;
}
.toast.error { color: var(--red); }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- List editor: item rows ---------- */
.list-item-row {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  padding: 12px 14px;
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm), var(--glass-highlight);
  border-radius: var(--radius-sm);
}
.item-icon-tile {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--surface-3);
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; flex-shrink: 0;
}
.item-name { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-meta { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
.item-total { font-size: 13px; font-weight: 800; color: var(--accent); width: 68px; text-align: right; flex-shrink: 0; }
.item-menu-btn { font-size: 17px; color: var(--text-faint); padding: 4px 6px; flex-shrink: 0; }

/* ---------- More page ---------- */
.more-hero {
  margin-top: 18px;
  background: linear-gradient(135deg, #2fae86, #1a9e78);
  border-radius: var(--radius-lg);
  padding: 16px;
  color: #fff;
  box-shadow: 0 10px 28px rgba(26,158,120,0.32);
  display: flex; align-items: center; gap: 12px;
}
.more-hero-avatar {
  width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
  background: rgba(255,255,255,0.22);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 800; font-size: 16px; color: #fff;
}
.more-hero-info { flex: 1; min-width: 0; }
.more-hero-name { font-family: var(--font-display); font-size: 14.5px; font-weight: 700; line-height: 1.25; }
.more-hero-sub { font-size: 11px; color: rgba(255,255,255,0.85); margin-top: 3px; display: flex; align-items: center; gap: 5px; }
.more-hero-chev { color: rgba(255,255,255,0.75); flex-shrink: 0; }

.more-section-label {
  font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--text-faint); margin: 24px 4px 10px 4px;
}

.more-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.more-grid-card {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm), var(--glass-highlight);
  border-radius: var(--radius-sm);
  padding: 13px 14px;
  display: flex; flex-direction: column; gap: 8px;
  text-align: left;
  transition: transform 0.12s ease;
}
.more-grid-card:active { transform: scale(0.97); }
.more-grid-icon {
  width: 32px; height: 32px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; font-size: 15px;
  flex-shrink: 0;
}
.more-grid-title { font-size: 12.5px; font-weight: 700; color: var(--text); }
.more-grid-meta { font-size: 10.5px; color: var(--text-faint); }

.more-list-card {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm), var(--glass-highlight);
  border-radius: var(--radius-md);
  overflow: hidden;
}
.more-row {
  display: flex; align-items: center; gap: 12px;
  width: 100%; padding: 13px 16px;
  text-align: left;
  transition: background 0.12s ease;
}
.more-row:active { background: rgba(20,42,32,0.04); }
.more-row + .more-row { border-top: 1px solid var(--border-strong); border-top-color: rgba(20,42,32,0.08); }
.more-row-icon { color: var(--text-dim); flex-shrink: 0; display: flex; }
.more-row-label { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; color: var(--text); }
.more-row-value { font-size: 12px; color: var(--text-faint); flex-shrink: 0; }
.more-row-chev { color: var(--text-faint); flex-shrink: 0; display: flex; }
.more-row.danger .more-row-label { color: var(--red); }
.more-row.danger .more-row-icon { color: var(--red); }

.more-app-foot { text-align: center; margin-top: 22px; padding-bottom: 4px; }
.more-app-foot-name { font-size: 11.5px; font-weight: 700; color: var(--text-faint); }
.more-app-foot-ver { font-size: 10.5px; color: var(--text-faint); opacity: 0.7; margin-top: 2px; }
.qty-stepper {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-3);
  border-radius: var(--radius-full);
  padding: 4px 6px;
  flex-shrink: 0;
}
.qty-stepper button {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--surface-2);
  color: var(--text); font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.qty-val { font-size: 12px; font-weight: 700; min-width: 16px; text-align: center; }

/* ---------- Editor top bar ---------- */
.le-topbar { display: flex; align-items: center; gap: 12px; }
.le-back-btn {
  width: 38px; height: 38px; border-radius: 12px;
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm), var(--glass-highlight);
}
.le-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
.le-sub { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
.le-actions { display: flex; gap: 8px; margin-top: 14px; }
.le-actions .btn { flex: 1; }

.select {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  font-size: 12.5px;
  color: var(--text);
}

/* ---------- Contextual menu ---------- */
.ctx-menu {
  position: fixed; z-index: 150;
  background: var(--surface-2);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg), var(--glass-highlight);
  border-radius: var(--radius-sm);
  padding: 6px;
  min-width: 200px;
}
.ctx-menu-item {
  display: block; width: 100%; text-align: left;
  padding: 10px 12px; font-size: 12.5px; font-weight: 600; color: var(--text);
  border-radius: 10px;
}
.ctx-menu-item:active { background: var(--surface-3); }
.ctx-menu-item.danger { color: var(--red); }
.ctx-menu-divider { height: 1px; background: var(--border); margin: 4px 6px; }

.textarea {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 11px 13px; font-size: 13px; color: var(--text);
  width: 100%; min-height: 64px; resize: vertical; font-family: inherit;
}
.hidden { display: none !important; }

/* ---------- Emoji picker cells ---------- */
.emoji-cell {
  width: 36px; height: 36px; border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0;
}
.emoji-cell.selected { border-color: var(--accent); background: var(--accent-glow); }

/* ---------- Entity grid (stores, etc.) ---------- */
.entity-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
.entity-card {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm), var(--glass-highlight);
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex; flex-direction: column; gap: 8px;
  text-align: left;
  transition: transform 0.15s ease;
}
.entity-card:active { transform: scale(0.97); }
.entity-icon-lg {
  width: 46px; height: 46px; border-radius: 14px;
  background: var(--surface-3);
  display: flex; align-items: center; justify-content: center; font-size: 22px;
}
.entity-name { font-size: 13.5px; font-weight: 700; color: var(--text); }
.entity-meta { font-size: 11px; color: var(--text-dim); }
.fav-badge { font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: var(--radius-full); background: var(--amber-glow); color: var(--amber); align-self: flex-start; }

.checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); cursor: pointer; }
.checkbox-row input { width: 16px; height: 16px; accent-color: var(--accent); }

/* ---------- Catalog ---------- */
.catalog-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
.catalog-card {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm), var(--glass-highlight);
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex; flex-direction: column; gap: 8px;
  text-align: left;
  position: relative;
  transition: transform 0.15s ease;
}
.catalog-card:active { transform: scale(0.97); }
.icon-tile-lg {
  width: 52px; height: 52px; border-radius: 16px;
  background: var(--surface-3);
  display: flex; align-items: center; justify-content: center; font-size: 24px;
}
.fav-toggle-btn {
  position: absolute; top: 10px; right: 10px;
  font-size: 16px; color: var(--text-faint); z-index: 2;
}
.fav-toggle-btn.active { color: var(--amber); }
.catalog-price { font-size: 12.5px; font-weight: 800; color: var(--accent); }
.catalog-price-empty { font-size: 11px; color: var(--text-faint); }

/* ---------- Catalog: photo-forward card (category drill-down) ---------- */
.catalog-photo-card {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm), var(--glass-highlight);
  border-radius: var(--radius-lg);
  overflow: hidden;
  text-align: left;
  position: relative;
  transition: transform 0.15s ease;
  display: flex; flex-direction: column;
}
.catalog-photo-card:active { transform: scale(0.97); }
.catalog-photo-wrap {
  width: 100%; aspect-ratio: 1.15 / 1;
  background: var(--surface-3);
  display: flex; align-items: center; justify-content: center;
  font-size: 44px;
  position: relative;
}
.catalog-photo-wrap img { width: 100%; height: 100%; object-fit: cover; }
.catalog-photo-wrap img.no-bg { object-fit: contain; padding: 14px; }
.catalog-photo-fav {
  position: absolute; top: 8px; right: 8px;
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: var(--text-faint); z-index: 2;
}
.catalog-photo-fav.active { color: var(--amber); }
.catalog-photo-body { padding: 12px 14px 14px 14px; }

.metric-card { margin-top:16px; background:var(--surface); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border:1px solid var(--border); box-shadow:var(--shadow-sm),var(--glass-highlight); border-radius:var(--radius-lg); padding:20px; }

.mbar-chart { display:flex; align-items:flex-end; gap:8px; height:90px; margin-top:52px; position:relative; }

.mbar-col:active .mbar-fill { background:var(--accent-2); }
.mbar-fill.peak { background:linear-gradient(180deg,var(--accent-2),var(--accent)); }
.mbar-fill.empty { background:transparent; border:1.5px dashed var(--border-strong); height:6px !important; align-self:flex-end; }

.st-summary-grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }

.st-summary-label3 { font-size:9.5px; color:var(--text-dim); font-weight:600; }
.st-summary-value3 { font-size:14px; font-weight:800; color:var(--text); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.savings-hero { margin-top:16px; background:linear-gradient(135deg,var(--accent-2),var(--accent)); border-radius:var(--radius-lg); padding:18px; color:#fff; display:flex; align-items:center; gap:14px; }
.savings-icon { width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.savings-label { font-size:11px; opacity:0.85; }
.savings-value { font-family:var(--font-display); font-size:19px; font-weight:800; margin-top:2px; }

.ring-hero { margin-top:16px; background:var(--surface); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border:1px solid var(--border); box-shadow:var(--shadow-sm),var(--glass-highlight); border-radius:var(--radius-lg); padding:20px; text-align:center; }
.ring-hero-wrap { position:relative; width:150px; height:150px; margin:14px auto 0; }

.donut-card { margin-top:16px; background:var(--surface); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border:1px solid var(--border); box-shadow:var(--shadow-sm),var(--glass-highlight); border-radius:var(--radius-lg); padding:20px; }
.donut-title { font-size:13px; font-weight:700; color:var(--text); }
.donut-sub { font-size:10.5px; color:var(--text-faint); margin-top:1px; }
.donut-body { display:flex; align-items:center; gap:18px; margin-top:16px; }
.donut-ring-wrap { position:relative; width:100px; height:100px; flex-shrink:0; }

.tp-bar-fill { height:100%; background:linear-gradient(90deg,var(--accent-2),var(--accent)); }
.tp-count { font-size:11px; font-weight:800; color:var(--accent); width:24px; text-align:right; flex-shrink:0; }
.tp-amount { font-size:13px; font-weight:800; color:var(--accent); flex-shrink:0; }

/* ---------- Settings ---------- */
.settings-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }

/* ---------- Categories page ---------- */

}

/* ---------- Categories: selection mode ---------- */
.cat-list-item.selectable { cursor: pointer; }

}
.cat-select-check {

  transition: all 0.15s ease;
}

}

/* ---------- Shopping mode ---------- */

.check-circle {

}

  animation: checkPulse 0.3s ease;
}

@keyframes checkPulse { 0% { transform: scale(0.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.list-item-row.bought, .list-card.bought { opacity: 0.55; }

/* ---------- Shopping mode: complete state ---------- */

.hero-complete-title { font-family:var(--font-display); font-size:18px; font-weight:800; color:#fff; }

  margin-top:16px; width:100%; background:#fff; color:var(--accent);

<script>
const DB_NAME = 'sgm_db';
const DB_VERSION = 1;

const STORES = {
  products:      { keyPath: 'id', indexes: ['category', 'favorite', 'updatedAt', 'syncStatus'] },
  stores:        { keyPath: 'id', indexes: ['favorite', 'updatedAt', 'syncStatus'] },
  prices:        { keyPath: 'id', indexes: ['productId', 'storeId', 'date', 'updatedAt', 'syncStatus'] },
  lists:         { keyPath: 'id', indexes: ['status', 'storeId', 'updatedAt', 'syncStatus'] },
  listItems:     { keyPath: 'id', indexes: ['listId', 'productId', 'status', 'updatedAt', 'syncStatus'] },
  purchases:     { keyPath: 'id', indexes: ['listId', 'storeId', 'date', 'updatedAt', 'syncStatus'] },
  purchaseItems: { keyPath: 'id', indexes: ['purchaseId', 'productId', 'updatedAt', 'syncStatus'] },
  currencies:    { keyPath: 'code', indexes: ['updatedAt'] },
  categories:    { keyPath: 'id', indexes: ['order', 'updatedAt'] },
  settings:      { keyPath: 'key' },
  syncQueue:     { keyPath: 'id', indexes: ['entity', 'createdAt'] },
};

class LocalDB {
  constructor() { this.db = null; }
  open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        for (const [name, cfg] of Object.entries(STORES)) {
          if (!db.objectStoreNames.contains(name)) {
            const os = db.createObjectStore(name, { keyPath: cfg.keyPath });
            (cfg.indexes || []).forEach(idx => os.createIndex(idx, idx, { unique: false }));
          }
        }
      };
      req.onsuccess = (e) => { this.db = e.target.result; resolve(this.db); };
      req.onerror = (e) => reject(e.target.error);
    });
  }
  _tx(store, mode = 'readonly') { return this.db.transaction(store, mode).objectStore(store); }
  getAll(store) {
    return new Promise((resolve, reject) => {
      const req = this._tx(store).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  get(store, key) {
    return new Promise((resolve, reject) => {
      const req = this._tx(store).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }
  getByIndex(store, indexName, value) {
    return new Promise((resolve, reject) => {
      const req = this._tx(store).index(indexName).getAll(value);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  put(store, value) {
    return new Promise((resolve, reject) => {
      const req = this._tx(store, 'readwrite').put(value);
      req.onsuccess = () => resolve(value);
      req.onerror = () => reject(req.error);
    });
  }
  bulkPut(store, values) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, 'readwrite');
      const os = tx.objectStore(store);
      values.forEach(v => os.put(v));
      tx.oncomplete = () => resolve(values);
      tx.onerror = () => reject(tx.error);
    });
  }
  delete(store, key) {
    return new Promise((resolve, reject) => {
      const req = this._tx(store, 'readwrite').delete(key);
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  }
}

const localDB = new LocalDB();

function uid() { return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9); }
function nowISO() { return new Date().toISOString(); }

function withSyncFields(obj, isNew) {
  const ts = nowISO();
  return { ...obj, createdAt: isNew ? ts : (obj.createdAt || ts), updatedAt: ts, syncStatus: 'pending' };
}

class NullCloudAdapter {
  async isAvailable() { return false; }
  async pushChanges() { throw new Error('No cloud adapter configured'); }
  async pullChanges() { return []; }
}

class FirebaseCloudAdapter {
  constructor() { this.uid = null; this.unsubscribers = []; }
  setUser(uid) { this.uid = uid; }
  async isAvailable() { return !!(window.Firebase && this.uid); }

  // Sube un solo registro de una colección a users/{uid}/{storeName}/{id}
  async pushRecord(storeName, record) {
    if (!this.uid || !window.Firebase) return;
    const { doc, setDoc, deleteDoc, db } = { ...window.Firebase, db: window.Firebase.db };
    const ref = doc(db, 'users', this.uid, storeName, String(record.id ?? record.code ?? record.key));
    if (record._deleted) {
      await deleteDoc(ref);
    } else {
      await setDoc(ref, { ...record, syncStatus: 'synced' }, { merge: true });
    }
  }

  // Escucha cambios remotos en vivo para una colección y los aplica a la copia local
  watchCollection(storeName, onRemoteChange) {
    if (!this.uid || !window.Firebase) return () => {};
    const { collection, onSnapshot, db } = window.Firebase;
    const ref = collection(db, 'users', this.uid, storeName);
    const unsub = onSnapshot(ref, (snap) => {
      snap.docChanges().forEach((change) => {
        onRemoteChange(storeName, change.doc.data(), change.type);
      });
    }, (err) => console.warn('Firestore watch error en', storeName, err));
    this.unsubscribers.push(unsub);
    return unsub;
  }

  stopAll() { this.unsubscribers.forEach(u => u()); this.unsubscribers = []; }
}

class SyncEngine {
  constructor(db, adapter) {
    this.db = db;
    this.adapter = adapter || new NullCloudAdapter();
    this.isOnline = typeof navigator !== 'undefined' ? navigator.onLine : true;
    this.listeners = [];
    this.syncableStores = Object.keys(STORES).filter(n => n !== 'syncQueue' && n !== 'settings' && n !== 'currencies');
    if (typeof window !== 'undefined') {
      window.addEventListener('online', () => { this.isOnline = true; this._notify(); this.attemptSync(); });
      window.addEventListener('offline', () => { this.isOnline = false; this._notify(); });
    }
  }
  onChange(fn) { this.listeners.push(fn); }
  _notify() { this.listeners.forEach(fn => fn()); }
  async getStatus() {
    const available = await this.adapter.isAvailable();
    let pendingCount = 0;
    for (const name of Object.keys(STORES)) {
      if (name === 'syncQueue' || name === 'settings') continue;
      const all = await this.db.getAll(name);
      pendingCount += all.filter(r => r.syncStatus === 'pending').length;
    }
    return { connected: available, online: this.isOnline, pendingCount, mode: available ? 'cloud' : (this.isOnline ? 'local-only' : 'offline') };
  }
  async markDirty() { this._notify(); if (this.isOnline) this.attemptSync(); return true; }

  // Sube todos los registros pendientes de cada tienda sincronizable
  async attemptSync() {
    const available = await this.adapter.isAvailable();
    if (!available || !this.isOnline) return;
    for (const storeName of this.syncableStores) {
      const all = await this.db.getAll(storeName);
      const pending = all.filter(r => r.syncStatus === 'pending');
      for (const record of pending) {
        try {
          await this.adapter.pushRecord(storeName, record);
          await this.db.put(storeName, { ...record, syncStatus: 'synced' });
        } catch (err) {
          console.warn('Error sincronizando', storeName, record.id, err);
        }
      }
    }
    this._notify();
  }

  // Aplica un cambio recibido desde Firestore en tiempo real a la copia local (sin re-marcarlo pending)
  async applyRemoteChange(storeName, data, changeType) {
    if (changeType === 'removed') {
      await this.db.delete(storeName, data.id ?? data.code);
    } else {
      const existing = await this.db.get(storeName, data.id ?? data.code).catch(() => null);
      // Evita pisar una edición local más reciente que aún no se ha subido
      if (existing && existing.syncStatus === 'pending' && existing.updatedAt > (data.updatedAt || '')) return;
      await this.db.put(storeName, { ...data, syncStatus: 'synced' });
    }
    this._notify();
  }

  // Empieza a escuchar todas las colecciones sincronizables para el usuario actual
  startWatching(onDataChanged) {
    if (!(this.adapter instanceof FirebaseCloudAdapter)) return;
    this.adapter.stopAll();
    this.syncableStores.forEach(storeName => {
      this.adapter.watchCollection(storeName, async (name, data, type) => {
        await this.applyRemoteChange(name, data, type);
        onDataChanged();
      });
    });
  }
}

const syncEngine = new SyncEngine(localDB, new FirebaseCloudAdapter());

const DEFAULT_CATEGORIES = [
  { name: 'Frutas', icon: '🍎', subcategories: ['Tropicales', 'Cítricos', 'Berries', 'Otras'] },
  { name: 'Vegetales', icon: '🥦', subcategories: ['Hojas verdes', 'Raíces', 'Otros'] },
  { name: 'Carnes', icon: '🥩', subcategories: ['Res', 'Cerdo', 'Pollo', 'Otras'] },
  { name: 'Pescados y mariscos', icon: '🐟', subcategories: ['Pescados', 'Mariscos'] },
  { name: 'Lácteos', icon: '🥛', subcategories: ['Leche', 'Quesos', 'Yogures', 'Otros'] },
  { name: 'Huevos', icon: '🥚', subcategories: ['Gallina', 'Codorniz', 'Otros'] },
  { name: 'Panadería', icon: '🍞', subcategories: ['Pan', 'Pasteles', 'Otros'] },
  { name: 'Granos y cereales', icon: '🍚', subcategories: ['Arroz', 'Cereales', 'Legumbres', 'Otros'] },
  { name: 'Pastas y salsas', icon: '🍝', subcategories: ['Pastas', 'Salsas', 'Aderezos'] },
  { name: 'Enlatados y conservas', icon: '🥫', subcategories: ['Vegetales', 'Frutas', 'Carnes/Pescados', 'Otros'] },
  { name: 'Congelados', icon: '🧊', subcategories: ['Vegetales', 'Carnes', 'Comidas listas', 'Postres'] },
  { name: 'Snacks', icon: '🍪', subcategories: ['Dulces', 'Salados', 'Saludables'] },
  { name: 'Bebidas', icon: '🥤', subcategories: ['Frías', 'Alcohólicas', 'Jugos', 'Otras'] },
  { name: 'Café y té', icon: '☕', subcategories: ['Café', 'Té', 'Otros'] },
  { name: 'Condimentos', icon: '🧂', subcategories: ['Especias', 'Salsas', 'Aceites', 'Otros'] },
  { name: 'Limpieza', icon: '🧼', subcategories: ['Cocina', 'Baño', 'Ropa', 'General'] },
  { name: 'Higiene personal', icon: '🧴', subcategories: ['Cuidado corporal', 'Cuidado bucal', 'Cuidado capilar', 'Otros'] },
  { name: 'Hogar', icon: '🏠', subcategories: ['Cocina', 'Baño', 'Organización', 'Otros'] },

];

const DEFAULT_CURRENCIES = [
  { code: 'DOP', name: 'Peso dominicano', symbol: 'RD$', exchangeRate: 1, isPrimary: true },
  { code: 'USD', name: 'Dólar estadounidense', symbol: '$', exchangeRate: 60.5, isPrimary: false },
  { code: 'EUR', name: 'Euro', symbol: '€', exchangeRate: 70.2, isPrimary: false },
];

async function seedIfEmpty() {
  const cats = await localDB.getAll('categories');
  if (cats.length === 0) {
    const seeded = DEFAULT_CATEGORIES.map((c, i) => withSyncFields({ id: uid(), name: c.name, icon: c.icon, subcategories: c.subcategories || [], order: i }, true));
    await localDB.bulkPut('categories', seeded);
  } else {
    await migrateSplitFruitsVegetables(cats);
    const catsAfterSplit = await localDB.getAll('categories');
    await migrateFillMissingSubcategories(catsAfterSplit);
  }
  const currencies = await localDB.getAll('currencies');
  if (currencies.length === 0) {
    const seeded = DEFAULT_CURRENCIES.map(c => withSyncFields({ ...c, lastUpdated: nowISO() }, true));
    await localDB.bulkPut('currencies', seeded);
  }
  const settings = await localDB.get('settings', 'app');
  if (!settings) {
    await localDB.put('settings', withSyncFields({ key: 'app', appName: 'Smart Grocery Manager', primaryCurrency: 'DOP', defaultStoreId: null, defaultView: 'list', theme: 'light' }, true));
  }
}

async function migrateSplitFruitsVegetables(existingCats) {
  const old = existingCats.find(c => c.name === 'Frutas y vegetales');
  if (!old) return;
  const settings = await localDB.get('settings', 'app');
  if (settings && settings.migratedFruitsVeg) return;

  const frutas = withSyncFields({ id: uid(), name: 'Frutas', icon: '🍎', subcategories: ['Tropicales', 'Cítricos', 'Berries', 'Otras'], order: old.order }, true);
  const vegetales = withSyncFields({ id: uid(), name: 'Vegetales', icon: '🥦', subcategories: ['Hojas verdes', 'Raíces', 'Otros'], order: old.order + 0.5 }, true);
  await localDB.bulkPut('categories', [frutas, vegetales]);
  await localDB.delete('categories', old.id);

  const products = await localDB.getAll('products');
  const affected = products.filter(p => p.category === 'Frutas y vegetales');
  if (affected.length > 0) {
    const updated = affected.map(p => withSyncFields({ ...p, category: 'Vegetales' }, false));
    await localDB.bulkPut('products', updated);
  }

  await localDB.put('settings', withSyncFields({ ...(settings || { key: 'app' }), migratedFruitsVeg: true }, false));
}

async function migrateFillMissingSubcategories(existingCats) {
  const settings = await localDB.get('settings', 'app');
  if (settings && settings.migratedSubcats) return;

  const toUpdate = [];
  for (const cat of existingCats) {
    const hasNone = !cat.subcategories || cat.subcategories.length === 0;
    if (!hasNone) continue;
    const seedMatch = DEFAULT_CATEGORIES.find(d => d.name === cat.name);
    if (seedMatch && seedMatch.subcategories && seedMatch.subcategories.length > 0) {
      toUpdate.push(withSyncFields({ ...cat, subcategories: [...seedMatch.subcategories] }, false));
    }
  }
  if (toUpdate.length > 0) {
    await localDB.bulkPut('categories', toUpdate);
  }
  await localDB.put('settings', withSyncFields({ ...(settings || { key: 'app' }), migratedSubcats: true }, false));
}

function getPrimaryCurrency() {
  return AppState.data.currencies.find(c => c.isPrimary) || AppState.data.currencies[0] || { code: 'DOP', symbol: 'RD$' };
}
function formatMoney(amount, currencyCode) {
  const cur = AppState.data.currencies.find(c => c.code === currencyCode) || getPrimaryCurrency();
  const symbol = cur.symbol || cur.code;
  const val = Number(amount || 0);

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
function timeGreeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Buenos días';
  if (h < 19) return 'Buenas tardes';
  return 'Buenas noches';
}
function daysAgo(isoDate) {
  if (!isoDate) return null;
  return Math.floor((Date.now() - new Date(isoDate).getTime()) / 86400000);
}

function computePurchaseIntervals(productId, purchaseItems) {
  const dates = purchaseItems.filter(pi => pi.productId === productId).map(pi => new Date(pi.date).getTime()).sort((a,b)=>a-b);
  if (dates.length < 2) return null;
  const gaps = [];
  for (let i = 1; i < dates.length; i++) gaps.push((dates[i]-dates[i-1]) / 86400000);
  const avg = gaps.reduce((a,b)=>a+b,0) / gaps.length;
  return { avgDays: Math.round(avg), lastDate: new Date(dates[dates.length-1]).toISOString(), count: dates.length };
}
async function getSmartSuggestions() {
  const purchaseItems = await localDB.getAll('purchaseItems').catch(() => []);
  if (!purchaseItems || purchaseItems.length === 0) return [];
  const suggestions = [];
  const byProduct = {};
  purchaseItems.forEach(pi => { (byProduct[pi.productId] ||= []).push(pi); });
  for (const productId of Object.keys(byProduct)) {
    const interval = computePurchaseIntervals(productId, purchaseItems);
    if (!interval) continue;
    const since = daysAgo(interval.lastDate);
    if (since !== null && since >= interval.avgDays - 1) suggestions.push({ productId, avgDays: interval.avgDays, since });
  }
  return suggestions;
}
async function getFrequentProducts(limit = 6) {
  const purchaseItems = await localDB.getAll('purchaseItems').catch(() => []);
  if (!purchaseItems || purchaseItems.length === 0) return [];
  const counts = {};
  purchaseItems.forEach(pi => { counts[pi.productId] = (counts[pi.productId] || 0) + 1; });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0, limit).map(([productId,count]) => ({ productId, count }));
}

function buildSparklineSVG(values, opts) {
  opts = opts || {};
  const w = opts.width || 280;
  const h = opts.height || 44;
  const pad = 4;
  if (values.length < 2) return '';
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const step = (w - pad * 2) / (values.length - 1);
  const points = values.map((v, i) => {
    const x = pad + i * step;
    const y = h - pad - ((v - min) / range) * (h - pad * 2);
    return [x, y];
  });
  const pathD = points.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const areaD = pathD + ` L${points[points.length-1][0].toFixed(1)},${h} L${points[0][0].toFixed(1)},${h} Z`;
  const dotsD = points.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="var(--accent)" />`).join('');
  return `
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img" aria-label="Evolución de precio">
      <path d="${areaD}" fill="var(--accent-glow)" stroke="none" />
      <path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      ${dotsD}
    </svg>`;
}

const PAGE_RENDERERS = {};

async function navigate(route, params, isBack) {
  if (!isBack && AppState.route && (AppState.route !== route || JSON.stringify(AppState.routeParams) !== JSON.stringify(params || {}))) {
    AppState.history.push({ route: AppState.route, params: AppState.routeParams });
    if (AppState.history.length > 20) AppState.history.shift();
  }
  AppState.route = route;
  AppState.routeParams = params || {};
  renderBottomNav();
  const hideHeaderRoutes = ['categories', 'shop', 'shopping', 'listEditor', 'stats', 'home', 'more', 'stores', 'history', 'settings'];
  const header = document.querySelector('.app-header');
  const searchRow = document.querySelector('.search-row');
  const shouldHide = hideHeaderRoutes.includes(route) || route === 'catalog';
  if (header) header.style.display = shouldHide ? 'none' : '';
  if (searchRow) searchRow.style.display = shouldHide ? 'none' : '';
  const renderer = PAGE_RENDERERS[route] || PAGE_RENDERERS['notfound'];
  const content = document.getElementById('content');
  content.classList.toggle('no-header-pad', shouldHide);
  // Solo mostramos el esqueleto de carga si el renderer tarda de verdad;
  // así evitamos el destello gris en cambios de pestaña, que son casi siempre instantáneos.
  const skeletonTimer = setTimeout(() => {
    content.innerHTML = `<div class="skeleton" style="height:400px; margin-top:20px;"></div>`;
  }, 80);
  await renderer(content, AppState.routeParams);
  clearTimeout(skeletonTimer);
  document.querySelector('.scroll-area').scrollTo(0, 0);
}

function goBack(fallbackRoute, fallbackParams) {
  const prev = AppState.history.pop();
  if (prev) navigate(prev.route, prev.params, true);
  else navigate(fallbackRoute || 'home', fallbackParams, true);
}

const CategoriesPageState = { selectMode: false, selectedIds: new Set() };
const ShopPageState = { selectMode: false, selectedIds: new Set() };

PAGE_RENDERERS['categories'] = async (el) => {
  const categories = AppState.data.categories;
  const products = AppState.data.products;

  const countsByCategory = {};
  products.forEach(p => { countsByCategory[p.category] = (countsByCategory[p.category] || 0) + 1; });

  el.innerHTML = `
    <div class="page-header">
      <div class="page-header-row">
        <div>
          <div class="page-title">Categorías</div>
          <div class="page-sub">${categories.length} categoría${categories.length===1?'':'s'}</div>
        </div>
        <div class="flex items-center gap-2">
          <button class="btn btn-secondary btn-sm" id="catToggleSelect">${CategoriesPageState.selectMode ? 'Listo' : 'Editar'}</button>
          ${CategoriesPageState.selectMode ? '' : '<button class="btn btn-primary btn-sm" id="catAddCategory">＋ Nueva</button>'}
        </div>
      </div>
    </div>

    ${CategoriesPageState.selectMode ? `<div class="field-hint" style="margin-top:14px;">Toca para seleccionar. Mantén presionado y arrastra para reordenar.</div>` : ''}

    <div id="categoriesList"></div>
    <div id="catBulkBarSlot"></div>
  `;

  el.querySelector('#catToggleSelect').addEventListener('click', () => {
    CategoriesPageState.selectMode = !CategoriesPageState.selectMode;
    CategoriesPageState.selectedIds.clear();
    navigate('categories');
  });
  const addBtn = el.querySelector('#catAddCategory');
  if (addBtn) addBtn.addEventListener('click', () => openCategoryEditor(null, null, () => navigate('categories')));

  const listEl = el.querySelector('#categoriesList');
  if (categories.length === 0) {
    listEl.innerHTML = `
      <div class="gcard" style="margin-top:16px;"><div class="empty-state">
        <div class="empty-icon">🗂️</div>
        <div class="empty-title">Aún no tienes categorías</div>
        <div class="empty-sub">Toca ＋ Nueva para crear tu primera categoría.</div>
      </div></div>`;
    return;
  }

  function renderList() {
    listEl.innerHTML = categories.map(c => {
      const count = countsByCategory[c.name] || 0;
      const imgContent = c.imageUrl ? `<img src="${c.imageUrl}" alt="">` : c.icon;
      const isSelected = CategoriesPageState.selectedIds.has(c.id);
      return `
        <div class="cat-list-item ${CategoriesPageState.selectMode ? 'selectable' : ''} ${isSelected ? 'selected' : ''}" data-cat-id="${c.id}" data-cat-name="${escapeHTML(c.name)}" ${CategoriesPageState.selectMode ? 'draggable="true"' : ''}>
          ${CategoriesPageState.selectMode ? `
            <div class="cat-drag-handle">⠿</div>
            <div class="cat-select-check ${isSelected ? 'checked' : ''}" data-select-toggle="${c.id}">${isSelected ? '✓' : ''}</div>
          ` : ''}
          <div class="cat-list-img-ph" data-img="category-${escapeHTML(c.name)}">${imgContent}</div>
          <div class="cat-list-body">
            <div class="cat-list-text">
              <div class="cat-list-name">${escapeHTML(c.name)}</div>
              <div class="cat-list-desc">${escapeHTML(c.description || 'Productos frescos y variados')}</div>
              <div class="cat-list-count">${count}+ items</div>
            </div>
            ${CategoriesPageState.selectMode ? '' : '<svg class="cat-list-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
          </div>
        </div>`;
    }).join('');

    if (CategoriesPageState.selectMode) {
      listEl.querySelectorAll('[data-cat-id]').forEach(row => {
        row.addEventListener('click', () => {
          const id = row.dataset.catId;
          if (CategoriesPageState.selectedIds.has(id)) CategoriesPageState.selectedIds.delete(id);
          else CategoriesPageState.selectedIds.add(id);
          renderList();
          renderBulkBar();
        });
      });
      setupDragReorder(listEl, categories, null, {
        idAttr: 'catId',
        onReorder: async (orderedIds) => {
          await Promise.all(orderedIds.map((id, idx) => {
            const cat = categories.find(c => c.id === id);
            return Repo.saveCategory({ ...cat, order: idx });
          }));
          await refreshCoreData();
          showToast('Orden guardado', 'success');
        },
      });
    } else {
      let pressTimer = null;
      let longPressFired = false;
      listEl.querySelectorAll('[data-cat-name]').forEach(btn => {
        const catName = btn.dataset.catName;
        const cat = categories.find(c => c.name === catName);
        const start = () => {
          longPressFired = false;
          pressTimer = setTimeout(() => {
            longPressFired = true;
            if (navigator.vibrate) navigator.vibrate(12);
            openCategoryContextMenu(btn, cat, () => navigate('categories'));
          }, 480);
        };
        const cancel = () => { clearTimeout(pressTimer); };
        btn.addEventListener('touchstart', start, { passive: true });
        btn.addEventListener('touchend', cancel);
        btn.addEventListener('touchmove', cancel);
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', cancel);
        btn.addEventListener('mouseleave', cancel);
        btn.addEventListener('click', (e) => {
          if (longPressFired) { e.preventDefault(); e.stopPropagation(); return; }
          CatalogState.filterCategory = catName;
          CatalogState.filterSubcategory = null;
          CatalogState.fromCategories = true;
          CatalogState.view = 'grid';
          navigate('catalog');
        });
      });
    }
  }

  function renderBulkBar() {
    const slot = el.querySelector('#catBulkBarSlot');
    const n = CategoriesPageState.selectedIds.size;
    if (!CategoriesPageState.selectMode || n === 0) { slot.innerHTML = ''; return; }
    slot.innerHTML = `
      <div class="cat-bulk-bar">
        <span class="cat-bulk-count">${n} seleccionada${n===1?'':'s'}</span>
        <button class="btn btn-primary btn-sm" id="catBulkDelete" style="background:var(--red); box-shadow:none;">🗑 Eliminar</button>
      </div>`;
    slot.querySelector('#catBulkDelete').addEventListener('click', async () => {
      const ids = [...CategoriesPageState.selectedIds];
      const selectedCats = categories.filter(c => ids.includes(c.id));
      const blocked = selectedCats.filter(c => products.some(p => p.category === c.name));
      if (blocked.length > 0) {
        showToast(`No se puede eliminar: "${blocked[0].name}" tiene productos asignados`, 'error');
        return;
      }
      openModal({
        title: 'Eliminar categorías',
        bodyHTML: `<div style="font-size:13px; color:var(--text-dim); line-height:1.5;">¿Eliminar ${ids.length} categoría${ids.length===1?'':'s'} seleccionada${ids.length===1?'':'s'}? Esta acción no se puede deshacer.</div>`,
        footerHTML: `<button class="btn btn-secondary" data-close-modal style="flex:1;">Cancelar</button><button class="btn btn-primary" id="bulkDelConfirm" style="flex:1; background:var(--red); box-shadow:none;">Eliminar</button>`,
        onMount: (overlay) => {
          overlay.querySelector('[data-close-modal]').addEventListener('click', closeModal);
          overlay.querySelector('#bulkDelConfirm').addEventListener('click', async () => {
            try {
              await Promise.all(ids.map(id => Repo.deleteCategory(id)));
              await refreshCoreData();
              closeModal();
              showToast('Categorías eliminadas', 'info');
              CategoriesPageState.selectedIds.clear();
              navigate('categories');
            } catch (err) {
              console.error('Error eliminando categorías:', err);
              showToast('No se pudo eliminar: ' + (err && err.message ? err.message : 'error desconocido'), 'error');
            }
          });
        },
      });
    });
  }

  renderList();
  renderBulkBar();
};

function openStoreEditor(storeId) {
  const existing = storeId ? AppState.data.stores.find(s => s.id === storeId) : null;
  const currencies = AppState.data.currencies;
  const uniqueStoreEmojis = ['🏪','🛒','🏬','🏢','🥬','🍞','🧺','🛍️','🏷️','🥩','🐟','🧀','🍎','🥦','🧊','🚚','💳','🌾'];
  let selectedLogo = (existing && existing.logo) || '🏪';
  let selectedImage = (existing && existing.imageUrl) || null;

  openModal({
    title: existing ? 'Editar supermercado' : 'Nuevo supermercado',
    bodyHTML: `
      <div class="flex" style="align-items:flex-start; gap:12px; margin-bottom:14px;">
        <div id="storeImagePreview" class="product-image-preview">
          ${selectedImage ? `<img src="${selectedImage}" alt="">` : `<span id="storeIconPickerBtn" class="product-image-fallback">${selectedLogo}</span>`}
        </div>
        <div style="flex:1;">
          <div class="field" style="margin-bottom:10px;">
            <div class="field-label">Nombre</div>
            <input type="text" class="input" id="sf_name" placeholder="Ej. Supermercado Nacional" value="${escapeHTML((existing&&existing.name) || '')}">
          </div>
          <div class="flex items-center gap-2" style="flex-wrap:wrap;">
            <label class="btn btn-secondary btn-sm" style="cursor:pointer;">
              📷 Foto
              <input type="file" accept="image/*" id="store_imageFile" class="hidden">
            </label>
            <button type="button" class="btn btn-secondary btn-sm" id="store_imageUrlBtn">🔗 URL</button>
            <button type="button" class="mini-btn" id="store_imageClear" style="font-size:11px; color:var(--text-dim); ${selectedImage ? '' : 'display:none;'}">Quitar</button>
          </div>
          <div id="store_imageUrlField" class="field hidden" style="margin-top:8px; margin-bottom:0;">
            <input type="text" class="input" id="store_imageUrlInput" placeholder="https://...">
          </div>
        </div>
      </div>
      <div id="storeIconGrid" class="emoji-grid hidden mb-3">
        ${uniqueStoreEmojis.map(e => `<button type="button" class="emoji-cell ${e===selectedLogo?'selected':''}" data-logo="${e}">${e}</button>`).join('')}
      </div>
      <div class="field-hint mb-3">Si no subes una foto, se usa un ícono como respaldo — toca el ícono para elegir otro.</div>
      <div class="field">
        <div class="field-label">Ubicación (opcional)</div>
        <input type="text" class="input" id="sf_location" value="${escapeHTML((existing&&existing.location) || '')}">
      </div>
      <div class="field">
        <div class="field-label">Moneda habitual</div>
        <select class="input" id="sf_currency">
          ${currencies.map(c => `<option value="${c.code}" ${((existing&&existing.defaultCurrency)||getPrimaryCurrency().code)===c.code?'selected':''}>${c.code} — ${escapeHTML(c.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <div class="field-label">Notas (opcional)</div>
        <textarea class="textarea" id="sf_notes">${escapeHTML((existing&&existing.notes) || '')}</textarea>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="sf_favorite" ${existing&&existing.favorite ? 'checked' : ''}>
        Marcar como favorito / predeterminado
      </label>
    `,
    footerHTML: `
      ${existing ? '<button class="btn btn-secondary" id="sf_delete" style="color:var(--red); font-size:11px; padding:8px 10px;">Eliminar</button>' : ''}
      <button class="btn btn-primary" id="sf_save" style="flex:1;">${existing ? 'Guardar cambios' : 'Crear supermercado'}</button>
    `,
    onMount: (overlay) => {
      const iconGrid = overlay.querySelector('#storeIconGrid');
      const previewEl = overlay.querySelector('#storeImagePreview');
      const clearBtn = overlay.querySelector('#store_imageClear');
      const urlField = overlay.querySelector('#store_imageUrlField');
      const urlInput = overlay.querySelector('#store_imageUrlInput');

      function renderPreview() {
        if (selectedImage) {
          previewEl.innerHTML = `<img src="${selectedImage}" alt="">`;
          clearBtn.style.display = '';
        } else {
          previewEl.innerHTML = `<span id="storeIconPickerBtn" class="product-image-fallback">${selectedLogo}</span>`;
          clearBtn.style.display = 'none';
          bindIconBtn();
        }
      }
      function bindIconBtn() {
        const btn = overlay.querySelector('#storeIconPickerBtn');
        if (btn) btn.addEventListener('click', () => iconGrid.classList.toggle('hidden'));
      }
      bindIconBtn();

      iconGrid.querySelectorAll('[data-logo]').forEach(cell => {
        cell.addEventListener('click', () => {
          selectedLogo = cell.dataset.logo;
          iconGrid.querySelectorAll('.emoji-cell').forEach(c => c.classList.remove('selected'));
          cell.classList.add('selected');
          iconGrid.classList.add('hidden');
          if (!selectedImage) renderPreview();
        });
      });

      overlay.querySelector('#store_imageFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) { showToast('La imagen es muy grande (máx. 8MB)', 'error'); return; }
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 640;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            selectedImage = canvas.toDataURL('image/jpeg', 0.85);
            renderPreview();
          };
          img.onerror = () => { showToast('No se pudo procesar la imagen', 'error'); };
          img.src = reader.result;
        };
        reader.onerror = () => { showToast('No se pudo leer el archivo', 'error'); };
        reader.readAsDataURL(file);
      });

      overlay.querySelector('#store_imageUrlBtn').addEventListener('click', () => {
        urlField.classList.toggle('hidden');
        if (!urlField.classList.contains('hidden')) urlInput.focus();
      });
      urlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const url = urlInput.value.trim();
          if (url) { selectedImage = url; renderPreview(); urlField.classList.add('hidden'); }
        }
      });
      urlInput.addEventListener('blur', () => {
        const url = urlInput.value.trim();
        if (url) { selectedImage = url; renderPreview(); }
      });
      clearBtn.addEventListener('click', () => { selectedImage = null; renderPreview(); });

      overlay.querySelector('#sf_save').addEventListener('click', async () => {
        const name = overlay.querySelector('#sf_name').value.trim();
        if (!name) { showToast('El nombre es obligatorio', 'error'); return; }
        try {
          await Repo.saveStore({
            id: existing ? existing.id : undefined,
            name,
            logo: selectedLogo,
            imageUrl: selectedImage || null,
            location: overlay.querySelector('#sf_location').value.trim() || null,
            defaultCurrency: overlay.querySelector('#sf_currency').value,
            notes: overlay.querySelector('#sf_notes').value.trim() || null,
            favorite: overlay.querySelector('#sf_favorite').checked,
          });
          await refreshCoreData();
          closeModal();
          showToast(existing ? 'Supermercado actualizado' : 'Supermercado agregado', 'success');
          navigate('stores');
        } catch (err) {
          console.error('Error guardando supermercado:', err);
          showToast('No se pudo guardar: ' + (err && err.message ? err.message : 'error desconocido'), 'error');
        }
      });
      if (existing) {
        overlay.querySelector('#sf_delete').addEventListener('click', async () => {
          await Repo.deleteStore(existing.id);
          await refreshCoreData();
          closeModal();
          showToast('Supermercado eliminado', 'info');
          navigate('stores');
        });
      }
    },
  });
}

    <div class="gcard settings-info-card">
      <div class="item-icon-tile">☁️</div>
      <div>
        <div class="item-name" id="st_accountEmail">Cargando…</div>
        <div class="item-meta">Tus datos se sincronizan automáticamente en todos tus dispositivos.</div>
