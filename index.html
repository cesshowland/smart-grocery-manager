<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot, getDocs, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC7BOX5DTw_CO7jF08xYqRt6emqpKWoBOw",
    authDomain: "smart-grocery-manager-3f385.firebaseapp.com",
    projectId: "smart-grocery-manager-3f385",
    storageBucket: "smart-grocery-manager-3f385.firebasestorage.app",
    messagingSenderId: "1072064021256",
    appId: "1:1072064021256:web:5566cf5de2b6bc231c22bd",
  };

  const fbApp = initializeApp(firebaseConfig);
  const fbAuth = getAuth(fbApp);
  const fbDb = getFirestore(fbApp);
  try { await enableIndexedDbPersistence(fbDb); } catch (e) { /* varias pestañas abiertas u navegador sin soporte: seguimos sin cache persistente extra */ }

  window.Firebase = {
    auth: fbAuth, db: fbDb,
    createUser: (email, pass) => createUserWithEmailAndPassword(fbAuth, email, pass),
    signIn: (email, pass) => signInWithEmailAndPassword(fbAuth, email, pass),
    signOutUser: () => signOut(fbAuth),
    resetPassword: (email) => sendPasswordResetEmail(fbAuth, email),
    onAuthChange: (cb) => onAuthStateChanged(fbAuth, cb),
    doc, setDoc, deleteDoc, collection, onSnapshot, getDocs,
  };
  window.dispatchEvent(new Event('firebase-ready'));
</script>
<style>
:root {
  --bg-grad: linear-gradient(160deg, #eaf3ec 0%, #eef3e6 35%, #f6efe4 65%, #fbeee2 100%);
  --surface: rgba(255,255,255,0.45);
  --surface-2: rgba(255,255,255,0.65);
  --surface-3: rgba(255,255,255,0.35);
  --border: rgba(255,255,255,0.55);
  --border-strong: rgba(20,42,32,0.14);
  --glass-blur: blur(18px) saturate(160%);
  --glass-highlight: inset 0 1px 0 rgba(255,255,255,0.5);

  --text: #142a20;
  --text-dim: #5c6b62;
  --text-faint: #8a9691;

  --accent: #1a9e78;
  --accent-2: #2fae86;
  --accent-glow: rgba(26,158,120,0.16);
  --accent-ink: #ffffff;

  --amber: #f0973a;
  --amber-glow: rgba(240,151,58,0.15);
  --red: #e2503f;
  --red-glow: rgba(226,80,63,0.14);
  --blue: #3f8fd6;

  --radius-sm: 14px;
  --radius-md: 20px;
  --radius-lg: 26px;
  --radius-full: 999px;

  --shadow-sm: 0 2px 8px rgba(20,42,32,0.05);
  --shadow-md: 0 8px 24px rgba(20,42,32,0.08);

  --font-display: 'Poppins', -apple-system, sans-serif;
  --font-body: 'Nunito Sans', -apple-system, sans-serif;

  --bottomnav-h: 78px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;

  color: var(--text);

}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

::-webkit-scrollbar { width: 0; height: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

  border: 1px solid var(--border);
  font-size: 12.5px; font-weight: 700; color: var(--text);
  display: inline-flex; align-items: center; gap: 6px;
  box-shadow: var(--shadow-sm), var(--glass-highlight);
}

.bottom-nav {
  position: absolute; bottom: var(--safe-bottom); left: 16px; right: 16px;
  height: 62px;
  background: var(--surface-2);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg), var(--glass-highlight);
  border-radius: var(--radius-full);
  display: flex; align-items: center; justify-content: space-around;
  padding: 0 6px;
  z-index: 30;
}
@media (min-width: 900px) { .bottom-nav { position: absolute; } }
.nav-item {
  flex: 1; display: flex; align-items: center; justify-content: center;
  height: 46px; border-radius: var(--radius-full);
  transition: background 0.15s ease;
}
.nav-item.active { background: var(--accent-glow); }
.nav-item svg { color: var(--text-faint); }
.nav-item.active svg { color: var(--accent); }
.nav-item span { display: none; }
.nav-fab-wrap { display: flex; align-items: center; justify-content: center; padding: 0 2px; }
.nav-fab {
  width: 46px; height: 46px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  display: flex; align-items: center; justify-content: center;
  margin-top: 0; box-shadow: 0 4px 14px var(--accent-glow); position: relative;
}
.cart-badge {
  position: absolute; top: -2px; right: -2px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--red); color: #fff; font-size: 9px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; border: 2px solid #fff;
}

.skeleton { background: var(--surface-2); border-radius: var(--radius-md); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(10,20,15,0.45);
  backdrop-filter: blur(4px);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 100; animation: fadeIn 0.15s ease;
}
@media (min-width: 640px) { .modal-overlay { align-items: center; padding: 20px; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--surface-2);
  backdrop-filter: blur(30px) saturate(160%);
  -webkit-backdrop-filter: blur(30px) saturate(160%);
  border: 1px solid var(--border);
  border-radius: 26px 26px 0 0;
  box-shadow: var(--shadow-lg), var(--glass-highlight);
  width: 100%; max-width: 440px; max-height: 86vh;
  display: flex; flex-direction: column;
  animation: modalIn 0.2s cubic-bezier(0.2,0.8,0.2,1);
}
@media (min-width: 640px) { .modal { border-radius: var(--radius-lg); } }
@keyframes modalIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.modal-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; }
.modal-close {
  width: 32px; height: 32px; border-radius: 50%; background: var(--surface-3);
  display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--text-dim);
}
.modal-body { padding: 18px 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.modal-footer { padding: 14px 20px 20px; display: flex; gap: 10px; flex-shrink: 0; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field-label { font-size: 12px; font-weight: 700; color: var(--text-dim); }
.input { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 13px; font-size: 16px; color: var(--text); width: 100%; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

/* ---------- Auth screen ---------- */
.auth-screen {
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; justify-content: center;
  padding: 28px 22px calc(28px + var(--safe-bottom));
  background: var(--bg);
}
.auth-logo {
  width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 18px;
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  box-shadow: 0 10px 24px var(--accent-glow);
  display: flex; align-items: center; justify-content: center; font-size: 28px;
}
.auth-title { font-family: var(--font-display); font-size: 22px; font-weight: 800; color: var(--text); text-align: center; }
.auth-sub { font-size: 13px; color: var(--text-dim); text-align: center; margin-top: 6px; margin-bottom: 28px; }
.auth-card {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md), var(--glass-highlight);
  border-radius: var(--radius-lg);
  padding: 22px 20px;
}
.auth-tabs { display: flex; gap: 6px; background: var(--surface-3); border-radius: 999px; padding: 4px; margin-bottom: 20px; }
.auth-tab { flex: 1; text-align: center; padding: 9px 0; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: var(--text-dim); }
.auth-tab.active { background: #fff; color: var(--accent); box-shadow: var(--shadow-sm); }
.auth-error { background: var(--red-glow); color: var(--red); font-size: 12px; font-weight: 600; padding: 10px 12px; border-radius: 12px; margin-bottom: 14px; display: none; }
.auth-error.show { display: block; }
.auth-switch { text-align: center; font-size: 12.5px; color: var(--text-dim); margin-top: 18px; }
.auth-switch button { color: var(--accent); font-weight: 700; }
.auth-forgot { text-align: right; font-size: 11.5px; color: var(--text-faint); margin-top: -8px; margin-bottom: 16px; }

/* ---------- Welcome / splash screen (before auth) ---------- */
.welcome-screen {
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column;
  padding: calc(36px + var(--safe-top)) 0 calc(26px + var(--safe-bottom));
  background: var(--bg-grad);
  position: relative; overflow: hidden;
}
.welcome-orb-a { position: absolute; top: -30px; right: -70px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(47,174,134,0.24) 0%, transparent 70%); pointer-events: none; }
.welcome-orb-b { position: absolute; bottom: 190px; left: -80px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(240,151,58,0.20) 0%, transparent 70%); pointer-events: none; }
.welcome-top { position: relative; z-index: 2; padding: 0 32px; }
.welcome-eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 10px;
}
.welcome-eyebrow::before { content: ''; width: 16px; height: 2px; border-radius: 2px; background: var(--accent); }
.welcome-title { font-family: var(--font-display); font-size: 33px; font-weight: 800; color: var(--text); line-height: 1.14; letter-spacing: -0.02em; }
.welcome-title em { font-style: normal; color: var(--accent); }
.welcome-sub { font-size: 14px; color: var(--text-dim); margin-top: 14px; line-height: 1.55; max-width: 280px; }
.welcome-hero { flex: 1; position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 8px 0; }
.welcome-hero-platform {
  position: relative; width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
}
.welcome-hero-platform::before {
  content: ''; position: absolute; width: 300px; height: 300px; border-radius: 50%;
  background: radial-gradient(circle, rgba(47,174,134,0.16) 0%, rgba(47,174,134,0.05) 55%, transparent 75%);
}
.welcome-hero-img { position: relative; width: 88%; max-width: 350px; height: auto; object-fit: contain; filter: drop-shadow(0 28px 34px rgba(20,42,32,0.22)); }
.welcome-foot { padding: 0 28px; position: relative; z-index: 2; }
.welcome-dots { display: flex; justify-content: center; gap: 7px; margin-bottom: 20px; }
.welcome-dots span { width: 7px; height: 7px; border-radius: 50%; background: rgba(20,42,32,0.16); }
.welcome-dots span.active { width: 20px; border-radius: 4px; background: var(--accent); }
.welcome-cta {
  width: 100%; height: 58px; border-radius: 999px;
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  box-shadow: 0 14px 30px var(--accent-glow);
  color: #fff; font-family: var(--font-display); font-size: 16px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 9px;
}

/* ---------- Boot loader (shown instantly, before any JS decides what to render) ---------- */
.boot-loader {
  position: fixed; inset: 0; z-index: 999;
  background: var(--bg-grad);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  transition: opacity 0.25s ease;
}
.boot-loader.hide { opacity: 0; pointer-events: none; }
.boot-loader-icon {
  width: 100px; height: 100px;
  animation: bootPulse 1.8s ease-in-out infinite;
  filter: drop-shadow(0 14px 30px var(--accent-glow));
}
.boot-loader-icon img { width: 100%; height: 100%; object-fit: contain; }
@keyframes bootPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}
.boot-loader-dots { display: flex; gap: 7px; }
.boot-loader-dots span {
  width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
  opacity: 0.35; animation: bootDot 1.2s ease-in-out infinite;
}
.boot-loader-dots span:nth-child(2) { animation-delay: 0.15s; }
.boot-loader-dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes bootDot {
  0%, 100% { opacity: 0.35; transform: translateY(0); }
  50% { opacity: 1; transform: translateY(-4px); }
}

/* ---------- Page header (secondary pages) ---------- */
.page-header { margin-top: 20px; margin-bottom: 16px; }
.page-header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-title { font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--text); }
.page-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }

/* ---------- Filter tabs (pill row) ---------- */
.tab-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.tab-btn {
  padding: 8px 14px;
  border-radius: var(--radius-full);
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  font-size: 12px; font-weight: 700; color: var(--text-dim);
  white-space: nowrap;
  flex-shrink: 0;
}
.tab-btn.active {
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  color: #fff; border-color: transparent;
  box-shadow: 0 4px 12px var(--accent-glow);
}

/* ---------- Search bar (secondary, inline) ---------- */
.inline-search {
  flex: 1; min-width: 160px; height: 44px;
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  border-radius: 14px;
  display: flex; align-items: center; gap: 8px; padding: 0 14px;
  box-shadow: var(--shadow-sm), var(--glass-highlight);
}
.inline-search input { border: none; background: transparent; outline: none; font-size: 16px; color: var(--text); width: 100%; }
.inline-search input::placeholder { color: var(--text-faint); }

/* ---------- Catalog filter row ---------- */
.cat-filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.cat-view-toggle {
  display: flex; align-items: center; flex-shrink: 0;
  height: 44px; padding: 3px;
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow-sm), var(--glass-highlight);
}
.cat-view-btn {
  width: 34px; height: 34px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-faint);
}
.cat-view-btn.active { background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: #fff; box-shadow: 0 3px 8px var(--accent-glow); }
.cat-fav-chip {
  display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
  padding: 8px 14px 8px 12px;
  border-radius: var(--radius-full);
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  font-size: 12px; font-weight: 700; color: var(--text-dim);
  white-space: nowrap;
}
.cat-fav-chip.active { background: var(--amber-glow); color: var(--amber); border-color: transparent; }

/* ---------- List cards grid ---------- */
.lists-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
.list-card {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm), var(--glass-highlight);
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex; flex-direction: column; gap: 8px;
  text-align: left;
  transition: transform 0.15s ease;
}
.list-card:active { transform: scale(0.97); }
.list-card-top { display: flex; align-items: center; justify-content: space-between; }
.list-card-icon { font-size: 22px; }
.list-card-badge {
  font-size: 9.5px; font-weight: 800;
  padding: 3px 8px; border-radius: var(--radius-full);
  background: var(--surface-3); color: var(--text-dim);
  border: 1px solid var(--border);
}
.list-card-name { font-size: 13.5px; font-weight: 700; color: var(--text); line-height: 1.3; }
.list-card-meta { font-size: 11px; color: var(--text-dim); line-height: 1.4; }

/* ---------- Toast ---------- */
.toast-stack {
  position: fixed; bottom: calc(var(--bottomnav-h) + 16px + var(--safe-bottom)); left: 0; right: 0;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  z-index: 200; pointer-events: none; padding: 0 20px;
}
.toast {
  background: var(--surface-2);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md), var(--glass-highlight);
  border-radius: var(--radius-full);
  padding: 11px 20px;
  font-size: 12.5px; font-weight: 700; color: var(--text);
  display: flex; align-items: center; gap: 8px;
  animation: toastIn 0.2s cubic-bezier(0.2,0.8,0.2,1);
  max-width: 400px;
}
.toast.error { color: var(--red); }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- List editor: item rows ---------- */
.list-item-row {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  padding: 12px 14px;
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm), var(--glass-highlight);
  border-radius: var(--radius-sm);
}
.item-icon-tile {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--surface-3);
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; flex-shrink: 0;
}
.item-name { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-meta { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
.item-total { font-size: 13px; font-weight: 800; color: var(--accent); width: 68px; text-align: right; flex-shrink: 0; }
.item-menu-btn { font-size: 17px; color: var(--text-faint); padding: 4px 6px; flex-shrink: 0; }

/* ---------- More page ---------- */
.more-hero {
  margin-top: 18px;
  background: linear-gradient(135deg, #2fae86, #1a9e78);
  border-radius: var(--radius-lg);
  padding: 16px;
  color: #fff;
  box-shadow: 0 10px 28px rgba(26,158,120,0.32);
  display: flex; align-items: center; gap: 12px;
}
.more-hero-avatar {
  width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
  background: rgba(255,255,255,0.22);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 800; font-size: 16px; color: #fff;
}
.more-hero-info { flex: 1; min-width: 0; }
.more-hero-name { font-family: var(--font-display); font-size: 14.5px; font-weight: 700; line-height: 1.25; }
.more-hero-sub { font-size: 11px; color: rgba(255,255,255,0.85); margin-top: 3px; display: flex; align-items: center; gap: 5px; }
.more-hero-chev { color: rgba(255,255,255,0.75); flex-shrink: 0; }

.more-section-label {
  font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--text-faint); margin: 24px 4px 10px 4px;
}

.more-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.more-grid-card {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm), var(--glass-highlight);
  border-radius: var(--radius-sm);
  padding: 13px 14px;
  display: flex; flex-direction: column; gap: 8px;
  text-align: left;
  transition: transform 0.12s ease;
}
.more-grid-card:active { transform: scale(0.97); }
.more-grid-icon {
  width: 32px; height: 32px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; font-size: 15px;
  flex-shrink: 0;
}
.more-grid-title { font-size: 12.5px; font-weight: 700; color: var(--text); }
.more-grid-meta { font-size: 10.5px; color: var(--text-faint); }

.more-list-card {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm), var(--glass-highlight);
  border-radius: var(--radius-md);
  overflow: hidden;
}
.more-row {
  display: flex; align-items: center; gap: 12px;
  width: 100%; padding: 13px 16px;
  text-align: left;
  transition: background 0.12s ease;
}
.more-row:active { background: rgba(20,42,32,0.04); }
.more-row + .more-row { border-top: 1px solid var(--border-strong); border-top-color: rgba(20,42,32,0.08); }
.more-row-icon { color: var(--text-dim); flex-shrink: 0; display: flex; }
.more-row-label { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; color: var(--text); }
.more-row-value { font-size: 12px; color: var(--text-faint); flex-shrink: 0; }
.more-row-chev { color: var(--text-faint); flex-shrink: 0; display: flex; }
.more-row.danger .more-row-label { color: var(--red); }
.more-row.danger .more-row-icon { color: var(--red); }

.more-app-foot { text-align: center; margin-top: 22px; padding-bottom: 4px; }
.more-app-foot-name { font-size: 11.5px; font-weight: 700; color: var(--text-faint); }
.more-app-foot-ver { font-size: 10.5px; color: var(--text-faint); opacity: 0.7; margin-top: 2px; }
.qty-stepper {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-3);
  border-radius: var(--radius-full);
  padding: 4px 6px;
  flex-shrink: 0;
}
.qty-stepper button {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--surface-2);
  color: var(--text); font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.qty-val { font-size: 12px; font-weight: 700; min-width: 16px; text-align: center; }

/* ---------- Editor top bar ---------- */
.le-topbar { display: flex; align-items: center; gap: 12px; }
.le-back-btn {
  width: 38px; height: 38px; border-radius: 12px;
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm), var(--glass-highlight);
}
.le-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
.le-sub { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
.le-actions { display: flex; gap: 8px; margin-top: 14px; }
.le-actions .btn { flex: 1; }

.select {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  font-size: 16px;
  color: var(--text);
}

/* ---------- Contextual menu ---------- */
.ctx-menu {
  position: fixed; z-index: 150;
  background: var(--surface-2);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg), var(--glass-highlight);
  border-radius: var(--radius-sm);
  padding: 6px;
  min-width: 200px;
}
.ctx-menu-item {
  display: block; width: 100%; text-align: left;
  padding: 10px 12px; font-size: 12.5px; font-weight: 600; color: var(--text);
  border-radius: 10px;
}
.ctx-menu-item:active { background: var(--surface-3); }
.ctx-menu-item.danger { color: var(--red); }
.ctx-menu-divider { height: 1px; background: var(--border); margin: 4px 6px; }

.textarea {
  background: var(--surface);
  border: 1px solid var(--border);

}

/* ---------- Emoji picker cells ---------- */
.emoji-cell {

}

/* ---------- Entity grid (stores, etc.) ---------- */
.entity-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
.entity-card {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);

}

.entity-icon-lg {

}
.entity-name { font-size: 13.5px; font-weight: 700; color: var(--text); }
.entity-meta { font-size: 11px; color: var(--text-dim); }
.fav-badge { font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: var(--radius-full); background: var(--amber-glow); color: var(--amber); align-self: flex-start; }

.checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); cursor: pointer; }
.checkbox-row input { width: 16px; height: 16px; accent-color: var(--accent); }

/* ---------- Catalog ---------- */
.catalog-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
.catalog-card {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm), var(--glass-highlight);
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex; flex-direction: column; gap: 8px;
  text-align: left;
  position: relative;
  transition: transform 0.15s ease;
}
.catalog-card:active { transform: scale(0.97); }
.icon-tile-lg {
  width: 52px; height: 52px; border-radius: 16px;
  background: var(--surface-3);
  display: flex; align-items: center; justify-content: center; font-size: 24px;
}
.fav-toggle-btn {
  position: absolute; top: 10px; right: 10px;
  font-size: 16px; color: var(--text-faint); z-index: 2;
}
.fav-toggle-btn.active { color: var(--amber); }
.catalog-price { font-size: 12.5px; font-weight: 800; color: var(--accent); }
.catalog-price-empty { font-size: 11px; color: var(--text-faint); }

/* ---------- Catalog: photo-forward card (category drill-down) ---------- */
.catalog-photo-card {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm), var(--glass-highlight);
  border-radius: var(--radius-lg);
  overflow: hidden;
  text-align: left;
  position: relative;

}

.catalog-photo-wrap {
  width: 100%; aspect-ratio: 1.15 / 1;

}
.catalog-photo-wrap img { width: 100%; height: 100%; object-fit: cover; }
.catalog-photo-wrap img.no-bg { object-fit: contain; padding: 14px; }
.catalog-photo-fav {
  position: absolute; top: 8px; right: 8px;

  font-size: 14px; color: var(--text-faint); z-index: 2;
}

.catalog-photo-body { padding: 12px 14px 14px 14px; }
.catalog-photo-name { font-size: 13.5px; font-weight: 700; color: var(--text); line-height: 1.3; }
.catalog-photo-meta { font-size: 11.5px; color: var(--text-faint); margin-top: 3px; }

.catalog-add-card {
  background: var(--surface-3);
  border: 1.5px dashed var(--border-strong);
  box-shadow: none;
  align-items: center; justify-content: center;
}

.catalog-add-plus {
  width: 100%; aspect-ratio: 1.15 / 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; font-weight: 300; color: var(--text-faint);
}

.subcat-back-row { display: flex; align-items: center; gap: 12px; }
.subcat-title { font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--text); }

.catalog-row {
  display: flex; align-items: center; gap: 12px;
  width: 100%;
  padding: 12px 14px;
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm), var(--glass-highlight);
  border-radius: var(--radius-sm);

}

/* ---------- Product editor extras ---------- */
.product-image-preview {
  width: 84px; height: 84px; border-radius: var(--radius-md);
  background: var(--surface-3);
  border: 1px solid var(--border);

  overflow: hidden; flex-shrink: 0;
}
.product-image-preview img { width: 100%; height: 100%; object-fit: cover; }
.product-image-fallback { font-size: 32px; cursor: pointer; }
.field-hint { font-size: 11px; color: var(--text-faint); line-height: 1.4; }

/* ---------- Catalog picker CTA button ---------- */
.picker-cta {
  margin-top: 16px;
  width: 100%;
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1.5px dashed var(--border-strong);
  border-radius: var(--radius-md);

}

.picker-cta-title { font-size: 13.5px; font-weight: 700; color: var(--text); }

/* ---------- Quick category grid (list editor search) ---------- */
.qc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
.qc-item { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.qc-icon {
  width: 44px; height: 44px; border-radius: 14px;
  background: var(--surface-3);
  display: flex; align-items: center; justify-content: center;
  font-size: 19px;
  transition: transform 0.15s ease;
}
.qc-item:active .qc-icon { transform: scale(0.92); }
.qc-label { font-size: 9.5px; font-weight: 700; color: var(--text-dim); line-height: 1.2; }
.emoji-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
  max-height: 180px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 2px;
}
.emoji-grid .emoji-cell { width: 100%; aspect-ratio: 1; height: auto; }

.price-hist-card {
  background: var(--surface-3);

  margin-bottom: 12px;
}

.stat-mini-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
.stat-mini-label { font-size: 9.5px; color: var(--text-faint); }
.stat-mini-value { font-size: 12.5px; font-weight: 800; color: var(--text); margin-top: 1px; }
.stat-mini-value.accent { color: var(--accent); }

.mini-btn { background: none; border: none; padding: 6px 10px; border-radius: 10px; cursor: pointer; }
.mini-btn:active { background: var(--surface-3); }

/* ---------- Stats ---------- */
.stat-cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px; }
.stat-card { background: var(--surface); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--border); box-shadow: var(--shadow-sm), var(--glass-highlight); border-radius: var(--radius-sm); padding: 14px; }
.stat-card-label { font-size: 11px; color: var(--text-dim); font-weight: 600; }
.stat-card-value { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--text); margin-top: 4px; }
.stat-bar-row { margin-bottom: 12px; }
.stat-bar-row:last-child { margin-bottom: 0; }
.stat-bar-label { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; margin-bottom: 6px; }
.stat-product-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.stat-product-row + .stat-product-row { border-top: 1px solid var(--border); }
.stat-count-badge { font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: var(--radius-full); background: var(--surface-3); color: var(--text-dim); flex-shrink: 0; }
.stat-store-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; }
.stat-store-row + .stat-store-row { border-top: 1px solid var(--border); }

/* ---------- Stats v2: period selector + hero cards ---------- */
.period-pill-row { display:flex; gap:4px; margin-top:16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-full); padding:4px; }
.period-pill { flex:1; text-align:center; padding:9px 0; border-radius:var(--radius-full); font-size:12px; font-weight:700; color:var(--text-dim); }
.period-pill.active { background:linear-gradient(135deg,var(--accent-2),var(--accent)); color:#fff; box-shadow:0 4px 12px var(--accent-glow); }

.metric-card { margin-top:16px; background:var(--surface); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border:1px solid var(--border); box-shadow:var(--shadow-sm),var(--glass-highlight); border-radius:var(--radius-lg); padding:20px; }
.metric-top-row { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.metric-label { font-size:11.5px; font-weight:700; color:var(--text-dim); }
.metric-value { font-family:var(--font-display); font-size:30px; font-weight:800; color:var(--text); margin-top:6px; }
.metric-delta { display:inline-block; font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; }
.metric-delta.down { background:var(--accent-glow); color:var(--accent); }
.metric-delta.up { background:var(--red-glow); color:var(--red); }

.mbar-chart { display:flex; align-items:flex-end; gap:8px; height:90px; margin-top:52px; position:relative; }
.mbar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; justify-content:flex-end; position:relative; min-width:0; cursor:pointer; }
.mbar-fill { width:100%; background:var(--accent-glow); border-radius:8px; min-height:3px; transition:background 0.15s ease; }
.mbar-col:active .mbar-fill { background:var(--accent-2); }
.mbar-fill.peak { background:linear-gradient(180deg,var(--accent-2),var(--accent)); }
.mbar-fill.empty { background:transparent; border:1.5px dashed var(--border-strong); height:6px !important; align-self:flex-end; }
.mbar-day { font-size:9px; color:var(--text-faint); font-weight:700; white-space:nowrap; }
.mbar-tooltip { position:absolute; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%); background:#16241c; color:#fff; font-size:10px; font-weight:800; padding:5px 10px; border-radius:9px; white-space:nowrap; z-index:3; text-align:center; }
.mbar-tooltip.hidden { display:none; }
.mbar-tooltip-sub { font-size:8.5px; font-weight:600; opacity:0.75; margin-top:1px; }
.mbar-tooltip::after { content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%); width:7px; height:7px; background:#16241c; rotate:45deg; margin-top:-4px; }

.st-summary-grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
.st-summary-card3 { background:var(--surface); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border:1px solid var(--border); box-shadow:var(--shadow-sm),var(--glass-highlight); border-radius:var(--radius-sm); padding:13px 10px; }
.st-summary-icon3 { width:28px; height:28px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:13px; margin-bottom:8px; }
.st-summary-label3 { font-size:9.5px; color:var(--text-dim); font-weight:600; }
.st-summary-value3 { font-size:14px; font-weight:800; color:var(--text); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.savings-hero { margin-top:16px; background:linear-gradient(135deg,var(--accent-2),var(--accent)); border-radius:var(--radius-lg); padding:18px; color:#fff; display:flex; align-items:center; gap:14px; }
.savings-icon { width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.savings-label { font-size:11px; opacity:0.85; }
.savings-value { font-family:var(--font-display); font-size:19px; font-weight:800; margin-top:2px; }

.ring-hero { margin-top:16px; background:var(--surface); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border:1px solid var(--border); box-shadow:var(--shadow-sm),var(--glass-highlight); border-radius:var(--radius-lg); padding:20px; text-align:center; }
.ring-hero-wrap { position:relative; width:150px; height:150px; margin:14px auto 0; }
.ring-hero-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.ring-hero-val { font-family:var(--font-display); font-size:24px; font-weight:800; color:var(--text); }
.ring-hero-lbl { font-size:10.5px; color:var(--text-faint); margin-top:2px; }

.donut-card { margin-top:16px; background:var(--surface); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border:1px solid var(--border); box-shadow:var(--shadow-sm),var(--glass-highlight); border-radius:var(--radius-lg); padding:20px; }
.donut-title { font-size:13px; font-weight:700; color:var(--text); }
.donut-sub { font-size:10.5px; color:var(--text-faint); margin-top:1px; }
.donut-body { display:flex; align-items:center; gap:18px; margin-top:16px; }
.donut-ring-wrap { position:relative; width:100px; height:100px; flex-shrink:0; }
.donut-legend2 { flex:1; display:flex; flex-direction:column; gap:9px; min-width:0; }
.donut-legend2-item { display:flex; align-items:center; gap:8px; font-size:11.5px; }
.donut-dot2 { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.donut-legend2-name { flex:1; color:var(--text-dim); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.donut-legend2-pct { font-weight:800; color:var(--text); font-size:11.5px; flex-shrink:0; }

.tprow { display:flex; align-items:center; gap:12px; padding:10px 0; }
.tprow + .tprow { border-top:1px solid var(--border); }
.tp-rank { width:20px; font-size:12px; font-weight:800; color:var(--text-faint); flex-shrink:0; }
.tp-icon { width:34px; height:34px; border-radius:10px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.tp-name { flex:1; font-size:12.5px; font-weight:700; color:var(--text); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tp-bar-track { width:52px; height:5px; background:var(--surface-3); border-radius:999px; overflow:hidden; flex-shrink:0; }
.tp-bar-fill { height:100%; background:linear-gradient(90deg,var(--accent-2),var(--accent)); }
.tp-count { font-size:11px; font-weight:800; color:var(--accent); width:24px; text-align:right; flex-shrink:0; }
.tp-amount { font-size:13px; font-weight:800; color:var(--accent); flex-shrink:0; }

/* ---------- Settings ---------- */
.settings-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.currency-row { display: flex; align-items: center; gap: 10px; }
.currency-code { font-weight: 800; font-size: 13px; width: 44px; flex-shrink: 0; }
.currency-name { flex: 1; font-size: 12px; color: var(--text-dim); }
.currency-primary-badge { font-size: 10px; font-weight: 800; padding: 3px 9px; border-radius: var(--radius-full); background: var(--accent-glow); color: var(--accent); flex-shrink: 0; }
.rate-input-row { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-dim); flex-shrink: 0; }
.rate-input-row .input { width: 84px; padding: 6px 8px; font-size: 16px; }
.settings-info-card { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.two-col-btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.btn-block { width: 100%; }

/* ---------- Categories page ---------- */
.cat-page-banner {
  margin-top: 16px;
  background: linear-gradient(120deg, rgba(240,201,148,0.55) 0%, rgba(240,183,120,0.4) 100%);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md), var(--glass-highlight);
  border-radius: var(--radius-lg);
  padding: 20px;
  position: relative;
  overflow: hidden;
}
.cat-page-banner-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: #5a3a12; line-height: 1.3; max-width: 220px; }
.cat-page-banner-cta {
  margin-top: 12px;
  display: inline-flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  color: #fff; font-size: 12px; font-weight: 700;
  padding: 8px 16px; border-radius: var(--radius-full);
}
.cat-banner-img-ph {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  width: 84px; height: 84px; border-radius: 18px;
  background: rgba(255,255,255,0.4);
  border: 1px dashed rgba(90,58,18,0.3);
  display: flex; align-items: center; justify-content: center;
  color: #a8763f;
}

.cat-list-item {
  display: flex; align-items: stretch; gap: 0;
  width: 100%;
  min-height: 108px;
  margin-top: 14px;
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm), var(--glass-highlight);
  border-radius: var(--radius-lg);
  text-align: left;
  transition: transform 0.15s ease;
  overflow: hidden;
}
.cat-list-item:active { transform: scale(0.98); }
.cat-list-img-ph {
  width: 108px; flex-shrink: 0;
  background: var(--surface-3);
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; overflow: hidden;
}
.cat-list-img-ph img { width: 100%; height: 100%; object-fit: cover; }
.cat-list-img-ph img.no-bg { object-fit: contain; padding: 10px; }
.cat-list-body { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 16px 16px 16px 14px; }
.cat-list-text { flex: 1; min-width: 0; }
.cat-list-name { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.25; }
.cat-list-desc { font-size: 12.5px; color: var(--text-faint); margin-top: 4px; }
.cat-list-count { font-size: 12.5px; color: var(--text-dim); margin-top: 14px; font-weight: 500; }
.cat-list-chevron { flex-shrink: 0; color: var(--text-faint); width: 20px; height: 20px; }

/* ---------- Categories: selection mode ---------- */
.cat-list-item.selectable { cursor: pointer; }
.cat-list-item.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-glow), var(--shadow-sm), var(--glass-highlight);
}
.cat-select-check {
  width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid var(--border-strong);
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-right: 4px;
  transition: all 0.15s ease;
}
.cat-select-check.checked {
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  border-color: transparent; color: #fff;
}
.cat-drag-handle {
  color: var(--text-faint); font-size: 16px;
  display: flex; align-items: center; padding: 0 2px 0 14px;
  flex-shrink: 0; cursor: grab;
}
.cat-bulk-bar {
  position: sticky; bottom: 92px; left: 0; right: 0;
  margin-top: 16px;
  background: var(--surface-2);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg), var(--glass-highlight);
  border-radius: var(--radius-full);
  padding: 10px 10px 10px 18px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  z-index: 20;
}
.cat-bulk-count { font-size: 12.5px; font-weight: 700; color: var(--text); }

/* ---------- Shopping mode ---------- */
.shopping-header { }
.sh-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
.sh-title-block { text-align: center; flex: 1; min-width: 0; }
.sh-title { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-sub { font-size: 11px; color: var(--text-dim); }

.check-circle {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--border-strong);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 13px; color: transparent; background: transparent;
  transition: all 0.15s ease;
}
.check-circle.checked {
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  border-color: transparent; color: #fff;
  animation: checkPulse 0.3s ease;
}
.check-circle.unavailable-mark { background: var(--red); border-color: transparent; color: #fff; }
@keyframes checkPulse { 0% { transform: scale(0.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.list-item-row.bought, .list-card.bought { opacity: 0.55; }
.list-item-row.unavailable, .list-card.unavailable { opacity: 0.55; }

.toggle-bought-btn {
  width: 100%; text-align: center;
  font-size: 12px; font-weight: 700; color: var(--text-dim);
  padding: 12px; margin-top: 6px;
}

/* ---------- Shopping hero (progress ring) ---------- */
.shop-hero {
  margin-top: 18px;
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  border-radius: var(--radius-lg);
  padding: 20px;
  color: #fff;
  box-shadow: var(--shadow-md);
}
.shop-hero-top { display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; }
.shop-hero-name { font-family: var(--font-display); font-size: 16px; font-weight: 700; }
.shop-hero-count { font-size: 11px; opacity: 0.85; margin-top: 6px; }
.shop-hero-ring-wrap { position: relative; width: 68px; height: 68px; flex-shrink:0; }
.shop-hero-ring-label { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; }
.shop-hero-stats { display:flex; justify-content:space-between; align-items:flex-end; }
.shop-hero-stat-label { font-size: 10px; opacity: 0.75; text-transform:uppercase; letter-spacing:0.05em; }
.shop-hero-stat-value { font-size: 17px; font-weight: 800; margin-top:2px; }
.shop-hero-budget-warn { background: rgba(255,255,255,0.22); border-radius: 999px; padding: 5px 12px; font-size: 11px; font-weight:700; display:inline-flex; align-items:center; gap:5px; margin-top:10px; }

/* ---------- Shopping mode v2 ---------- */
.hero2-divider { height:1px; background:rgba(255,255,255,0.22); margin:14px 0; }
.hero2-stats { display:flex; }
.hero2-stat { flex:1; }
.hero2-stat + .hero2-stat { border-left:1px solid rgba(255,255,255,0.22); padding-left:14px; margin-left:14px; }
.hero2-budget-bar { height:5px; background:rgba(255,255,255,0.22); border-radius:999px; overflow:hidden; margin-top:10px; }
.hero2-budget-fill { height:100%; background:#fff; border-radius:999px; transition:width 0.4s cubic-bezier(0.4,0,0.2,1); }
.hero2-budget-fill.over { background:#ffb4a8; }

/* ---------- Shopping mode: complete state ---------- */
.hero-complete { text-align:center; padding:8px 0 4px 0; }
.hero-complete-icon { width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,0.22); display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 10px; }
.hero-complete-title { font-family:var(--font-display); font-size:18px; font-weight:800; color:#fff; }
.hero-complete-sub { font-size:12px; opacity:0.85; margin-top:3px; color:#fff; }
.hero-complete-stats { display:flex; justify-content:center; gap:24px; margin-top:16px; }
.hero-complete-stat-label { font-size:9.5px; opacity:0.75; text-transform:uppercase; letter-spacing:0.05em; color:#fff; }
.hero-complete-stat-value { font-size:16px; font-weight:800; margin-top:2px; color:#fff; }
.finish-cta {
  margin-top:16px; width:100%; background:#fff; color:var(--accent);
  border-radius:999px; padding:13px; font-size:14px; font-weight:800;
  display:flex; align-items:center; justify-content:center; gap:8px;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
}
.done-banner { display:flex; align-items:center; gap:10px; background:var(--accent-glow); border-radius:14px; padding:12px 14px; margin-top:18px; }
.done-banner-icon { font-size:20px; }
.done-banner-text { font-size:12.5px; font-weight:700; color:var(--accent); }

.section-pill2 { display:flex; align-items:center; gap:8px; margin:18px 0 10px 2px; }
.section-pill2-label { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint); }
.section-pill2-count { font-size:10px; font-weight:800; background:var(--surface-3); color:var(--text-dim); padding:2px 8px; border-radius:999px; }
.cat-divider2 { display:flex; align-items:center; gap:6px; font-size:11px; font-weight:800; color:var(--text-dim); margin:18px 0 8px 2px; }

.pcard2 {
  background:var(--surface); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--border); box-shadow:var(--shadow-sm),var(--glass-highlight);
  border-radius:18px; padding:10px; display:flex; align-items:center; gap:12px;
}
.pcard2.done { background:var(--accent-glow); border-color:transparent; }
.pcard2.unavailable { opacity:0.55; }
.pcard2-thumb { width:52px; height:52px; border-radius:14px; background:var(--surface-3); flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:22px; }
.pcard2-thumb img { width:100%; height:100%; object-fit:cover; }
.pcard2.done .pcard2-thumb { opacity:0.5; }
.pcard2-info { flex:1; min-width:0; }
.pcard2-name { font-size:13px; font-weight:700; color:var(--text); }
.pcard2.done .pcard2-name { text-decoration:line-through; color:var(--text-faint); }
.pcard2-meta { font-size:10.5px; color:var(--text-dim); margin-top:2px; }
.pcard2-price { font-size:12.5px; font-weight:800; color:var(--text-dim); margin-top:3px; }
.pcard2.done .pcard2-price { color:var(--accent); }
.check2 {
  width:30px; height:30px; border-radius:50%; flex-shrink:0;
  border:2.5px solid var(--border-strong);
  display:flex; align-items:center; justify-content:center; color:transparent; font-size:14px;
  transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
.check2.checked { background:linear-gradient(135deg,var(--accent-2),var(--accent)); border-color:transparent; color:#fff; box-shadow:0 4px 12px var(--accent-glow); transform:scale(1.06); }
.check2.unavailable-mark { background:var(--red); border-color:transparent; color:#fff; }

.gcard2 { background:var(--surface); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); border:1px solid var(--border); box-shadow:var(--shadow-sm),var(--glass-highlight); border-radius:18px; overflow:hidden; position:relative; display:flex; flex-direction:column; }
.gcard2.done { background:var(--accent-glow); border-color:transparent; }
.gcard2-photo-btn { display:block; width:100%; position:relative; }
.gcard2-photo { width:100%; aspect-ratio:1.1/1; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:32px; overflow:hidden; }
.gcard2-photo img { width:100%; height:100%; object-fit:cover; }
.gcard2.done .gcard2-photo { opacity:0.45; }
.gcard2-badge { position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; box-shadow:var(--shadow-sm); }
.gcard2-badge.checked { background:linear-gradient(135deg,var(--accent-2),var(--accent)); }
.gcard2-badge.unavailable-mark { background:var(--red); }
.gcard2-body { padding:10px 10px 4px 10px; flex:1; }
.gcard2-name { font-size:12.5px; font-weight:700; color:var(--text); line-height:1.3; }
.gcard2.done .gcard2-name { text-decoration:line-through; color:var(--text-faint); }
.gcard2-meta { font-size:10.5px; color:var(--text-dim); margin-top:3px; }
.gcard2-footer { display:flex; align-items:center; justify-content:space-between; padding:6px 10px 10px 10px; }
.gcard2-price { font-size:12.5px; font-weight:800; color:var(--text-dim); }
.gcard2.done .gcard2-price { color:var(--accent); }

/* ---------- Photo item card (shopping list) ---------- */
.photo-item-card {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm), var(--glass-highlight);
  border-radius: var(--radius-md);
  padding: 10px;
  display:flex; align-items:center; gap:12px;
}
.photo-item-card.done, .photo-item-card.unavailable { opacity: 0.5; }
.photo-item-thumb { width: 52px; height: 52px; border-radius: 14px; background: var(--surface-3); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:24px; overflow:hidden; }
.photo-item-thumb img { width:100%; height:100%; object-fit:cover; }
.photo-item-info { flex:1; min-width:0; }
.photo-item-name { font-size: 13.5px; font-weight:700; color:var(--text); }
.photo-item-meta { font-size: 11px; color:var(--text-dim); margin-top:2px; }
.photo-item-price { font-size: 13px; font-weight:800; margin-top: 3px; }


/* ---------- List editor hero ---------- */
.le-hero {
  margin-top: 18px;
  background: linear-gradient(120deg, rgba(185,226,204,0.55) 0%, rgba(205,234,219,0.45) 60%, rgba(228,244,234,0.35) 100%);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md), var(--glass-highlight);
  border-radius: var(--radius-lg);
  padding: 18px;
}
.le-hero-top { display:flex; align-items:center; gap:12px; }
.le-hero-icon { width:44px; height:44px; border-radius:14px; background:rgba(255,255,255,0.5); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.le-hero-name { font-family: var(--font-display); font-size:16px; font-weight:700; color:var(--text); }
.le-hero-store { font-size:11.5px; color:var(--text-dim); margin-top:1px; }
.le-hero-stats { display:flex; gap:16px; margin-top:14px; padding-top:12px; border-top:1px dashed var(--border-strong); }
.le-hero-stat-label { font-size:9.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em; }
.le-hero-stat-value { font-size:14px; font-weight:800; color:var(--text); margin-top:2px; }

/* ---------- Invoice ---------- */
.invoice-hero { text-align: center; margin: 20px 0 22px 0; }
.invoice-hero-emoji { font-size: 38px; }
.invoice-card {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md), var(--glass-highlight);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 26px 22px 20px 22px;
}
.invoice-summary-row { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; margin-bottom: 14px; flex-wrap: wrap; gap: 6px; color: var(--text-dim); }
.invoice-row { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; color: var(--text-dim); }
.invoice-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px; margin-top: 10px; border-top: 1px dashed var(--border-strong); }
.invoice-total .amount { font-family: var(--font-display); font-size: 25px; font-weight: 700; color: var(--accent); }
.receipt-edge {
  height: 12px;
  background: linear-gradient(135deg, var(--bg-grad) 50%, transparent 50%) 0 0, linear-gradient(-135deg, var(--bg-grad) 50%, transparent 50%) 0 0;
  background-size: 14px 14px; background-repeat: repeat-x;
  filter: drop-shadow(0 2px 3px rgba(20,42,32,0.06));
}
</style>
</head>

<script>
const DB_NAME = 'sgm_db';
const DB_VERSION = 1;

const STORES = {
  products:      { keyPath: 'id', indexes: ['category', 'favorite', 'updatedAt', 'syncStatus'] },
  stores:        { keyPath: 'id', indexes: ['favorite', 'updatedAt', 'syncStatus'] },
  prices:        { keyPath: 'id', indexes: ['productId', 'storeId', 'date', 'updatedAt', 'syncStatus'] },
  lists:         { keyPath: 'id', indexes: ['status', 'storeId', 'updatedAt', 'syncStatus'] },
  listItems:     { keyPath: 'id', indexes: ['listId', 'productId', 'status', 'updatedAt', 'syncStatus'] },
  purchases:     { keyPath: 'id', indexes: ['listId', 'storeId', 'date', 'updatedAt', 'syncStatus'] },
  purchaseItems: { keyPath: 'id', indexes: ['purchaseId', 'productId', 'updatedAt', 'syncStatus'] },
  currencies:    { keyPath: 'code', indexes: ['updatedAt'] },
  categories:    { keyPath: 'id', indexes: ['order', 'updatedAt'] },
  settings:      { keyPath: 'key' },
  syncQueue:     { keyPath: 'id', indexes: ['entity', 'createdAt'] },
};

class LocalDB {
  constructor() { this.db = null; }
  open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        for (const [name, cfg] of Object.entries(STORES)) {
          if (!db.objectStoreNames.contains(name)) {
            const os = db.createObjectStore(name, { keyPath: cfg.keyPath });
            (cfg.indexes || []).forEach(idx => os.createIndex(idx, idx, { unique: false }));
          }
        }
      };
      req.onsuccess = (e) => { this.db = e.target.result; resolve(this.db); };
      req.onerror = (e) => reject(e.target.error);
    });
  }
  _tx(store, mode = 'readonly') { return this.db.transaction(store, mode).objectStore(store); }
  getAll(store) {
    return new Promise((resolve, reject) => {
      const req = this._tx(store).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  get(store, key) {
    return new Promise((resolve, reject) => {
      const req = this._tx(store).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }
  getByIndex(store, indexName, value) {
    return new Promise((resolve, reject) => {
      const req = this._tx(store).index(indexName).getAll(value);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  put(store, value) {
    return new Promise((resolve, reject) => {
      const req = this._tx(store, 'readwrite').put(value);
      req.onsuccess = () => resolve(value);
      req.onerror = () => reject(req.error);
    });
  }
  bulkPut(store, values) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, 'readwrite');
      const os = tx.objectStore(store);
      values.forEach(v => os.put(v));
      tx.oncomplete = () => resolve(values);
      tx.onerror = () => reject(tx.error);
    });
  }
  delete(store, key) {
    return new Promise((resolve, reject) => {
      const req = this._tx(store, 'readwrite').delete(key);
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  }
}

const localDB = new LocalDB();

function uid() { return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9); }
function nowISO() { return new Date().toISOString(); }

function withSyncFields(obj, isNew) {
  const ts = nowISO();
  return { ...obj, createdAt: isNew ? ts : (obj.createdAt || ts), updatedAt: ts, syncStatus: 'pending' };
}

class NullCloudAdapter {
  async isAvailable() { return false; }
  async pushChanges() { throw new Error('No cloud adapter configured'); }
  async pullChanges() { return []; }
}

class FirebaseCloudAdapter {
  constructor() { this.uid = null; this.unsubscribers = []; }
  setUser(uid) { this.uid = uid; }
  async isAvailable() { return !!(window.Firebase && this.uid); }

  // Sube un solo registro de una colección a users/{uid}/{storeName}/{id}
  async pushRecord(storeName, record) {
    if (!this.uid || !window.Firebase) return;
    const { doc, setDoc, deleteDoc, db } = { ...window.Firebase, db: window.Firebase.db };
    const ref = doc(db, 'users', this.uid, storeName, String(record.id ?? record.code ?? record.key));
    if (record._deleted) {
      await deleteDoc(ref);
    } else {
      await setDoc(ref, { ...record, syncStatus: 'synced' }, { merge: true });
    }
  }

  // Escucha cambios remotos en vivo para una colección y los aplica a la copia local
  watchCollection(storeName, onRemoteChange) {
    if (!this.uid || !window.Firebase) return () => {};
    const { collection, onSnapshot, db } = window.Firebase;
    const ref = collection(db, 'users', this.uid, storeName);
    const unsub = onSnapshot(ref, (snap) => {
      snap.docChanges().forEach((change) => {
        onRemoteChange(storeName, change.doc.data(), change.type);
      });
    }, (err) => console.warn('Firestore watch error en', storeName, err));
    this.unsubscribers.push(unsub);
    return unsub;
  }

  stopAll() { this.unsubscribers.forEach(u => u()); this.unsubscribers = []; }
}

class SyncEngine {
  constructor(db, adapter) {
    this.db = db;
    this.adapter = adapter || new NullCloudAdapter();
    this.isOnline = typeof navigator !== 'undefined' ? navigator.onLine : true;
    this.listeners = [];
    this.syncableStores = Object.keys(STORES).filter(n => n !== 'syncQueue' && n !== 'settings' && n !== 'currencies');
    if (typeof window !== 'undefined') {
      window.addEventListener('online', () => { this.isOnline = true; this._notify(); this.attemptSync(); });
      window.addEventListener('offline', () => { this.isOnline = false; this._notify(); });
    }
  }
  onChange(fn) { this.listeners.push(fn); }
  _notify() { this.listeners.forEach(fn => fn()); }
  async getStatus() {
    const available = await this.adapter.isAvailable();
    let pendingCount = 0;
    for (const name of Object.keys(STORES)) {
      if (name === 'syncQueue' || name === 'settings') continue;
      const all = await this.db.getAll(name);
      pendingCount += all.filter(r => r.syncStatus === 'pending').length;
    }
    return { connected: available, online: this.isOnline, pendingCount, mode: available ? 'cloud' : (this.isOnline ? 'local-only' : 'offline') };
  }
  async markDirty() { this._notify(); if (this.isOnline) this.attemptSync(); return true; }

  // Sube todos los registros pendientes de cada tienda sincronizable
  async attemptSync() {
    const available = await this.adapter.isAvailable();
    if (!available || !this.isOnline) return;
    for (const storeName of this.syncableStores) {
      const all = await this.db.getAll(storeName);
      const pending = all.filter(r => r.syncStatus === 'pending');
      for (const record of pending) {
        try {
          await this.adapter.pushRecord(storeName, record);
          await this.db.put(storeName, { ...record, syncStatus: 'synced' });
        } catch (err) {
          console.warn('Error sincronizando', storeName, record.id, err);
        }
      }
    }
    this._notify();
  }

  // Aplica un cambio recibido desde Firestore en tiempo real a la copia local (sin re-marcarlo pending)
  async applyRemoteChange(storeName, data, changeType) {
    if (changeType === 'removed') {
      await this.db.delete(storeName, data.id ?? data.code);
    } else {
      const existing = await this.db.get(storeName, data.id ?? data.code).catch(() => null);
      // Evita pisar una edición local más reciente que aún no se ha subido
      if (existing && existing.syncStatus === 'pending' && existing.updatedAt > (data.updatedAt || '')) return;
      await this.db.put(storeName, { ...data, syncStatus: 'synced' });
    }
    this._notify();
  }

  // Empieza a escuchar todas las colecciones sincronizables para el usuario actual
  startWatching(onDataChanged) {
    if (!(this.adapter instanceof FirebaseCloudAdapter)) return;
    this.adapter.stopAll();
    this.syncableStores.forEach(storeName => {
      this.adapter.watchCollection(storeName, async (name, data, type) => {
        await this.applyRemoteChange(name, data, type);
        onDataChanged();
      });
    });
  }
}

const syncEngine = new SyncEngine(localDB, new FirebaseCloudAdapter());

async function seedIfEmpty() {
  const cats = await localDB.getAll('categories');
  if (cats.length === 0) {
    const seeded = DEFAULT_CATEGORIES.map((c, i) => withSyncFields({ id: uid(), name: c.name, icon: c.icon, subcategories: c.subcategories || [], order: i }, true));
    await localDB.bulkPut('categories', seeded);
  } else {
    await migrateSplitFruitsVegetables(cats);
    const catsAfterSplit = await localDB.getAll('categories');
    await migrateFillMissingSubcategories(catsAfterSplit);
  }
  const currencies = await localDB.getAll('currencies');
  if (currencies.length === 0) {
    const seeded = DEFAULT_CURRENCIES.map(c => withSyncFields({ ...c, lastUpdated: nowISO() }, true));
    await localDB.bulkPut('currencies', seeded);
  }
  const settings = await localDB.get('settings', 'app');
  if (!settings) {
    await localDB.put('settings', withSyncFields({ key: 'app', appName: 'Smart Grocery Manager', primaryCurrency: 'DOP', defaultStoreId: null, defaultView: 'list', theme: 'light' }, true));
  }
}

async function migrateSplitFruitsVegetables(existingCats) {
  const old = existingCats.find(c => c.name === 'Frutas y vegetales');
  if (!old) return;
  const settings = await localDB.get('settings', 'app');
  if (settings && settings.migratedFruitsVeg) return;

  const frutas = withSyncFields({ id: uid(), name: 'Frutas', icon: '🍎', subcategories: ['Tropicales', 'Cítricos', 'Berries', 'Otras'], order: old.order }, true);
  const vegetales = withSyncFields({ id: uid(), name: 'Vegetales', icon: '🥦', subcategories: ['Hojas verdes', 'Raíces', 'Otros'], order: old.order + 0.5 }, true);
  await localDB.bulkPut('categories', [frutas, vegetales]);
  await localDB.delete('categories', old.id);

  const products = await localDB.getAll('products');
  const affected = products.filter(p => p.category === 'Frutas y vegetales');
  if (affected.length > 0) {
    const updated = affected.map(p => withSyncFields({ ...p, category: 'Vegetales' }, false));
    await localDB.bulkPut('products', updated);
  }

  await localDB.put('settings', withSyncFields({ ...(settings || { key: 'app' }), migratedFruitsVeg: true }, false));
}

async function migrateFillMissingSubcategories(existingCats) {
  const settings = await localDB.get('settings', 'app');
  if (settings && settings.migratedSubcats) return;

  const toUpdate = [];
  for (const cat of existingCats) {
    const hasNone = !cat.subcategories || cat.subcategories.length === 0;
    if (!hasNone) continue;
    const seedMatch = DEFAULT_CATEGORIES.find(d => d.name === cat.name);
    if (seedMatch && seedMatch.subcategories && seedMatch.subcategories.length > 0) {
      toUpdate.push(withSyncFields({ ...cat, subcategories: [...seedMatch.subcategories] }, false));
    }
  }
  if (toUpdate.length > 0) {
    await localDB.bulkPut('categories', toUpdate);
  }
  await localDB.put('settings', withSyncFields({ ...(settings || { key: 'app' }), migratedSubcats: true }, false));
}

function getPrimaryCurrency() {
  return AppState.data.currencies.find(c => c.isPrimary) || AppState.data.currencies[0] || { code: 'DOP', symbol: 'RD$' };
}
function formatMoney(amount, currencyCode) {
  const cur = AppState.data.currencies.find(c => c.code === currencyCode) || getPrimaryCurrency();
  const symbol = cur.symbol || cur.code;
  const val = Number(amount || 0);
  return `${symbol}${val.toLocaleString('es-DO', { minimumFractionDigits: 0, maximumFractionDigits: 2 })}`;
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
function timeGreeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Buenos días';
  if (h < 19) return 'Buenas tardes';
  return 'Buenas noches';
}
function daysAgo(isoDate) {
  if (!isoDate) return null;
  return Math.floor((Date.now() - new Date(isoDate).getTime()) / 86400000);
}

function computePurchaseIntervals(productId, purchaseItems) {
  const dates = purchaseItems.filter(pi => pi.productId === productId).map(pi => new Date(pi.date).getTime()).sort((a,b)=>a-b);
  if (dates.length < 2) return null;
  const gaps = [];
  for (let i = 1; i < dates.length; i++) gaps.push((dates[i]-dates[i-1]) / 86400000);
  const avg = gaps.reduce((a,b)=>a+b,0) / gaps.length;
  return { avgDays: Math.round(avg), lastDate: new Date(dates[dates.length-1]).toISOString(), count: dates.length };
}
async function getSmartSuggestions() {
  const purchaseItems = await localDB.getAll('purchaseItems').catch(() => []);
  if (!purchaseItems || purchaseItems.length === 0) return [];
  const suggestions = [];
  const byProduct = {};
  purchaseItems.forEach(pi => { (byProduct[pi.productId] ||= []).push(pi); });
  for (const productId of Object.keys(byProduct)) {
    const interval = computePurchaseIntervals(productId, purchaseItems);
    if (!interval) continue;
    const since = daysAgo(interval.lastDate);
    if (since !== null && since >= interval.avgDays - 1) suggestions.push({ productId, avgDays: interval.avgDays, since });
  }
  return suggestions;
}
async function getFrequentProducts(limit = 6) {
  const purchaseItems = await localDB.getAll('purchaseItems').catch(() => []);
  if (!purchaseItems || purchaseItems.length === 0) return [];
  const counts = {};
  purchaseItems.forEach(pi => { counts[pi.productId] = (counts[pi.productId] || 0) + 1; });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0, limit).map(([productId,count]) => ({ productId, count }));
}

function buildSparklineSVG(values, opts) {
  opts = opts || {};
  const w = opts.width || 280;
  const h = opts.height || 44;
  const pad = 4;
  if (values.length < 2) return '';
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const step = (w - pad * 2) / (values.length - 1);
  const points = values.map((v, i) => {
    const x = pad + i * step;
    const y = h - pad - ((v - min) / range) * (h - pad * 2);
    return [x, y];
  });
  const pathD = points.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const areaD = pathD + ` L${points[points.length-1][0].toFixed(1)},${h} L${points[0][0].toFixed(1)},${h} Z`;
  const dotsD = points.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="var(--accent)" />`).join('');
  return `
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img" aria-label="Evolución de precio">
      <path d="${areaD}" fill="var(--accent-glow)" stroke="none" />
      <path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      ${dotsD}
    </svg>`;
}

const PAGE_RENDERERS = {};

let navToken = 0;
async function navigate(route, params, isBack) {
  if (!isBack && AppState.route && (AppState.route !== route || JSON.stringify(AppState.routeParams) !== JSON.stringify(params || {}))) {
    AppState.history.push({ route: AppState.route, params: AppState.routeParams });
    if (AppState.history.length > 20) AppState.history.shift();
  }
  AppState.route = route;
  AppState.routeParams = params || {};
  // Recordamos la última pestaña principal para reabrir ahí la próxima vez que se
  // abra la app, en vez de ir siempre a Inicio. Solo guardamos rutas de nivel raíz
  // (sin parámetros que dependan de un ítem específico que podría ya no existir).
  const restorableRoutes = ['home', 'categories', 'shop', 'stats', 'more'];
  if (restorableRoutes.includes(route)) {
    try { localStorage.setItem('sgm_last_route', route); } catch (e) {}
  }
  renderBottomNav();
  const hideHeaderRoutes = ['categories', 'shop', 'shopping', 'listEditor', 'stats', 'home', 'more', 'stores', 'history', 'settings'];
  const header = document.querySelector('.app-header');
  const searchRow = document.querySelector('.search-row');
  const shouldHide = hideHeaderRoutes.includes(route) || route === 'catalog';
  if (header) header.style.display = shouldHide ? 'none' : '';
  if (searchRow) searchRow.style.display = shouldHide ? 'none' : '';
  const renderer = PAGE_RENDERERS[route] || PAGE_RENDERERS['notfound'];
  const content = document.getElementById('content');
  content.classList.toggle('no-header-pad', shouldHide);
  // Solo mostramos el esqueleto de carga si el renderer tarda de verdad;
  // así evitamos el destello gris en cambios de pestaña, que son casi siempre instantáneos.
  const myToken = ++navToken;
  const skeletonTimer = setTimeout(() => {
    if (myToken === navToken) content.innerHTML = `<div class="skeleton" style="height:400px; margin-top:20px;"></div>`;
  }, 80);
  await renderer(content, AppState.routeParams);
  clearTimeout(skeletonTimer);
  // Si mientras este renderer corría llegó una navegación más nueva (por ejemplo un
  // refresco en vivo desde Firestore), descartamos este resultado para no pisar el
  // render actual ni dejar el contenido a medio escribir.
  if (myToken !== navToken) return;
  document.querySelector('.scroll-area').scrollTo(0, 0);
}

function goBack(fallbackRoute, fallbackParams) {
  const prev = AppState.history.pop();
  if (prev) navigate(prev.route, prev.params, true);
  else navigate(fallbackRoute || 'home', fallbackParams, true);
}
