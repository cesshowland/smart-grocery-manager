        </div>
        <div class="field" style="max-width:100px;">
          <div class="field-label">Moneda</div>
          <select class="input" id="pf_currency">
            ${currencies.map(c => `<option value="${c.code}" ${((existing&&existing.referenceCurrency)||getPrimaryCurrency().code)===c.code?'selected':''}>${c.code}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field-hint mb-3">Precio de referencia general. Los precios reales por supermercado se registran al usar el producto en una compra.</div>

      <div class="field">
        <div class="field-label">Notas (opcional)</div>
        <textarea class="textarea" id="pf_notes">${escapeHTML((existing&&existing.notes) || '')}</textarea>
      </div>

      <label class="checkbox-row">
        <input type="checkbox" id="pf_favorite" ${existing&&existing.favorite ? 'checked' : ''}>
        Marcar como favorito
      </label>
    `,
    footerHTML: `
      ${existing ? '<button class="btn btn-secondary" id="pf_delete" style="color:var(--red); font-size:11px; padding:8px 10px;">Eliminar</button>' : ''}
      <button class="btn btn-primary" id="pf_save" style="flex:1;">${existing ? 'Guardar cambios' : 'Crear producto'}</button>
    `,
    onMount: (overlay) => {
      const categorySelect = overlay.querySelector('#pf_category');
      const subcatSelect = overlay.querySelector('#pf_subcategory');
      function renderSubcatOptions(catName, preselect) {
        const cat = categories.find(c => c.name === catName);
        const subs = (cat && cat.subcategories) || [];
        if (subs.length === 0) {
          subcatSelect.innerHTML = `<option value="">— No aplica —</option>`;
          subcatSelect.disabled = true;
          return;
        }
        subcatSelect.disabled = false;
        subcatSelect.innerHTML = `<option value="">Sin subcategoría</option>` + subs.map(s => `<option value="${escapeHTML(s)}" ${preselect===s?'selected':''}>${escapeHTML(s)}</option>`).join('');
      }
      renderSubcatOptions(categorySelect.value, prefillSubcategory);
      categorySelect.addEventListener('change', () => renderSubcatOptions(categorySelect.value, null));

      if (existing) {
        Repo.listPricesForProduct(existing.id).then(prices => {
          const slot = overlay.querySelector('#priceHistorySlot');
          if (!slot || prices.length === 0) return;
          const sorted = [...prices].sort((a,b) => new Date(a.date)-new Date(b.date));
          const amounts = sorted.map(p => p.amount);
          const current = amounts[amounts.length-1];
          const min = Math.min(...amounts);
          const max = Math.max(...amounts);
          const avg = amounts.reduce((a,b)=>a+b,0) / amounts.length;
          const trail = sorted.slice(-6).map(p => formatMoney(p.amount, p.currency)).join(' → ');
          const sparkline = buildSparklineSVG(amounts.slice(-12));
          slot.innerHTML = `
            <div class="price-hist-card">
              <div class="price-hist-label">Historial de precios</div>
              <div class="stat-mini-grid">
                <div><div class="stat-mini-label">Actual</div><div class="stat-mini-value accent">${formatMoney(current, sorted[sorted.length-1].currency)}</div></div>
                <div><div class="stat-mini-label">Mínimo</div><div class="stat-mini-value">${formatMoney(min, sorted[0].currency)}</div></div>
                <div><div class="stat-mini-label">Máximo</div><div class="stat-mini-value">${formatMoney(max, sorted[0].currency)}</div></div>
                <div><div class="stat-mini-label">Promedio</div><div class="stat-mini-value">${formatMoney(avg, sorted[0].currency)}</div></div>
              </div>
              ${sparkline ? `<div class="mb-1">${sparkline}</div>` : ''}
              <div style="font-size:10.5px; color:var(--text-faint); margin-top:4px;">${trail}</div>
            </div>
          `;

          const byStore = {};
          sorted.forEach(p => { if (!byStore[p.storeId] || new Date(p.date) > new Date(byStore[p.storeId].date)) byStore[p.storeId] = p; });
          const storeEntries = Object.entries(byStore);
          if (storeEntries.length > 1) {
            const best = storeEntries.reduce((a, b) => (a[1].amount <= b[1].amount ? a : b));
            const compareHTML = `
              <div class="price-hist-card">
                <div class="price-hist-label">Precio por supermercado</div>
                ${storeEntries.map(([storeId, p]) => {
                  const s = AppState.data.stores.find(x => x.id === storeId);
                  const isBest = storeId === best[0];
                  return `<div class="flex items-center justify-between" style="font-size:12px; padding:4px 0;">
                    <span style="color:${isBest?'var(--accent)':'var(--text-dim)'}; font-weight:${isBest?'700':'400'};">${isBest?'💡 ':''}${escapeHTML((s&&s.name) || 'Supermercado')}</span>
                    <span style="font-weight:${isBest?'800':'400'}; color:${isBest?'var(--accent)':'var(--text)'};">${formatMoney(p.amount, p.currency)}</span>
                  </div>`;
                }).join('')}
              </div>
            `;
            slot.insertAdjacentHTML('beforeend', compareHTML);
          }
        });
      }
      const iconGrid = overlay.querySelector('#iconPickerGrid');
      const previewEl = overlay.querySelector('#productImagePreview');
      const clearBtn = overlay.querySelector('#pf_imageClear');
      const urlField = overlay.querySelector('#pf_imageUrlField');
      const urlInput = overlay.querySelector('#pf_imageUrlInput');

      function renderPreview() {
        if (selectedImage) {
          previewEl.innerHTML = `<img src="${selectedImage}" alt="">`;
          clearBtn.style.display = '';
        } else {
          previewEl.innerHTML = `<span id="iconPickerBtn" class="product-image-fallback">${selectedIcon}</span>`;
          clearBtn.style.display = 'none';
          bindIconBtn();
        }
      }
      function bindIconBtn() {
        const btn = overlay.querySelector('#iconPickerBtn');
        if (btn) btn.addEventListener('click', () => iconGrid.classList.toggle('hidden'));
      }
      bindIconBtn();

      iconGrid.querySelectorAll('[data-emoji]').forEach(cell => {
        cell.addEventListener('click', () => {
          selectedIcon = cell.dataset.emoji;
          iconGrid.querySelectorAll('.emoji-cell').forEach(c => c.classList.remove('selected'));
          cell.classList.add('selected');
          iconGrid.classList.add('hidden');
          if (!selectedImage) renderPreview();
        });
      });

      overlay.querySelector('#pf_imageFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) { showToast('La imagen es muy grande (máx. 8MB)', 'error'); return; }
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 640;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            selectedImage = canvas.toDataURL('image/jpeg', 0.75);
            renderPreview();
          };
          img.onerror = () => { showToast('No se pudo procesar la imagen', 'error'); };
          img.src = reader.result;
        };
        reader.onerror = () => { showToast('No se pudo leer el archivo', 'error'); };
        reader.readAsDataURL(file);
      });

      overlay.querySelector('#pf_imageUrlBtn').addEventListener('click', () => {
        urlField.classList.toggle('hidden');
        if (!urlField.classList.contains('hidden')) urlInput.focus();
      });
      urlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const url = urlInput.value.trim();
          if (url) { selectedImage = url; renderPreview(); urlField.classList.add('hidden'); }
        }
      });
      urlInput.addEventListener('blur', () => {
        const url = urlInput.value.trim();
        if (url) { selectedImage = url; renderPreview(); }
      });

      clearBtn.addEventListener('click', () => { selectedImage = null; renderPreview(); });

      overlay.querySelector('#pf_save').addEventListener('click', async () => {
        const name = overlay.querySelector('#pf_name').value.trim();
        if (!name) { showToast('El nombre es obligatorio', 'error'); return; }
        const saveBtn = overlay.querySelector('#pf_save');
        saveBtn.textContent = 'Guardando...';
        saveBtn.style.opacity = '0.6';
        saveBtn.style.pointerEvents = 'none';
        const payload = {
          id: existing ? existing.id : undefined,
          name, icon: selectedIcon, imageUrl: selectedImage || null,
          category: overlay.querySelector('#pf_category').value || null,
          subcategory: overlay.querySelector('#pf_subcategory').value || null,
          brand: overlay.querySelector('#pf_brand').value.trim() || null,
          unit: overlay.querySelector('#pf_unit').value,
          size: overlay.querySelector('#pf_size').value.trim() || null,
          referencePrice: overlay.querySelector('#pf_price').value ? Number(overlay.querySelector('#pf_price').value) : null,
          referenceCurrency: overlay.querySelector('#pf_currency').value,
          notes: overlay.querySelector('#pf_notes').value.trim() || null,
          favorite: overlay.querySelector('#pf_favorite').checked,
        };
        try {
          await Repo.saveProduct(payload);
          await refreshCoreData();
          closeModal();
          showToast(existing ? 'Producto actualizado' : 'Producto agregado', 'success');
          if (AppState.route === 'catalog' || AppState.route === 'listEditor') navigate(AppState.route, AppState.routeParams);
          else navigate('home');
        } catch (err) {
          console.error('Error guardando producto:', err);
          showToast('No se pudo guardar: ' + (err && err.message ? err.message : 'error desconocido'), 'error');
          saveBtn.textContent = existing ? 'Guardar cambios' : 'Crear producto';
          saveBtn.style.opacity = '';
          saveBtn.style.pointerEvents = '';
        }
      });

      if (existing) {
        overlay.querySelector('#pf_delete').addEventListener('click', async () => {
          await Repo.deleteProduct(existing.id);
          await refreshCoreData();
          closeModal();
          showToast('Producto eliminado', 'info');
          navigate(AppState.route, AppState.routeParams);
        });
      }
    },
  });
}

/* ---------- Auth ---------- */
const AuthState = { mode: 'login', loading: false };

function renderAuthScreen() {
  const el = document.getElementById('authScreen');
  el.innerHTML = `
    <div class="auth-screen">
      <div class="auth-logo">🛒</div>
      <div class="auth-title">Smart Grocery Manager</div>
      <div class="auth-sub">Tus listas y tu catálogo, en todos tus dispositivos</div>

      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab ${AuthState.mode === 'login' ? 'active' : ''}" data-mode="login">Iniciar sesión</button>
          <button class="auth-tab ${AuthState.mode === 'register' ? 'active' : ''}" data-mode="register">Crear cuenta</button>
        </div>

        <div class="auth-error" id="authError"></div>

        <form id="authForm">
          <div class="field">
            <div class="field-label">Correo electrónico</div>
            <input type="email" class="input" id="authEmail" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
          </div>
          <div class="field">
            <div class="field-label">Contraseña</div>
            <input type="password" class="input" id="authPassword" placeholder="Mínimo 6 caracteres" autocomplete="${AuthState.mode === 'login' ? 'current-password' : 'new-password'}" minlength="6" required>
          </div>
          ${AuthState.mode === 'login' ? `<div class="auth-forgot"><button type="button" id="authForgotBtn">¿Olvidaste tu contraseña?</button></div>` : ''}
          <button type="submit" class="btn btn-primary btn-block" id="authSubmitBtn">
            ${AuthState.mode === 'login' ? 'Iniciar sesión' : 'Crear cuenta'}
          </button>
        </form>

        <div class="auth-switch">
          ${AuthState.mode === 'login'
            ? '¿No tienes cuenta? <button id="authSwitchBtn">Crear una</button>'
            : '¿Ya tienes cuenta? <button id="authSwitchBtn">Inicia sesión</button>'}
        </div>
      </div>
    </div>
  `;

  el.querySelectorAll('[data-mode]').forEach(tab => tab.addEventListener('click', () => {
    AuthState.mode = tab.dataset.mode;
    renderAuthScreen();
  }));
  const switchBtn = el.querySelector('#authSwitchBtn');
  if (switchBtn) switchBtn.addEventListener('click', () => {
    AuthState.mode = AuthState.mode === 'login' ? 'register' : 'login';
    renderAuthScreen();
  });
  const forgotBtn = el.querySelector('#authForgotBtn');
  if (forgotBtn) forgotBtn.addEventListener('click', async () => {
    const email = el.querySelector('#authEmail').value.trim();
    if (!email) { showAuthError('Escribe tu correo primero para poder enviarte el enlace.'); return; }
    try {
      await window.Firebase.resetPassword(email);
      showAuthError('Te enviamos un correo para restablecer tu contraseña.', true);
    } catch (err) {
      showAuthError(authErrorMessage(err));
    }
  });

  function showAuthError(msg, isInfo) {
    const box = el.querySelector('#authError');
    box.textContent = msg;
    box.classList.add('show');
    box.style.background = isInfo ? 'var(--accent-glow)' : '';
    box.style.color = isInfo ? 'var(--accent)' : '';
  }

  el.querySelector('#authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (AuthState.loading) return;
    const email = el.querySelector('#authEmail').value.trim();
    const password = el.querySelector('#authPassword').value;
    const submitBtn = el.querySelector('#authSubmitBtn');
    const errorBox = el.querySelector('#authError');
    errorBox.classList.remove('show');
    AuthState.loading = true;
    submitBtn.style.opacity = '0.6';
    submitBtn.style.pointerEvents = 'none';
    try {
      if (!window.Firebase) throw new Error('offline');
      if (AuthState.mode === 'login') {
        await window.Firebase.signIn(email, password);
      } else {
        await window.Firebase.createUser(email, password);
      }
      // onAuthStateChanged se encarga de continuar el arranque de la app
    } catch (err) {
      showAuthError(authErrorMessage(err));
      AuthState.loading = false;
      submitBtn.style.opacity = '';
      submitBtn.style.pointerEvents = '';
    }
  });
}

function authErrorMessage(err) {
  const code = err && err.code;
  if (err && err.message === 'offline') return 'No se pudo conectar. Verifica tu internet e intenta de nuevo.';
  const map = {
    'auth/invalid-email': 'Ese correo no parece válido.',
    'auth/user-not-found': 'No existe una cuenta con ese correo.',
    'auth/wrong-password': 'Contraseña incorrecta.',
    'auth/invalid-credential': 'Correo o contraseña incorrectos.',
    'auth/email-already-in-use': 'Ya existe una cuenta con ese correo.',
    'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
    'auth/too-many-requests': 'Demasiados intentos. Espera un momento e intenta de nuevo.',
    'auth/network-request-failed': 'Sin conexión a internet.',
  };
  return map[code] || 'Ocurrió un problema. Intenta de nuevo.';
}

function showApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').style.display = '';
}
function showAuth() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('authScreen').style.display = '';
  renderAuthScreen();
}

async function boot() {
  await localDB.open();
  await seedIfEmpty();

  document.getElementById('btnQuickAdd').addEventListener('click', () => openProductEditor());

  // Espera a que el módulo de Firebase (script type=module) esté listo, con un límite por si el navegador lo bloquea
  if (!window.Firebase) {
    await new Promise(resolve => {
      const t = setTimeout(resolve, 4000);
      window.addEventListener('firebase-ready', () => { clearTimeout(t); resolve(); }, { once: true });
    });
  }

  if (!window.Firebase) {
    // Sin Firebase disponible (bloqueado, sin red la primera vez): dejamos usar la app en modo local
    await startAppSession();
    return;
  }

  window.Firebase.onAuthChange(async (user) => {
    if (user) {
      syncEngine.adapter.setUser(user.uid);
      await startAppSession(user);
      syncEngine.startWatching(() => refreshCoreDataAndRerender());
      await syncEngine.attemptSync();
    } else {
      if (syncEngine.adapter.stopAll) syncEngine.adapter.stopAll();
      showAuth();
    }
  });
}

async function startAppSession(user) {
  await refreshCoreData();

  document.getElementById('hdrDate').textContent = new Date().toLocaleDateString('es-DO', { weekday: 'long', day: 'numeric', month: 'short' });
  const settings = await Repo.getSettings();
  document.getElementById('hdrStore').textContent = (settings && settings.appName) || 'Smart Grocery Manager';

  showApp();
  renderBottomNav();
  await navigate('home');
}

async function refreshCoreDataAndRerender() {
  await refreshCoreData();
  if (AppState.route) navigate(AppState.route, AppState.routeParams, true);
}

boot();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

</script>
