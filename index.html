      (byCategory[catName] ||= []).push(item);
    });
    wrap.innerHTML = Object.entries(byCategory).map(([cat, catItems]) => {
      const catMeta = AppState.data.categories.find(c => c.name === cat);
      return `
        <div class="cat-divider2">${(catMeta&&catMeta.icon)||'📦'} ${escapeHTML(cat)}</div>
        <div style="${gridWrapStyle}">${catItems.map(itemCard).join('')}</div>`;
    }).join('');
  } else {
    wrap.innerHTML = `
      ${pct === 100 ? '' : `
      <div class="section-pill2"><span class="section-pill2-label">Pendientes</span><span class="section-pill2-count">${pendingItems.length}</span></div>
      <div style="${gridWrapStyle}">${pendingItems.length
        ? pendingItems.map(itemCard).join('')
        : `<div class="gcard" style="grid-column:1/-1;"><div class="empty-state" style="padding:24px;"><div class="empty-icon" style="font-size:26px;">🎉</div><div class="empty-title" style="font-size:13px;">¡Todo listo por aquí!</div></div></div>`}</div>
      `}
      ${otherItems.length > 0 ? `
        <div class="section-pill2"><span class="section-pill2-label">No disponibles</span><span class="section-pill2-count">${otherItems.length}</span></div>
        <div style="${gridWrapStyle}">${otherItems.map(itemCard).join('')}</div>
      ` : ''}
      ${boughtItems.length > 0 ? `
        <div class="section-pill2"><span class="section-pill2-label">Completados</span><span class="section-pill2-count">${boughtItems.length}</span></div>
        <div style="${gridWrapStyle}">${boughtItems.map(itemCard).join('')}</div>
      ` : ''}
    `;
  }

  el.querySelectorAll('[data-toggle-bought]').forEach(b => b.addEventListener('click', async (e) => {
    e.stopPropagation();
    const item = items.find(i => i.id === b.dataset.toggleBought);
    if (item.status === 'bought') {
      await Repo.saveListItem({ ...item, status: 'pending' });
    } else {
      const hasRealPrice = item.realPrice != null && Number(item.realPrice) > 0;
      const hasEstimatedPrice = item.estimatedPrice != null && Number(item.estimatedPrice) > 0;
      let priceToUse;
      if (hasRealPrice) priceToUse = Number(item.realPrice);
      else if (hasEstimatedPrice) priceToUse = Number(item.estimatedPrice);
      else priceToUse = await getBestPriceForProduct(item.productId, list.storeId);
      const updated = { ...item, status: 'bought', realPrice: priceToUse };
      if (!hasEstimatedPrice && priceToUse > 0) updated.estimatedPrice = priceToUse;
      await Repo.saveListItem(updated);
    }
    renderShoppingScreen(el, list);
  }));

  el.querySelectorAll('[data-open-price]').forEach(b => b.addEventListener('click', () => {
    const item = items.find(i => i.id === b.dataset.openPrice);
    openRealPriceEditor(item, list, productsById[item.productId], () => renderShoppingScreen(el, list));
  }));

  el.querySelectorAll('[data-item-status-menu]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const item = items.find(i => i.id === b.dataset.itemStatusMenu);
    openShoppingItemMenu(b, item, list, () => renderShoppingScreen(el, list));
  }));
}

function openRealPriceEditor(item, list, product, onDone) {
  const estimated = Number(item.estimatedPrice || 0);
  openModal({
    title: `${(product&&product.icon)||'🛒'} ${(product&&product.name)||'Producto'}`,
    bodyHTML: `
      <div class="field">
        <div class="field-label">Precio estimado</div>
        <input type="text" class="input" value="${formatMoney(estimated, list.currency)}" disabled style="opacity:0.6;">
      </div>
      <div class="field" style="margin-bottom:8px;">
        <div class="field-label">Precio real</div>
        <input type="number" step="0.01" class="input" id="rp_price" value="${item.realPrice ?? estimated}" autofocus>
      </div>
      <div id="rp_diff" style="font-size:12.5px; font-weight:700;"></div>
      <div class="field" style="margin-top:14px; margin-bottom:0;">
        <div class="field-label">Nota (opcional)</div>
        <input type="text" class="input" id="rp_notes" placeholder="Ej. Comprar próxima vez" value="${escapeHTML(item.notes||'')}">
      </div>
    `,
    footerHTML: `<button class="btn btn-secondary" data-close-modal style="flex:1;">Cancelar</button><button class="btn btn-primary" id="rp_save" style="flex:1;">Confirmar y marcar comprado</button>`,
    onMount: (overlay) => {
      overlay.querySelector('[data-close-modal]').addEventListener('click', closeModal);
      const priceInput = overlay.querySelector('#rp_price');
      const diffEl = overlay.querySelector('#rp_diff');
      function updateDiff() {
        const real = Number(priceInput.value || 0);
        const diff = real - estimated;
        if (diff === 0) { diffEl.textContent = ''; return; }
        diffEl.innerHTML = diff > 0
          ? `<span style="color:var(--red);">Variación: +${formatMoney(diff, list.currency)}</span>`
          : `<span style="color:var(--accent);">Ahorro: ${formatMoney(Math.abs(diff), list.currency)}</span>`;
      }
      priceInput.addEventListener('input', updateDiff);
      updateDiff();
      overlay.querySelector('#rp_save').addEventListener('click', async () => {
        const realPriceValue = Number(priceInput.value) || 0;
        await Repo.saveListItem({
          ...item,
          realPrice: realPriceValue,
          notes: overlay.querySelector('#rp_notes').value.trim() || null,
          status: 'bought',
        });
        if (realPriceValue > 0 && list.storeId) {
          await Repo.addPrice({
            productId: item.productId, storeId: list.storeId,
            currency: list.currency, amount: realPriceValue, date: nowISO(),
          });
        }
        closeModal();
        onDone();
      });
    },
  });
}

function openShoppingItemMenu(anchorBtn, item, list, onDone) {
  document.querySelectorAll('.ctx-menu').forEach(m => m.remove());
  const rect = anchorBtn.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.style.top = `${rect.bottom + window.scrollY + 4}px`;
  menu.style.left = `${Math.min(rect.left + window.scrollX - 150, window.innerWidth - 210)}px`;
  menu.innerHTML = `
    <button class="ctx-menu-item" data-ms="pending">↺ Marcar pendiente</button>
    <button class="ctx-menu-item" data-ms="unavailable">✕ No disponible</button>
    <button class="ctx-menu-item" data-ms="skipped">– Omitir</button>
    <div class="ctx-menu-divider"></div>
    <button class="ctx-menu-item" data-ms="note">✎ Agregar nota</button>
  `;
  document.body.appendChild(menu);
  const closeMenu = (e) => { if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', closeMenu); } };
  setTimeout(() => document.addEventListener('click', closeMenu), 0);

  menu.querySelectorAll('[data-ms]').forEach(b => b.addEventListener('click', async () => {
    const action = b.dataset.ms;
    menu.remove();
    if (action === 'note') {
      openModal({
        title: 'Nota', bodyHTML: `<textarea class="textarea" id="note_txt">${escapeHTML(item.notes||'')}</textarea>`,
        footerHTML: `<button class="btn btn-secondary" data-close-modal style="flex:1;">Cancelar</button><button class="btn btn-primary" id="note_save" style="flex:1;">Guardar</button>`,
        onMount: (overlay) => {
          overlay.querySelector('[data-close-modal]').addEventListener('click', closeModal);
          overlay.querySelector('#note_save').addEventListener('click', async () => {
            await Repo.saveListItem({ ...item, notes: overlay.querySelector('#note_txt').value.trim() || null });
            closeModal();
            onDone();
          });
        },
      });
      return;
    }
    await Repo.saveListItem({ ...item, status: action });
    onDone();
  }));
}

function openFinishPurchaseFlow(list) {
  openModal({
    title: '🎉 Finalizar compra',
    bodyHTML: `<div style="font-size:13px; color:var(--text-dim); line-height:1.5;">Esto guardará la compra en tu historial y registrará los precios reales para futuras estadísticas. Los productos pendientes que no marcaste quedarán sin comprar.</div>`,
    footerHTML: `<button class="btn btn-secondary" data-close-modal style="flex:1;">Cancelar</button><button class="btn btn-primary" id="fp_confirm" style="flex:1;">Finalizar compra</button>`,
    onMount: (overlay) => {
      overlay.querySelector('[data-close-modal]').addEventListener('click', closeModal);
      overlay.querySelector('#fp_confirm').addEventListener('click', async () => {
        closeModal();
        await finalizePurchase(list);
      });
    },
  });
}

async function finalizePurchase(list) {
  const items = await Repo.listItemsForList(list.id);
  const boughtItems = items.filter(i => i.status === 'bought');
  const unavailableItems = items.filter(i => i.status === 'unavailable');
  const skippedItems = items.filter(i => i.status === 'skipped' || !i.status || i.status === 'pending');

  const estimatedTotal = items.reduce((sum, i) => sum + Number(i.estimatedPrice||0) * Number(i.quantity||1), 0);
  const realTotal = boughtItems.reduce((sum, i) => sum + Number(i.realPrice ?? i.estimatedPrice ?? 0) * Number(i.quantity||1), 0);

  const purchase = await Repo.savePurchase({
    listId: list.id, storeId: list.storeId, date: nowISO(), currency: list.currency,
    estimatedTotal, realTotal, savings: estimatedTotal - realTotal,
    status: 'completed',
    boughtCount: boughtItems.length, unavailableCount: unavailableItems.length,
    skippedCount: skippedItems.length, totalCount: items.length,
  });

  const productsById = {};
  await Promise.all([...new Set(items.map(i => i.productId))].map(async id => { productsById[id] = await Repo.getProduct(id); }));

  for (const item of boughtItems) {
    const p = productsById[item.productId];
    await Repo.savePurchaseItem({
      purchaseId: purchase.id, productId: item.productId,
      productName: (p&&p.name) || 'Producto', productIcon: (p&&p.icon) || '🛒',
      category: (p&&p.category) || 'Otros',
      quantity: item.quantity, unit: item.unit,
      estimatedPrice: item.estimatedPrice, realPrice: item.realPrice ?? item.estimatedPrice ?? 0,
      date: purchase.date,
    });
    if (item.realPrice != null && list.storeId) {
      await Repo.addPrice({ productId: item.productId, storeId: list.storeId, currency: list.currency, amount: item.realPrice, date: purchase.date });
    }
  }

  await Repo.saveList({ ...list, status: 'completed' });
  const allItems = await Repo.listItemsForList(list.id);
  await Promise.all(allItems.map(i => Repo.deleteListItem(i.id)));

  await refreshCoreData();
  navigate('invoice', { purchaseId: purchase.id });
}

async function repeatPurchase(purchase) {
  const purchaseItems = await Repo.listPurchaseItemsFor(purchase.id);
  const sourceList = purchase.listId ? await Repo.getList(purchase.listId) : null;
  const newList = await Repo.saveList({
    name: sourceList ? `${sourceList.name} (repetida)` : 'Compra repetida',
    icon: (sourceList && sourceList.icon) || '🛒',
    storeId: purchase.storeId, currency: purchase.currency,
    budget: (sourceList && sourceList.budget) || null,
    plannedDate: new Date().toISOString().slice(0,10),
    status: 'active',
  });
  await Promise.all(purchaseItems.map(pi => Repo.saveListItem({
    listId: newList.id, productId: pi.productId, quantity: pi.quantity, unit: pi.unit,
    estimatedPrice: pi.realPrice ?? pi.estimatedPrice ?? 0, realPrice: null,
    status: 'pending', priority: 'normal', notes: null,
  })));
  await refreshCoreData();
  showToast('Lista creada a partir de esa compra', 'success');
  navigate('listEditor', { listId: newList.id });
}

  if (navBtn) navBtn.addEventListener('click', (e) => navigate(e.currentTarget.dataset.nav));
  const repeatBtn = el.querySelector('[data-action="repeat-last"]');
  if (repeatBtn) repeatBtn.addEventListener('click', async () => {
    const purchases = await Repo.listPurchases();
    if (purchases.length === 0) { showToast('Aún no tienes compras completadas para repetir', 'error'); return; }
    const last = [...purchases].sort((a, b) => new Date(b.date) - new Date(a.date))[0];
    await repeatPurchase(last);
  });

  const activeSlot = el.querySelector('#shopActiveListsSlot');

  if (activeLists.length === 0) {
    activeSlot.innerHTML = `
      <div class="gcard" style="margin-top:16px;">
        <div class="empty-state">
          <div class="empty-icon">🛒</div>
          <div class="empty-title">No tienes compras activas</div>
          <div class="empty-sub">Comienza creando una lista.</div>
          <button class="btn btn-primary" id="shopEmptyNewList">＋ Nueva lista</button>
        </div>
      </div>`;
    activeSlot.querySelector('#shopEmptyNewList').addEventListener('click', openNewListModal);
  } else if (ShopPageState.selectMode) {
    renderSelectableLists();
  } else {
    await renderNormalLists();
  }

  function renderSelectableLists() {
    activeSlot.innerHTML = `
      <div class="field-hint" style="margin-top:18px; margin-bottom:10px;">Toca para seleccionar una o varias listas.</div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${activeLists.map(l => {
          const isSelected = ShopPageState.selectedIds.has(l.id);
          return `
            <div class="cat-list-item selectable ${isSelected ? 'selected' : ''}" data-select-list="${l.id}">
              <div class="cat-select-check ${isSelected ? 'checked' : ''}">${isSelected ? '✓' : ''}</div>
              <div class="item-icon-tile" style="margin-left:10px;">${l.icon || '🛒'}</div>
              <div class="cat-list-body">
                <div class="cat-list-text">
                  <div class="item-name">${escapeHTML(l.name)}</div>
                  <div class="item-meta">${escapeHTML(l.name)}</div>
                </div>
              </div>
            </div>`;
        }).join('')}
      </div>
    `;
    activeSlot.querySelectorAll('[data-select-list]').forEach(row => {
      row.addEventListener('click', () => {
        const id = row.dataset.selectList;
        if (ShopPageState.selectedIds.has(id)) ShopPageState.selectedIds.delete(id);
        else ShopPageState.selectedIds.add(id);
        renderSelectableLists();
        renderBulkBar();
      });
    });
  }

  async function renderNormalLists() {
    const [featured, ...rest] = activeLists;
    const items = await Repo.listItemsForList(featured.id);
    const done = items.filter(i => i.status === 'bought').length;
    const pct = items.length ? Math.round((done / items.length) * 100) : 0;
    const total = items.reduce((sum, i) => sum + Number(i.estimatedPrice || 0) * Number(i.quantity || 1), 0);
    const store = AppState.data.stores.find(s => s.id === featured.storeId);
    const overBudget = featured.budget && total > featured.budget;
    const ringR = 19;
    const ringCirc = 2 * Math.PI * ringR;
    const ringOffset = ringCirc * (1 - pct / 100);

    activeSlot.innerHTML = `
      <div class="section-head" style="margin-top: 18px;"><div class="section-title">🛒 Compra activa</div></div>
      <div class="shop-active-hero" data-longpress-list="${featured.id}">
        <div class="shop-active-top">
          <div>
            <div class="shop-active-name">${featured.icon || '🛒'} ${escapeHTML(featured.name)}</div>
            <button class="shop-active-store-btn" data-change-store-featured="${featured.id}">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0119 9.5C19 14.8 12 21 12 21z" fill="#fff"/></svg>
              ${store ? escapeHTML(store.name) : 'Sin supermercado asignado'}
            </button>
          </div>
          <div class="shop-active-ring-wrap">
            <svg width="48" height="48" viewBox="0 0 48 48">
              <circle cx="24" cy="24" r="${ringR}" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="5"/>
              <circle cx="24" cy="24" r="${ringR}" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="${ringCirc.toFixed(1)}" stroke-dashoffset="${ringOffset.toFixed(1)}" transform="rotate(-90 24 24)"/>
            </svg>
            <div class="shop-active-ring-label">${pct}%</div>
          </div>
        </div>
        <div class="shop-active-divider"></div>
        <div class="shop-active-stats">
          <span class="shop-active-meta">${done} / ${items.length} productos · ${formatMoney(total, featured.currency)}</span>
          <div class="flex items-center gap-2">
            <button class="shop-edit-fab" data-edit-featured="${featured.id}" aria-label="Editar lista">✎</button>
            <button class="shop-active-cta" data-goto-list="${featured.id}">Continuar
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        ${overBudget ? `<div class="shop-hero-budget-warn" style="margin-top:10px;">🔴 Presupuesto superado</div>` : ''}
      </div>

      ${rest.length > 0 ? `
        <div class="section-head">
          <div class="section-title">📋 Otras listas activas</div>
        </div>
        <div class="field-hint" style="margin-top:-6px; margin-bottom:10px;">Toca una para ponerla como tu compra activa principal</div>
        <div style="display:flex; flex-direction:column; gap:10px;" id="shopOtherLists"></div>
      ` : ''}
    `;
    activeSlot.querySelector('[data-goto-list]').addEventListener('click', (e) => {
      e.stopPropagation();
      navigate('shopping', { listId: featured.id });
    });
    activeSlot.querySelector('[data-edit-featured]').addEventListener('click', (e) => {
      e.stopPropagation();
      navigate('listEditor', { listId: featured.id });
    });
    activeSlot.querySelector('[data-change-store-featured]').addEventListener('click', (e) => {
      e.stopPropagation();
      openStoreSwitcherModal(featured, () => navigate('shop'));
    });

    if (rest.length > 0) {
      const otherListsEl = activeSlot.querySelector('#shopOtherLists');
      const rows = await Promise.all(rest.map(async l => {
        const itemsFor = await Repo.listItemsForList(l.id);
        const doneFor = itemsFor.filter(i => i.status === 'bought').length;
        const pctFor = itemsFor.length ? Math.round((doneFor / itemsFor.length) * 100) : 0;
        const s = AppState.data.stores.find(x => x.id === l.storeId);
        return `
          <button class="shop-other-card" data-promote-list="${l.id}" data-longpress-list="${l.id}">
            <div class="shop-other-icon">${l.icon || '🛒'}</div>
            <div class="shop-other-info">
              <div class="shop-other-name">${escapeHTML(l.name)}</div>
              <div class="shop-other-meta">${doneFor} de ${itemsFor.length} producto${itemsFor.length===1?'':'s'}${s ? ' · ' + escapeHTML(s.name) : ' · Sin asignar'}</div>
              <div class="shop-other-bar"><div class="shop-other-bar-fill" style="width:${pctFor}%;"></div></div>
            </div>
            <div class="shop-other-pct">${pctFor}%</div>
          </button>`;
      }));
      otherListsEl.innerHTML = rows.join('');
      otherListsEl.querySelectorAll('[data-promote-list]').forEach(b => b.addEventListener('click', async (e) => {
        if (e.currentTarget.dataset.longpressFired) { delete e.currentTarget.dataset.longpressFired; return; }
        const listId = b.dataset.promoteList;
        const listToPromote = activeLists.find(l => l.id === listId);
        await Repo.saveList({ ...listToPromote });
        await refreshCoreData();
        navigate('shop');
      }));
    }

    let pressTimer = null;
    el.querySelectorAll('[data-longpress-list]').forEach(node => {
      const listId = node.dataset.longpressList;
      const list = activeLists.find(l => l.id === listId);
      const start = () => {
        pressTimer = setTimeout(() => {
          node.dataset.longpressFired = '1';
          if (navigator.vibrate) navigator.vibrate(12);
          openShopListContextMenu(node, list, () => navigate('shop'));
        }, 480);
      };
      const cancel = () => clearTimeout(pressTimer);
      node.addEventListener('touchstart', start, { passive: true });
      node.addEventListener('touchend', cancel);
      node.addEventListener('touchmove', cancel);
      node.addEventListener('mousedown', start);
      node.addEventListener('mouseup', cancel);
      node.addEventListener('mouseleave', cancel);
    });
  }

  function renderBulkBar() {
    const slot = el.querySelector('#shopBulkBarSlot');
    const n = ShopPageState.selectedIds.size;
    if (!ShopPageState.selectMode || n === 0) { slot.innerHTML = ''; return; }
    slot.innerHTML = `
      <div class="cat-bulk-bar">
        <span class="cat-bulk-count">${n} seleccionada${n===1?'':'s'}</span>
        <button class="btn btn-primary btn-sm" id="shopBulkDelete" style="background:var(--red); box-shadow:none;">🗑 Eliminar</button>
      </div>`;
    slot.querySelector('#shopBulkDelete').addEventListener('click', () => {
      const ids = [...ShopPageState.selectedIds];
      openModal({
        title: 'Eliminar listas',
        bodyHTML: `<div style="font-size:13px; color:var(--text-dim); line-height:1.5;">¿Eliminar ${ids.length} lista${ids.length===1?'':'s'} seleccionada${ids.length===1?'':'s'}? Los productos dentro también se eliminarán. Esta acción no se puede deshacer.</div>`,
        footerHTML: `<button class="btn btn-secondary" data-close-modal style="flex:1;">Cancelar</button><button class="btn btn-primary" id="bulkDelListsConfirm" style="flex:1; background:var(--red); box-shadow:none;">Eliminar</button>`,
        onMount: (overlay) => {
          overlay.querySelector('[data-close-modal]').addEventListener('click', closeModal);
          overlay.querySelector('#bulkDelListsConfirm').addEventListener('click', async () => {
            try {
              for (const id of ids) {
                const itemsToDelete = await Repo.listItemsForList(id);
                await Promise.all(itemsToDelete.map(i => Repo.deleteListItem(i.id)));
                await Repo.deleteList(id);
              }
              await refreshCoreData();
              closeModal();
              showToast('Listas eliminadas', 'info');
              ShopPageState.selectedIds.clear();
              ShopPageState.selectMode = false;
              navigate('shop');
            } catch (err) {
              console.error('Error eliminando listas:', err);
              showToast('No se pudo eliminar: ' + (err && err.message ? err.message : 'error desconocido'), 'error');
            }
          });
        },
      });
    });
  }

  // A partir de aquí, todo el contenido es secundario (sugerencias, productos que sueles
  // comprar, historial reciente): lo llenamos en segundo plano SIN bloquear el renderer
  // principal, para que el usuario vea el header y sus listas activas de inmediato en vez
  // de quedarse con la pantalla en blanco mientras se resuelven varias consultas seguidas.
  fillShopSecondarySections();

  async function fillShopSecondarySections() {
    const suggestions = await suggestionsPromise;
    const suggSlot = el.querySelector('#shopSuggestionsSlot');
    if (suggSlot && suggestions.length > 0) {
      const rows = await Promise.all(suggestions.slice(0, 4).map(async s => {
        const p = await Repo.getProduct(s.productId);
        if (!p) return '';
        return `
          <div class="suggestion-row">
            ${productIconHTML(p)}
            <div style="flex:1;">
              <div class="suggestion-name">${escapeHTML(p.name)}</div>
              <div class="suggestion-meta">Han pasado ${s.since} días · sueles comprarlo cada ${s.avgDays} días</div>
            </div>
          </div>`;
      }));
      suggSlot.innerHTML = `
        <div class="section-head"><div class="section-title">💡 Quizás necesitas</div></div>
        <div class="gcard" style="padding:6px 4px;">${rows.join('')}</div>
      `;
    }

    if (!ShopPageState.selectMode) {
      const missingSlot = el.querySelector('#shopMissingFrequentSlot');
      if (missingSlot && activeLists.length > 0) {
        const featured = activeLists[0];
        const currentItems = await Repo.listItemsForList(featured.id);
        const currentProductIds = new Set(currentItems.map(i => i.productId));
        const frequent = await getFrequentProducts(10);
        const missing = [];
        for (const f of frequent) {
          if (currentProductIds.has(f.productId)) continue;
          const p = await Repo.getProduct(f.productId);
          if (p) missing.push({ ...f, product: p });
          if (missing.length >= 3) break;
        }
        if (missing.length > 0) {
          missingSlot.innerHTML = `
            <div class="section-head"><div class="section-title">🔄 Sueles comprar, pero falta en tu lista</div></div>
            <div class="gcard" style="padding:6px 4px;">
              ${missing.map(m => `
                <div class="suggestion-row">
                  ${productIconHTML(m.product)}
                  <div style="flex:1;">
                    <div class="suggestion-name">${escapeHTML(m.product.name)}</div>
                    <div class="suggestion-meta">Comprada en ${m.count} de tus últimas compras</div>
                  </div>
                  <button class="add-fab" data-add-missing="${m.productId}">＋</button>
                </div>`).join('')}
            </div>
          `;
          missingSlot.querySelectorAll('[data-add-missing]').forEach(b => b.addEventListener('click', async () => {
            await quickAddProductToList(featured, currentItems, b.dataset.addMissing);
            navigate('shop');
          }));
        }
      }

      const recentSlot = el.querySelector('#shopRecentPurchasesSlot');
      if (recentSlot) {
        const allPurchases = await Repo.listPurchases();
        const recent = [...allPurchases].sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 3);
        if (recent.length > 0) {
          recentSlot.innerHTML = `
            <div class="section-head">
              <div class="section-title">📜 Compras recientes</div>
              <button class="section-link" id="shopSeeAllHistory">Ver todo el historial</button>
            </div>
            <div class="gcard" style="padding:6px 14px;">
              ${recent.map(p => {
                const store = AppState.data.stores.find(s => s.id === p.storeId);
                return `
                  <div class="tprow" data-open-purchase="${p.id}" style="cursor:pointer;">
                    <div class="tp-icon">🛒</div>
                    <div style="flex:1; min-width:0;">
                      <div class="tp-name">${new Date(p.date).toLocaleDateString('es-DO', {day:'numeric', month:'short'})}${store ? ' · ' + escapeHTML(store.name) : ''}</div>
                    </div>
                    <div class="tp-amount">${formatMoney(p.realTotal, p.currency)}</div>
                  </div>`;
              }).join('')}
            </div>
          `;
          recentSlot.querySelector('#shopSeeAllHistory').addEventListener('click', () => navigate('history'));
          recentSlot.querySelectorAll('[data-open-purchase]').forEach(row => row.addEventListener('click', () => navigate('invoice', { purchaseId: row.dataset.openPurchase })));
        }
      }
    }
  }
};

function openShopListContextMenu(anchorNode, list, onDone) {
  document.querySelectorAll('.ctx-menu').forEach(m => m.remove());
  const rect = anchorNode.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.style.top = `${rect.top + window.scrollY + 30}px`;
  menu.style.left = `${Math.min(rect.left + window.scrollX + 20, window.innerWidth - 210)}px`;
  menu.innerHTML = `
    <button class="ctx-menu-item" data-slm="open">🛒 Continuar compra</button>
    <button class="ctx-menu-item" data-slm="edit">✎ Editar lista</button>
    <div class="ctx-menu-divider"></div>
    <button class="ctx-menu-item danger" data-slm="delete">🗑 Eliminar lista</button>
  `;
  document.body.appendChild(menu);
  const closeMenu = (e) => { if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', closeMenu); } };
  setTimeout(() => document.addEventListener('click', closeMenu), 0);

  menu.querySelector('[data-slm="open"]').addEventListener('click', () => { menu.remove(); navigate('shopping', { listId: list.id }); });
  menu.querySelector('[data-slm="edit"]').addEventListener('click', () => { menu.remove(); navigate('listEditor', { listId: list.id }); });
  menu.querySelector('[data-slm="delete"]').addEventListener('click', async () => {
    menu.remove();
    openModal({
      title: 'Eliminar lista',
      bodyHTML: `<div style="font-size:13px; color:var(--text-dim); line-height:1.5;">¿Eliminar "${escapeHTML(list.name)}"? Los productos dentro también se eliminarán. Esta acción no se puede deshacer.</div>`,
      footerHTML: `<button class="btn btn-secondary" data-close-modal style="flex:1;">Cancelar</button><button class="btn btn-primary" id="delListConfirm" style="flex:1; background:var(--red); box-shadow:none;">Eliminar</button>`,
      onMount: (overlay) => {
        overlay.querySelector('[data-close-modal]').addEventListener('click', closeModal);
        overlay.querySelector('#delListConfirm').addEventListener('click', async () => {
          try {
            const itemsToDelete = await Repo.listItemsForList(list.id);
            await Promise.all(itemsToDelete.map(i => Repo.deleteListItem(i.id)));
            await Repo.deleteList(list.id);
            await refreshCoreData();
            closeModal();
            showToast('Lista eliminada', 'info');
            onDone();
          } catch (err) {
            console.error('Error eliminando lista:', err);
            showToast('No se pudo eliminar: ' + (err && err.message ? err.message : 'error desconocido'), 'error');
          }
        });
      },
    });
  });
}

PAGE_RENDERERS['lists'] = async (el) => {
  const allLists = AppState.data.lists;
  el.innerHTML = `
    <div class="page-header">
      <div class="page-header-row">
        <div>
          <div class="page-title">Mis listas</div>
          <div class="page-sub">${allLists.length} lista${allLists.length===1?'':'s'} en total</div>
        </div>
        <button class="btn btn-primary btn-sm" id="listsNewBtn">＋ Nueva</button>
      </div>
    </div>

    ${allLists.length > 0 ? `
      <div class="flex items-center gap-2 mb-3" style="flex-wrap:wrap;">
        <div class="inline-search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#9aa39c" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="#9aa39c" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="text" placeholder="Buscar listas..." id="listsSearch" value="${escapeHTML(ListsPageState.search)}">
        </div>
      </div>
      <div class="tab-row mb-3">

        <button class="tab-btn ${ListsPageState.filter==='completed'?'active':''}" data-filter="completed">Completadas</button>
        <button class="tab-btn ${ListsPageState.filter==='template'?'active':''}" data-filter="template">Plantillas</button>
      </div>
    ` : ''}
    <div id="listsGrid"></div>
  `;
  el.querySelector('#listsNewBtn').addEventListener('click', openNewListModal);

  const grid = el.querySelector('#listsGrid');
  if (allLists.length === 0) {
    grid.innerHTML = `
      <div class="gcard" style="margin-top:20px;"><div class="empty-state">
        <div class="empty-icon">🛒</div>
        <div class="empty-title">Aún no tienes listas</div>
        <div class="empty-sub">Crea tu primera lista de compras para empezar.</div>
        <button class="btn btn-primary" id="listsEmptyBtn">＋ Nueva lista</button>
      </div></div>`;
    grid.querySelector('#listsEmptyBtn').addEventListener('click', openNewListModal);
    return;
  }

  el.querySelector('#listsSearch').addEventListener('input', (e) => { ListsPageState.search = e.target.value; render(); });
  el.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => { ListsPageState.filter = b.dataset.filter; render(); }));

  async function render() {
    let list = allLists.filter(l => {
      if (ListsPageState.filter === 'active' && l.status !== 'active') return false;
      if (ListsPageState.filter === 'completed' && l.status !== 'completed') return false;
      if (ListsPageState.filter === 'template' && l.status !== 'template') return false;
      if (ListsPageState.search && !l.name.toLowerCase().includes(ListsPageState.search.toLowerCase())) return false;
      return true;
    });

    if (list.length === 0) {
      grid.innerHTML = `<div class="gcard" style="margin-top:6px;"><div class="empty-state" style="padding:28px 16px;">
        <div class="empty-icon" style="font-size:26px;">🔎</div>
        <div class="empty-title" style="font-size:13px;">Sin resultados en este filtro</div>
      </div></div>`;
      return;
    }

    const counts = await Promise.all(list.map(l => Repo.listItemsForList(l.id)));
    grid.innerHTML = `<div class="lists-grid">${list.map((l, idx) => {
      const store = AppState.data.stores.find(s => s.id === l.storeId);
      const items = counts[idx];
      const statusLabel = l.status === 'active' ? 'Activa' : l.status === 'template' ? 'Plantilla' : l.status === 'completed' ? 'Completada' : l.status;
      return `
        <button class="list-card" data-open-list="${l.id}" data-list-status="${l.status}">
          <div class="list-card-top">
            <span class="list-card-icon">${l.icon || '🛒'}</span>
            <span class="list-card-badge">${statusLabel}</span>
          </div>
          <div class="list-card-name">${escapeHTML(l.name)}</div>
          <div class="list-card-meta">${store ? escapeHTML(store.name) : 'Sin supermercado'}${l.status!=='template' ? ' · ' + items.length + ' productos' : ''}${l.budget ? '<br>' + formatMoney(l.budget, l.currency) : ''}</div>
        </button>`;
    }).join('')}</div>`;

    grid.querySelectorAll('[data-open-list]').forEach(b => b.addEventListener('click', () => {
      if (b.dataset.listStatus === 'template') useTemplate(b.dataset.openList);
      else navigate('listEditor', { listId: b.dataset.openList });
    }));
  }

  render();
};

async function useTemplate(templateId) {
  const template = await Repo.getList(templateId);
  const templateItems = await Repo.listItemsForList(templateId);
  const newList = await Repo.saveList({
    name: template.name.replace(/ \(plantilla\)$/, ''),
    icon: template.icon,
    storeId: template.storeId,
    currency: template.currency,
    budget: template.budget,
    plannedDate: new Date().toISOString().slice(0,10),
    status: 'active',
  });
  await Promise.all(templateItems.map(i => Repo.saveListItem({ ...i, id: undefined, listId: newList.id, status: 'pending', realPrice: null })));
  await refreshCoreData();
  showToast('Lista creada desde la plantilla', 'success');
  navigate('listEditor', { listId: newList.id });
}

function ensureModalRoot() {
  let root = document.getElementById('modalRoot');
  if (!root) {
    root = document.createElement('div');
    root.id = 'modalRoot';
    document.body.appendChild(root);
  }
  return root;
}
function openModal({ title, bodyHTML, footerHTML, onMount }) {
  const root = ensureModalRoot();
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">${escapeHTML(title)}</div>
          <button class="modal-close" id="modalCloseBtn">✕</button>
        </div>
        <div class="modal-body">${bodyHTML}</div>
        ${footerHTML ? `<div class="modal-footer">${footerHTML}</div>` : ''}
      </div>
    </div>
  `;
  const overlay = root.querySelector('#modalOverlay');
  root.querySelector('#modalCloseBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  if (onMount) onMount(root);
}
function closeModal() {
  const root = document.getElementById('modalRoot');
  if (root) root.innerHTML = '';
}

let toastStack;
function ensureToastStack() {
  if (!toastStack) {
    toastStack = document.createElement('div');
    toastStack.className = 'toast-stack';
    document.body.appendChild(toastStack);
  }
  return toastStack;
}
function showToast(message, type = 'success') {
  const stack = ensureToastStack();
  const toast = document.createElement('div');
  toast.className = `toast ${type === 'error' ? 'error' : ''}`;
  toast.textContent = message;
  stack.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.2s ease'; setTimeout(() => toast.remove(), 200); }, 2200);
}

function openNewListModal() {
  openModal({
    title: 'Nueva lista',
    bodyHTML: `
      <div class="field">
        <div class="field-label">Nombre</div>
        <input class="input" id="newListName" placeholder="Compra semanal" autofocus>
      </div>
      <div class="field">
        <div class="field-label">Presupuesto (opcional)</div>
        <input class="input" id="newListBudget" type="number" placeholder="0">
      </div>
    `,
    footerHTML: `
      <button class="btn btn-secondary" id="cancelNewList" style="flex:1;">Cancelar</button>
      <button class="btn btn-primary" id="saveNewList" style="flex:1;">Crear lista</button>
    `,
    onMount: (root) => {
      root.querySelector('#cancelNewList').addEventListener('click', closeModal);
      root.querySelector('#saveNewList').addEventListener('click', async () => {
        const name = root.querySelector('#newListName').value.trim();
        if (!name) return;
        const budget = Number(root.querySelector('#newListBudget').value || 0);
        try {
          await Repo.saveList({
            name, icon: '🛒', status: 'active',
            currency: getPrimaryCurrency().code,
            budget: budget || null,
          });
          await refreshCoreData();
          closeModal();
          navigate('home');
        } catch (err) {
          console.error('Error creando lista:', err);
          showToast('No se pudo crear: ' + (err && err.message ? err.message : 'error desconocido'), 'error');
        }
      });
    },
  });
}

function openProductEditor(productId, prefillName, prefill) {
  const existing = productId ? AppState.data.products.find(p => p.id === productId) : null;
  const categories = AppState.data.categories;
  const currencies = AppState.data.currencies;
  let selectedIcon = (existing && existing.icon) || '🛒';
  let selectedImage = (existing && existing.imageUrl) || null;
  const prefillCategory = (existing && existing.category) || (prefill && prefill.category) || '';
  const prefillSubcategory = (existing && existing.subcategory) || (prefill && prefill.subcategory) || '';

  openModal({
    title: existing ? 'Editar producto' : 'Nuevo producto',
    bodyHTML: `
      <div class="flex" style="align-items:flex-start; gap:12px; margin-bottom:14px;">
        <div id="productImagePreview" class="product-image-preview">
          ${selectedImage ? `<img src="${selectedImage}" alt="">` : `<span id="iconPickerBtn" class="product-image-fallback">${selectedIcon}</span>`}
        </div>
        <div style="flex:1;">
          <div class="field" style="margin-bottom:10px;">
            <div class="field-label">Nombre</div>
            <input type="text" class="input" id="pf_name" placeholder="Ej. Bananas" value="${escapeHTML((existing&&existing.name) || prefillName || '')}">
          </div>
          <div class="flex items-center gap-2" style="flex-wrap:wrap;">
            <label class="btn btn-secondary btn-sm" style="cursor:pointer;">
              📷 Foto
              <input type="file" accept="image/*" id="pf_imageFile" class="hidden">
            </label>
            <button type="button" class="btn btn-secondary btn-sm" id="pf_imageUrlBtn">🔗 URL</button>
            <button type="button" class="mini-btn" id="pf_imageClear" style="font-size:11px; color:var(--text-dim); ${selectedImage ? '' : 'display:none;'}">Quitar</button>
          </div>
          <div id="pf_imageUrlField" class="field hidden" style="margin-top:8px; margin-bottom:0;">
            <input type="text" class="input" id="pf_imageUrlInput" placeholder="https://...">
          </div>
        </div>
      </div>
      <div id="iconPickerGrid" class="emoji-grid hidden mb-3">
        ${COMMON_EMOJIS.map(e => `<button type="button" class="emoji-cell ${e===selectedIcon?'selected':''}" data-emoji="${e}">${e}</button>`).join('')}
      </div>
      <div class="field-hint mb-3">Si no subes una foto, se usa un ícono como respaldo — tócalo para elegir otro.</div>
      ${existing ? '<div id="priceHistorySlot"></div>' : ''}

      <div class="field-row" style="display:flex; gap:10px;">
        <div class="field" style="flex:1;">
          <div class="field-label">Categoría</div>
          <select class="input" id="pf_category">
            <option value="">Sin categoría</option>
            ${categories.map(c => `<option value="${escapeHTML(c.name)}" ${prefillCategory===c.name?'selected':''}>${c.icon} ${escapeHTML(c.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="flex:1;">
          <div class="field-label">Subcategoría</div>
          <select class="input" id="pf_subcategory"></select>
        </div>
      </div>
      <div class="field-row" style="display:flex; gap:10px;">
        <div class="field" style="flex:1;">
          <div class="field-label">Marca (opcional)</div>
          <input type="text" class="input" id="pf_brand" value="${escapeHTML((existing&&existing.brand) || '')}">
        </div>
        <div class="field" style="flex:1;"></div>
      </div>

      <div class="field-row" style="display:flex; gap:10px;">
        <div class="field" style="flex:1;">
          <div class="field-label">Unidad</div>
          <select class="input" id="pf_unit">
            ${UNIT_OPTIONS.map(u => `<option value="${u.value}" ${(existing&&existing.unit)===u.value?'selected':''}>${u.label}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="flex:1;">
          <div class="field-label">Tamaño (opcional)</div>
          <input type="text" class="input" id="pf_size" placeholder="Ej. 1 litro, 12 unidades" value="${escapeHTML((existing&&existing.size) || '')}">
        </div>
      </div>

      <div class="field-row" style="display:flex; gap:10px;">
        <div class="field" style="flex:1;">
          <div class="field-label">Precio de referencia (opcional)</div>
          <input type="number" step="0.01" class="input" id="pf_price" value="${existing&&existing.referencePrice!=null ? existing.referencePrice : ''}">
        </div>
        <div class="field" style="max-width:100px;">
          <div class="field-label">Moneda</div>
          <select class="input" id="pf_currency">
            ${currencies.map(c => `<option value="${c.code}" ${((existing&&existing.referenceCurrency)||getPrimaryCurrency().code)===c.code?'selected':''}>${c.code}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field-hint mb-3">Precio de referencia general. Los precios reales por supermercado se registran al usar el producto en una compra.</div>

      <div class="field">
        <div class="field-label">Notas (opcional)</div>
        <textarea class="textarea" id="pf_notes">${escapeHTML((existing&&existing.notes) || '')}</textarea>
      </div>

      <label class="checkbox-row">
        <input type="checkbox" id="pf_favorite" ${existing&&existing.favorite ? 'checked' : ''}>
        Marcar como favorito
      </label>
    `,
    footerHTML: `
      ${existing ? '<button class="btn btn-secondary" id="pf_delete" style="color:var(--red); font-size:11px; padding:8px 10px;">Eliminar</button>' : ''}
      <button class="btn btn-primary" id="pf_save" style="flex:1;">${existing ? 'Guardar cambios' : 'Crear producto'}</button>
    `,
    onMount: (overlay) => {
      const categorySelect = overlay.querySelector('#pf_category');
      const subcatSelect = overlay.querySelector('#pf_subcategory');
      function renderSubcatOptions(catName, preselect) {
        const cat = categories.find(c => c.name === catName);
        const subs = (cat && cat.subcategories) || [];
        if (subs.length === 0) {
          subcatSelect.innerHTML = `<option value="">— No aplica —</option>`;
          subcatSelect.disabled = true;
          return;
        }
        subcatSelect.disabled = false;
        subcatSelect.innerHTML = `<option value="">Sin subcategoría</option>` + subs.map(s => `<option value="${escapeHTML(s)}" ${preselect===s?'selected':''}>${escapeHTML(s)}</option>`).join('');
      }
      renderSubcatOptions(categorySelect.value, prefillSubcategory);
      categorySelect.addEventListener('change', () => renderSubcatOptions(categorySelect.value, null));

      if (existing) {
        Repo.listPricesForProduct(existing.id).then(prices => {
          const slot = overlay.querySelector('#priceHistorySlot');
          if (!slot || prices.length === 0) return;
          const sorted = [...prices].sort((a,b) => new Date(a.date)-new Date(b.date));
          const amounts = sorted.map(p => p.amount);
          const current = amounts[amounts.length-1];
          const min = Math.min(...amounts);
          const max = Math.max(...amounts);
          const avg = amounts.reduce((a,b)=>a+b,0) / amounts.length;
          const trail = sorted.slice(-6).map(p => formatMoney(p.amount, p.currency)).join(' → ');
          const sparkline = buildSparklineSVG(amounts.slice(-12));
          slot.innerHTML = `
            <div class="price-hist-card">
              <div class="price-hist-label">Historial de precios</div>
              <div class="stat-mini-grid">
                <div><div class="stat-mini-label">Actual</div><div class="stat-mini-value accent">${formatMoney(current, sorted[sorted.length-1].currency)}</div></div>
                <div><div class="stat-mini-label">Mínimo</div><div class="stat-mini-value">${formatMoney(min, sorted[0].currency)}</div></div>
                <div><div class="stat-mini-label">Máximo</div><div class="stat-mini-value">${formatMoney(max, sorted[0].currency)}</div></div>
                <div><div class="stat-mini-label">Promedio</div><div class="stat-mini-value">${formatMoney(avg, sorted[0].currency)}</div></div>
              </div>
              ${sparkline ? `<div class="mb-1">${sparkline}</div>` : ''}
              <div style="font-size:10.5px; color:var(--text-faint); margin-top:4px;">${trail}</div>
            </div>
          `;

          const byStore = {};
          sorted.forEach(p => { if (!byStore[p.storeId] || new Date(p.date) > new Date(byStore[p.storeId].date)) byStore[p.storeId] = p; });
          const storeEntries = Object.entries(byStore);
          if (storeEntries.length > 1) {
            const best = storeEntries.reduce((a, b) => (a[1].amount <= b[1].amount ? a : b));
            const compareHTML = `
              <div class="price-hist-card">
                <div class="price-hist-label">Precio por supermercado</div>
                ${storeEntries.map(([storeId, p]) => {
                  const s = AppState.data.stores.find(x => x.id === storeId);
                  const isBest = storeId === best[0];
                  return `<div class="flex items-center justify-between" style="font-size:12px; padding:4px 0;">
                    <span style="color:${isBest?'var(--accent)':'var(--text-dim)'}; font-weight:${isBest?'700':'400'};">${isBest?'💡 ':''}${escapeHTML((s&&s.name) || 'Supermercado')}</span>
                    <span style="font-weight:${isBest?'800':'400'}; color:${isBest?'var(--accent)':'var(--text)'};">${formatMoney(p.amount, p.currency)}</span>
                  </div>`;
                }).join('')}
              </div>
            `;
            slot.insertAdjacentHTML('beforeend', compareHTML);
          }
        });
      }
      const iconGrid = overlay.querySelector('#iconPickerGrid');
      const previewEl = overlay.querySelector('#productImagePreview');
      const clearBtn = overlay.querySelector('#pf_imageClear');
      const urlField = overlay.querySelector('#pf_imageUrlField');
      const urlInput = overlay.querySelector('#pf_imageUrlInput');

      function renderPreview() {
        if (selectedImage) {
          previewEl.innerHTML = `<img src="${selectedImage}" alt="">`;
          clearBtn.style.display = '';
        } else {
          previewEl.innerHTML = `<span id="iconPickerBtn" class="product-image-fallback">${selectedIcon}</span>`;
          clearBtn.style.display = 'none';
          bindIconBtn();
        }
      }
      function bindIconBtn() {
        const btn = overlay.querySelector('#iconPickerBtn');
        if (btn) btn.addEventListener('click', () => iconGrid.classList.toggle('hidden'));
      }
      bindIconBtn();

      iconGrid.querySelectorAll('[data-emoji]').forEach(cell => {
        cell.addEventListener('click', () => {
          selectedIcon = cell.dataset.emoji;
          iconGrid.querySelectorAll('.emoji-cell').forEach(c => c.classList.remove('selected'));
          cell.classList.add('selected');
          iconGrid.classList.add('hidden');
          if (!selectedImage) renderPreview();
        });
      });

      overlay.querySelector('#pf_imageFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) { showToast('La imagen es muy grande (máx. 8MB)', 'error'); return; }
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 640;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            selectedImage = canvas.toDataURL('image/jpeg', 0.75);
            renderPreview();
          };
          img.onerror = () => { showToast('No se pudo procesar la imagen', 'error'); };
          img.src = reader.result;
        };
        reader.onerror = () => { showToast('No se pudo leer el archivo', 'error'); };
        reader.readAsDataURL(file);
      });

      overlay.querySelector('#pf_imageUrlBtn').addEventListener('click', () => {
        urlField.classList.toggle('hidden');
        if (!urlField.classList.contains('hidden')) urlInput.focus();
      });
      urlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const url = urlInput.value.trim();
          if (url) { selectedImage = url; renderPreview(); urlField.classList.add('hidden'); }
        }
      });
      urlInput.addEventListener('blur', () => {
        const url = urlInput.value.trim();
        if (url) { selectedImage = url; renderPreview(); }
      });

      clearBtn.addEventListener('click', () => { selectedImage = null; renderPreview(); });

      overlay.querySelector('#pf_save').addEventListener('click', async () => {
        const name = overlay.querySelector('#pf_name').value.trim();
        if (!name) { showToast('El nombre es obligatorio', 'error'); return; }
        const saveBtn = overlay.querySelector('#pf_save');
        saveBtn.textContent = 'Guardando...';
        saveBtn.style.opacity = '0.6';
        saveBtn.style.pointerEvents = 'none';
        const payload = {
          id: existing ? existing.id : undefined,
          name, icon: selectedIcon, imageUrl: selectedImage || null,
          category: overlay.querySelector('#pf_category').value || null,
          subcategory: overlay.querySelector('#pf_subcategory').value || null,
          brand: overlay.querySelector('#pf_brand').value.trim() || null,
          unit: overlay.querySelector('#pf_unit').value,
          size: overlay.querySelector('#pf_size').value.trim() || null,
          referencePrice: overlay.querySelector('#pf_price').value ? Number(overlay.querySelector('#pf_price').value) : null,
          referenceCurrency: overlay.querySelector('#pf_currency').value,
          notes: overlay.querySelector('#pf_notes').value.trim() || null,
          favorite: overlay.querySelector('#pf_favorite').checked,
        };
        try {
          await Repo.saveProduct(payload);
          await refreshCoreData();
          closeModal();
          showToast(existing ? 'Producto actualizado' : 'Producto agregado', 'success');
          if (AppState.route === 'catalog' || AppState.route === 'listEditor') navigate(AppState.route, AppState.routeParams);
          else navigate('home');
        } catch (err) {
          console.error('Error guardando producto:', err);
          showToast('No se pudo guardar: ' + (err && err.message ? err.message : 'error desconocido'), 'error');
          saveBtn.textContent = existing ? 'Guardar cambios' : 'Crear producto';
          saveBtn.style.opacity = '';
          saveBtn.style.pointerEvents = '';
        }
      });

      if (existing) {
        overlay.querySelector('#pf_delete').addEventListener('click', async () => {
          await Repo.deleteProduct(existing.id);
          await refreshCoreData();
          closeModal();
          showToast('Producto eliminado', 'info');
          navigate(AppState.route, AppState.routeParams);
        });
      }
    },
  });
}

function renderAuthScreen() {
  const el = document.getElementById('authScreen');
  el.innerHTML = `
    <div class="auth-screen">
      <div class="auth-logo">🛒</div>
      <div class="auth-title">Smart Grocery Manager</div>
      <div class="auth-sub">Tus listas y tu catálogo, en todos tus dispositivos</div>

      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab ${AuthState.mode === 'login' ? 'active' : ''}" data-mode="login">Iniciar sesión</button>
          <button class="auth-tab ${AuthState.mode === 'register' ? 'active' : ''}" data-mode="register">Crear cuenta</button>
        </div>

        <div class="auth-error" id="authError"></div>

        <form id="authForm">
          <div class="field">
            <div class="field-label">Correo electrónico</div>
            <input type="email" class="input" id="authEmail" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
          </div>
          <div class="field">
            <div class="field-label">Contraseña</div>
            <input type="password" class="input" id="authPassword" placeholder="Mínimo 6 caracteres" autocomplete="${AuthState.mode === 'login' ? 'current-password' : 'new-password'}" minlength="6" required>
          </div>
          ${AuthState.mode === 'login' ? `<div class="auth-forgot"><button type="button" id="authForgotBtn">¿Olvidaste tu contraseña?</button></div>` : ''}
          <button type="submit" class="btn btn-primary btn-block" id="authSubmitBtn">
            ${AuthState.mode === 'login' ? 'Iniciar sesión' : 'Crear cuenta'}
          </button>
        </form>

        <div class="auth-switch">
          ${AuthState.mode === 'login'
            ? '¿No tienes cuenta? <button id="authSwitchBtn">Crear una</button>'
            : '¿Ya tienes cuenta? <button id="authSwitchBtn">Inicia sesión</button>'}
        </div>
      </div>
    </div>
  `;

  el.querySelectorAll('[data-mode]').forEach(tab => tab.addEventListener('click', () => {
    AuthState.mode = tab.dataset.mode;
    renderAuthScreen();
  }));
  const switchBtn = el.querySelector('#authSwitchBtn');
  if (switchBtn) switchBtn.addEventListener('click', () => {
    AuthState.mode = AuthState.mode === 'login' ? 'register' : 'login';
    renderAuthScreen();
  });
  const forgotBtn = el.querySelector('#authForgotBtn');
  if (forgotBtn) forgotBtn.addEventListener('click', async () => {
    const email = el.querySelector('#authEmail').value.trim();
    if (!email) { showAuthError('Escribe tu correo primero para poder enviarte el enlace.'); return; }
    try {
      await window.Firebase.resetPassword(email);
      showAuthError('Te enviamos un correo para restablecer tu contraseña.', true);
    } catch (err) {
      showAuthError(authErrorMessage(err));
    }
  });

  function showAuthError(msg, isInfo) {
    const box = el.querySelector('#authError');
    box.textContent = msg;
    box.classList.add('show');
    box.style.background = isInfo ? 'var(--accent-glow)' : '';
    box.style.color = isInfo ? 'var(--accent)' : '';
  }

  el.querySelector('#authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (AuthState.loading) return;
    const email = el.querySelector('#authEmail').value.trim();
    const password = el.querySelector('#authPassword').value;
    const submitBtn = el.querySelector('#authSubmitBtn');
    const errorBox = el.querySelector('#authError');
    errorBox.classList.remove('show');
    AuthState.loading = true;
    submitBtn.style.opacity = '0.6';
    submitBtn.style.pointerEvents = 'none';
    try {
      if (!window.Firebase) throw new Error('offline');
      if (AuthState.mode === 'login') {
        await window.Firebase.signIn(email, password);
      } else {
        await window.Firebase.createUser(email, password);
      }
      // onAuthStateChanged se encarga de continuar el arranque de la app
    } catch (err) {
      showAuthError(authErrorMessage(err));
      AuthState.loading = false;
      submitBtn.style.opacity = '';
      submitBtn.style.pointerEvents = '';
    }
  });
}

function authErrorMessage(err) {
  const code = err && err.code;
  if (err && err.message === 'offline') return 'No se pudo conectar. Verifica tu internet e intenta de nuevo.';
  const map = {
    'auth/invalid-email': 'Ese correo no parece válido.',
    'auth/user-not-found': 'No existe una cuenta con ese correo.',
    'auth/wrong-password': 'Contraseña incorrecta.',
    'auth/invalid-credential': 'Correo o contraseña incorrectos.',
    'auth/email-already-in-use': 'Ya existe una cuenta con ese correo.',
    'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
    'auth/too-many-requests': 'Demasiados intentos. Espera un momento e intenta de nuevo.',
    'auth/network-request-failed': 'Sin conexión a internet.',
  };
  return map[code] || 'Ocurrió un problema. Intenta de nuevo.';
}

function hideBootLoader() {
  const loader = document.getElementById('bootLoader');
  if (loader) {
    loader.classList.add('hide');
    setTimeout(() => loader.remove(), 300);
  }
}
function showApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').style.display = '';
  hideBootLoader();
}
function showAuth() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('authScreen').style.display = '';
  AuthState.screen = 'welcome';
  renderWelcomeScreen();
  hideBootLoader();
}

async function boot() {
  await localDB.open();

  document.getElementById('btnQuickAdd').addEventListener('click', () => openProductEditor());

  // Espera a que el módulo de Firebase (script type=module) esté listo, con un límite por si el navegador lo bloquea
  if (!window.Firebase) {
    await new Promise(resolve => {
      const t = setTimeout(resolve, 4000);
      window.addEventListener('firebase-ready', () => { clearTimeout(t); resolve(); }, { once: true });
    });
  }

  if (!window.Firebase) {
    // Sin Firebase disponible (bloqueado, sin red la primera vez): dejamos usar la app en modo local
    await seedIfEmpty();
    await startAppSession();
    return;
  }

  window.Firebase.onAuthChange(async (user) => {
    if (user) {
      syncEngine.adapter.setUser(user.uid);
      // Esperamos una primera pasada de sincronización con Firestore ANTES de sembrar datos por
      // defecto, para no crear categorías/monedas duplicadas cuando el usuario ya tiene datos
      // en la nube pero este dispositivo aún no los ha descargado.
      await pullInitialCloudSnapshot();
      await seedIfEmpty();
      await startAppSession(user);
      syncEngine.startWatching(() => refreshCoreDataAndRerender());
      await syncEngine.attemptSync();
    } else {
      if (syncEngine.adapter.stopAll) syncEngine.adapter.stopAll();
      showAuth();
    }
  });
}

// Trae una foto inicial de cada colección desde Firestore y la aplica localmente,
// antes de decidir si hace falta sembrar datos por defecto.
async function pullInitialCloudSnapshot() {
  if (!(syncEngine.adapter instanceof FirebaseCloudAdapter) || !window.Firebase) return;
  const { collection, getDocs, db } = window.Firebase;
  if (!getDocs) return; // por si el navegador cargó una versión del SDK sin este helper
  for (const storeName of syncEngine.syncableStores) {
    try {
      const ref = collection(db, 'users', syncEngine.adapter.uid, storeName);
      const snap = await getDocs(ref);
      for (const docSnap of snap.docs) {
        await syncEngine.applyRemoteChange(storeName, docSnap.data(), 'added');
      }
    } catch (err) {
      console.warn('No se pudo traer snapshot inicial de', storeName, err);
    }
  }
}

async function startAppSession(user) {
  await refreshCoreData();

  document.getElementById('hdrDate').textContent = new Date().toLocaleDateString('es-DO', { weekday: 'long', day: 'numeric', month: 'short' });
  const settings = await Repo.getSettings();
  document.getElementById('hdrStore').textContent = (settings && settings.appName) || 'Smart Grocery Manager';

  renderBottomNav();
  // Pintamos el contenido real ANTES de mostrar #app y ocultar el loader, para que en
  // ningún momento quede una pantalla en blanco entre "loader oculto" y "contenido listo".
  let initialRoute = AppState.route;
  if (!initialRoute) {
    try { initialRoute = localStorage.getItem('sgm_last_route') || 'home'; } catch (e) { initialRoute = 'home'; }
  }
  await navigate(initialRoute, AppState.routeParams, true);
  showApp();
}

async function refreshCoreDataAndRerender() {
  await refreshCoreData();
  if (AppState.route) navigate(AppState.route, AppState.routeParams, true);
}

boot();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

</script>
